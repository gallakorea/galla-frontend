<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>메시지 - GALLA</title>
  <link rel="stylesheet" href="./css/header.css?v=072022">
  <link rel="stylesheet" href="./css/nav.css?v=072022">
  <link rel="stylesheet" href="./css/dm.css?v=072022">
  <link rel="stylesheet" href="./css/dm-quiet.css?v=072022">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/app-icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/app-icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="stylesheet" href="./css/theme.css?v=072022">
</head>
<body data-page="dm">
<div id="app">

  <!-- 헤더 — 홈과 동일 문법: [+] [로고] [♥] -->
  <header class="header header-common">
    <div class="header-inner header-3">
      <button class="hdr-btn hdr-write" id="hdrWrite" aria-label="글쓰기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <img src="assets/logo.png" alt="GALLA" class="logo" onclick="location.href='index.html'" />
      <span class="hdr-group hdr-right">
        <button class="hdr-btn" id="pgDmGear" data-act="settings" aria-label="메시지 설정">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
        </button>
        <button class="hdr-btn" id="pgDmCompose" aria-label="새 메시지">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
      </span>
    </div>
  </header>

  <!-- DM은 여기 인라인으로 렌더된다 (dm.js 페이지 모드) -->
  <main id="dm-page-host"></main>

  <nav class="nav">
    <div class="nav-inner">
      <button class="nav-item" data-page="index" data-target="index.html"><img src="./assets/icons/nav-home.svg" data-base="./assets/icons/nav-home.svg" data-active="./assets/icons/nav-home-active.svg"></button>
      <button class="nav-item" data-page="predict" data-target="galla-predict.html"><img src="./assets/icons/nav-predict.svg" data-base="./assets/icons/nav-predict.svg" data-active="./assets/icons/nav-predict-active.svg"></button>
      <button class="nav-item nav-dm" data-page="dm" data-target="dm.html"><img src="./assets/icons/nav-dm.svg" data-base="./assets/icons/nav-dm.svg" data-active="./assets/icons/nav-dm-active.svg"><span class="nav-badge" id="navDmBadge" hidden></span></button>
      <button class="nav-item" data-page="trend" data-target="search.html"><img src="./assets/icons/nav-trend.svg" data-base="./assets/icons/nav-trend.svg" data-active="./assets/icons/nav-trend-active.svg"></button>
      <button class="nav-item" data-page="mypage" data-target="mypage.html"><img src="./assets/icons/nav-user.svg" data-base="./assets/icons/nav-user.svg" data-active="./assets/icons/nav-user-active.svg"></button>
    </div>
  </nav>

</div>

<script src="./vendor/supabase.js?v=072022"></script>
<script src="js/supabase.js?v=072022"></script>
<script src="./js/battle-fx.js?v=072022"></script>
<script src="js/dm.js?v=072022"></script>
<script src="js/nav.js?v=072022"></script>
<script>
  // 헤더 배선 — 홈과 동일
  document.addEventListener('DOMContentLoaded', async () => {
    document.getElementById('hdrWrite')?.addEventListener('click',
      () => window.openWriteHub ? window.openWriteHub('galla') : location.href = 'write.html');
  });
</script>
<script src="js/duel-alert.js?v=072022"></script>
<script src="/js/analytics.js?v=072022"></script>
<script src="/js/pwa.js?v=072022"></script>
</body>
</html>
