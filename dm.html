<body data-page="dm">
<div id="app">

  <!-- 헤더 — 홈과 동일 문법: [+] [로고] [♥] -->
  <header class="header header-common">
    <div class="header-inner header-3">
      <button class="hdr-btn hdr-write" id="hdrWrite" aria-label="글쓰기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <img src="assets/logo.png" alt="GALLA" class="logo" onclick="location.href='index.html'" />
      <span class="hdr-group hdr-right">
        <button class="hdr-btn" id="pgDmGear" data-act="settings" aria-label="메시지 설정">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
        </button>
        <button class="hdr-btn" id="pgDmCompose" aria-label="새 메시지">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
      </span>
    </div>
  </header>

  <!-- DM은 여기 인라인으로 렌더된다 (dm.js 페이지 모드) -->
  <main id="dm-page-host">
  <!-- 첫 방문 전 스켈레톤 — 스와이프 미리보기·첫 페인트에서 '검은 카드' 방지.
       data-snap-ghost: 진짜 DM UI가 뜨거나 지난 화면 스냅샷이 있으면 걷힌다 -->
  <div data-snap-ghost aria-hidden="true" style="pointer-events:none;padding:18px 16px 0;max-width:520px;margin:0 auto">
    <div style="font-size:22px;font-weight:900;color:#fff;margin:6px 2px 14px">메시지</div>
    <div style="display:flex;gap:8px;margin-bottom:16px">
      <span style="flex:0 0 auto;padding:8px 16px;border-radius:99px;background:rgba(255,255,255,.12);color:#fff;font-size:13px;font-weight:800">채팅</span>
      <span style="flex:0 0 auto;padding:8px 16px;border-radius:99px;background:rgba(255,255,255,.05);color:#8a8f9a;font-size:13px;font-weight:800">친구</span>
      <span style="flex:0 0 auto;padding:8px 16px;border-radius:99px;background:rgba(255,255,255,.05);color:#8a8f9a;font-size:13px;font-weight:800">난장</span>
      <span style="flex:0 0 auto;padding:8px 16px;border-radius:99px;background:rgba(255,255,255,.05);color:#8a8f9a;font-size:13px;font-weight:800">삐삐</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:18px">
      <div style="display:flex;gap:12px;align-items:center"><i style="width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.07)"></i><span style="flex:1"><i style="display:block;width:38%;height:12px;border-radius:6px;background:rgba(255,255,255,.09);margin-bottom:8px"></i><i style="display:block;width:66%;height:10px;border-radius:6px;background:rgba(255,255,255,.05)"></i></span></div>
      <div style="display:flex;gap:12px;align-items:center"><i style="width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.07)"></i><span style="flex:1"><i style="display:block;width:52%;height:12px;border-radius:6px;background:rgba(255,255,255,.09);margin-bottom:8px"></i><i style="display:block;width:44%;height:10px;border-radius:6px;background:rgba(255,255,255,.05)"></i></span></div>
      <div style="display:flex;gap:12px;align-items:center"><i style="width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.07)"></i><span style="flex:1"><i style="display:block;width:30%;height:12px;border-radius:6px;background:rgba(255,255,255,.09);margin-bottom:8px"></i><i style="display:block;width:58%;height:10px;border-radius:6px;background:rgba(255,255,255,.05)"></i></span></div>
    </div>
  </div>
</main>
<!-- 📸 지난 DM 화면 잔상(고스트) — 진짜 UI가 뜨면 자동 제거 -->
<script src="js/snapshot.js?v=072190"></script>

  <nav class="nav">
    <div class="nav-inner">
      <button class="nav-item" data-page="index" data-target="index.html"><img src="./assets/icons/nav-home.svg" data-base="./assets/icons/nav-home.svg" data-active="./assets/icons/nav-home-active.svg"></button>
      <button class="nav-item" data-page="predict" data-target="galla-predict.html"><img src="./assets/icons/nav-predict.svg" data-base="./assets/icons/nav-predict.svg" data-active="./assets/icons/nav-predict-active.svg"></button>
      <button class="nav-item nav-dm" data-page="dm" data-target="dm.html"><img src="./assets/icons/nav-dm.svg" data-base="./assets/icons/nav-dm.svg" data-active="./assets/icons/nav-dm-active.svg"><span class="nav-badge" id="navDmBadge" hidden></span></button>
      <button class="nav-item" data-page="trend" data-target="search.html"><img src="./assets/icons/nav-trend.svg" data-base="./assets/icons/nav-trend.svg" data-active="./assets/icons/nav-trend-active.svg"></button>
      <button class="nav-item" data-page="mypage" data-target="mypage.html"><img src="./assets/icons/nav-user.svg" data-base="./assets/icons/nav-user.svg" data-active="./assets/icons/nav-user-active.svg"></button>
    </div>
  </nav>

</div>

<script>
  // 헤더 ＋ = 다른 페이지와 동일하게 '새로 만들기' 선택 페이지로.
  // (write-hub.js가 없는 페이지라 폴백이 write.html(새 갈라 직행)으로 떨어져
  //  쓰기 유형 선택을 건너뛰던 버그 — 사장님 제보)
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('hdrWrite')?.addEventListener('click',
      () => { location.href = 'create.html'; });
  });
</script>
