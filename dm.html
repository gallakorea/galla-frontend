<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>메시지 - GALLA</title>
  <link rel="stylesheet" href="./css/header.css?v=072020">
  <link rel="stylesheet" href="./css/nav.css?v=072020">
  <link rel="stylesheet" href="./css/dm.css?v=072020">
  <link rel="stylesheet" href="./css/dm-quiet.css?v=072020">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/app-icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/app-icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="stylesheet" href="./css/theme.css?v=072020">
</head>
<body data-page="dm">
<div id="app">

  <!-- 헤더 — 홈과 동일 문법: [+] [로고] [♥] -->
  <header class="header header-common">
    <div class="header-inner header-3">
      <button class="hdr-btn hdr-write" id="hdrWrite" aria-label="글쓰기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <img src="assets/logo.png" alt="GALLA" class="logo" onclick="location.href='index.html'" />
      <button class="hdr-btn hdr-noti" id="hdrNoti" aria-label="알림">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 1 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span class="noti-badge" id="notiBadge" hidden></span>
      </button>
    </div>
  </header>

  <!-- DM은 여기 인라인으로 렌더된다 (dm.js 페이지 모드) -->
  <main id="dm-page-host"></main>

  <nav class="nav">
    <div class="nav-inner">
      <button class="nav-item" data-page="index" data-target="index.html"><img src="./assets/icons/nav-home.svg" data-base="./assets/icons/nav-home.svg" data-active="./assets/icons/nav-home-active.svg"></button>
      <button class="nav-item" data-page="predict" data-target="galla-predict.html"><img src="./assets/icons/nav-predict.svg" data-base="./assets/icons/nav-predict.svg" data-active="./assets/icons/nav-predict-active.svg"></button>
      <button class="nav-item nav-dm" data-page="dm" data-target="dm.html"><img src="./assets/icons/nav-dm.svg" data-base="./assets/icons/nav-dm.svg" data-active="./assets/icons/nav-dm-active.svg"><span class="nav-badge" id="navDmBadge" hidden></span></button>
      <button class="nav-item" data-page="trend" data-target="search.html"><img src="./assets/icons/nav-trend.svg" data-base="./assets/icons/nav-trend.svg" data-active="./assets/icons/nav-trend-active.svg"></button>
      <button class="nav-item" data-page="mypage" data-target="mypage.html"><img src="./assets/icons/nav-user.svg" data-base="./assets/icons/nav-user.svg" data-active="./assets/icons/nav-user-active.svg"></button>
    </div>
  </nav>

</div>

<script src="./vendor/supabase.js?v=072020"></script>
<script src="js/supabase.js?v=072020"></script>
<script src="./js/battle-fx.js?v=072020"></script>
<script src="js/notifications.js?v=072020"></script>
<script src="js/dm.js?v=072020"></script>
<script src="js/nav.js?v=072020"></script>
<script>
  // 헤더 배선 — 홈과 동일
  document.addEventListener('DOMContentLoaded', async () => {
    document.getElementById('hdrWrite')?.addEventListener('click',
      () => window.openWriteHub ? window.openWriteHub('galla') : location.href = 'write.html');
    const t = setInterval(() => {
      if (window.supabaseClient && window.initNotifications) { clearInterval(t); window.initNotifications(); }
    }, 40);
  });
</script>
<script src="js/duel-alert.js?v=072020"></script>
<script src="/js/analytics.js?v=072020"></script>
<script src="/js/pwa.js?v=072020"></script>
</body>
</html>
