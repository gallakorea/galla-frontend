<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>마이페이지 - GALLA</title>

    <link rel="stylesheet" href="./css/header.css?v=072479">
    <link rel="stylesheet" href="./css/notifications.css?v=072479">
    <link rel="stylesheet" href="./css/write-hub.css?v=072479">
    <link rel="stylesheet" href="./css/dm.css?v=072479">
    <link rel="stylesheet" href="./css/dm-quiet.css?v=072479">
    <link rel="stylesheet" href="./css/nav.css?v=072479">
    <link rel="stylesheet" href="./css/items.css?v=072479">
  <!-- GALLA 앱 아이콘 / PWA (auto-injected) -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/app-icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/app-icons/favicon-16.png">
  <link rel="apple-touch-icon" href="/assets/app-icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="갈라">
  <link rel="stylesheet" href="./css/theme.css?v=072479">
<link rel="stylesheet" href="css/auth.css?v=072479">
<link rel="stylesheet" href="./css/desktop.css?v=072479">
  <script src="/js/auth-gate.js?v=072479"></script>
  <!-- 앱 스플래시(로딩) 화면 — 세션 1회, head 동기 로드로 즉시 페인트 -->
  <script src="/js/splash-boot.js?v=072479"></script>
</head>

<body data-page="mypage">

<div id="app">

    <!-- HEADER -->
    <header class="header">
        <div class="header-inner header-3">
            <button class="hdr-btn hdr-write" data-write-hub="galla" aria-label="글쓰기">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <img src="assets/logo.png" class="logo" onclick="location.href='index.html'">
            <div class="mp-hdr-actions" id="mpHdrActions">
                <button class="hdr-btn hdr-noti" id="hdrNoti" aria-label="알림">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 1 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span class="noti-badge" id="notiBadge" hidden></span>
        </button>
                <button class="hdr-btn" aria-label="설정" onclick="location.href='settings.html'">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- PROFILE -->
    <section class="profile-section">
        <div class="mp-top">
            <div class="mp-ava-ring">
                <img src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" class="profile-img" id="profileImg" alt="">
                <span class="mp-tier-chip" id="tierChip" onclick="location.href='grade.html'"></span>
            </div>
            <div class="stats-row">
                <div class="stat-unit">
                    <div class="stat-num" id="statDrop">0</div>
                    <div class="stat-label">My Drop</div>
                </div>
                <div class="stat-unit">
                    <div class="stat-num" id="statFollowers">0</div>
                    <div class="stat-label">팔로워</div>
                </div>
                <div class="stat-unit stat-pro">
                    <div class="stat-num" id="statSupports">0</div>
                    <div class="stat-label">지지</div>
                </div>
                <div class="stat-unit stat-con">
                    <div class="stat-num" id="statOppose">0</div>
                    <div class="stat-label">반발</div>
                </div>
            </div>
        </div>

        <div class="mp-idline">
            <span class="profile-name" id="profileName"></span>
            <span class="level" onclick="location.href='grade.html'" id="levelText"></span>
            <span class="mp-power" id="powerText"></span>
        </div>

        <div class="level-row">
            <span class="badge" onclick="location.href='quest.html'" id="badgeText"></span>
        </div>

        <div class="profile-desc" id="profileDesc"></div>

        <div class="profile-actions" id="profileActions"></div>
    </section>

    <!-- 후원 수익 (받은 후원이 있을 때만) -->
    <section id="mp-earnings" hidden></section>

    <!-- TABS: 갈라 / 예측 / 뉴스 / 광장 (각 산하 My·Saved 서브탭) -->
    <section class="tabs">
        <div class="tab active" data-tab="galla">갈라</div>
        <div class="tab" data-tab="predict">예측</div>
        <div class="tab" data-tab="news">뉴스</div>
        <div class="tab" data-tab="plaza">광장</div>
    </section>

    <!-- SUB TABS (갈라 전용; 예측·광장은 tabContent 내부에서 렌더) -->
    <div id="mpSubBar" class="mp-subbar"></div>

    <!-- CONTENT -->
    <section id="tabContent" class="content-area"></section>

</div>

<!-- NAVIGATION -->
<nav class="nav">
  <div class="nav-inner">
      <button class="nav-item" data-page="index" data-target="index.html">
        <img src="./assets/icons/nav-home.svg"
             data-base="./assets/icons/nav-home.svg"
             data-active="./assets/icons/nav-home-active.svg">
      </button>

      <button class="nav-item" data-page="predict" data-target="galla-predict.html">
        <img src="./assets/icons/nav-predict.svg"
             data-base="./assets/icons/nav-predict.svg"
             data-active="./assets/icons/nav-predict-active.svg">
      </button>

      <button class="nav-item nav-dm" data-page="dm" data-target="dm.html" aria-label="메시지"><img src="./assets/icons/nav-dm.svg" data-base="./assets/icons/nav-dm.svg" data-active="./assets/icons/nav-dm-active.svg"><span class="nav-badge" id="navDmBadge" hidden></span></button>

      <button class="nav-item" data-page="trend" data-target="search.html"><img src="./assets/icons/nav-trend.svg" data-base="./assets/icons/nav-trend.svg" data-active="./assets/icons/nav-trend-active.svg"></button>

      <button class="nav-item" data-page="mypage" data-target="mypage.html">
        <img src="./assets/icons/nav-user.svg"
             data-base="./assets/icons/nav-user.svg"
             data-active="./assets/icons/nav-user-active.svg">
      </button>
    </div>
</nav>

<script src="/js/pwa.js?v=072479"></script>
  <script src="/js/pull-refresh.js?v=072479"></script>
</body>
</html>
