<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>랜덤 갈라 뽑기 - GALLA</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/random.css?v=072814">
    <link rel="stylesheet" href="css/index.css?v=072814">
  <!-- GALLA 앱 아이콘 / PWA (auto-injected) -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/app-icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/app-icons/favicon-16.png">
  <link rel="apple-touch-icon" href="/assets/app-icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="갈라">
  <link rel="stylesheet" href="./css/theme.css?v=072814">
</head>

<body data-page="random">
<div id="app">

    <!-- HEADER -->
    <header class="header">
        <div class="header-inner">
            <img src="assets/logo.png" class="logo" onclick="location.href='index.html'">

            <!-- 로그인/로그아웃 자동 전환 -->
            <div class="auth-buttons" id="authButtons">
                <!-- 로그인 전 -->
                <button onclick="location.href='login.html'" id="loginBtn">로그인</button>
                <button onclick="location.href='signup.html'" id="signupBtn">회원가입</button>

                <!-- 로그인 후 -->
                <button onclick="location.href='mypage.html'" id="mypageBtn" style="display:none;">마이페이지</button>
            </div>
        </div>
    </header>

    <!-- HERO -->
    <section class="random-hero">
        <div class="tornado-icon">
            <svg width="46" height="46" viewBox="0 0 24 24" fill="none"
                stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16M2 8h20M5 12h14M7 16h10M9 20h6"/>
            </svg>
        </div>

        <h1>랜덤 갈라 뽑기</h1>
        <p>오늘 당신이 보게 될 논쟁은?</p>
    </section>

    <!-- SLOT -->
    <section class="slot-area">
        <div id="slot1" class="slot-box">정치</div>
        <div id="slot2" class="slot-box">월급</div>
        <div id="slot3" class="slot-box">세대</div>
    </section>

    <!-- RANDOM BUTTON -->
    <div class="random-btn-wrap">
        <button id="randomBtn" class="random-btn">🎲 RANDOM 뽑기</button>
    </div>

    <!-- 즉시 랜덤 버튼 -->
    <button id="floatingRandom" class="floating-random hidden">
        ⭐ 즉시 랜덤
    </button>

    <!-- 랜덤 결과 -->
    <section id="resultArea" class="result-area"></section>

    <!-- 랜덤 피드 -->
    <section id="randomFeed" class="random-feed"></section>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
        <button class="nav-item" data-target="index.html">
            <img src="assets/icons/nav-home.svg" class="nav-icon">
            <div class="nav-indicator"></div>
        </button>

        <button class="nav-item" data-target="search.html">
            <img src="assets/icons/nav-search.svg" class="nav-icon">
            <div class="nav-indicator"></div>
        </button>

        <button class="nav-item" data-target="write.html">
            <img src="assets/icons/nav-write.svg" class="nav-icon">
            <div class="nav-indicator"></div>
        </button>

        <button class="nav-item active" data-target="random.html">
            <img src="assets/icons/nav-random.svg" class="nav-icon">
            <div class="nav-indicator"></div>
        </button>

        <button class="nav-item" data-target="mypage.html">
            <img src="assets/icons/nav-user.svg" class="nav-icon">
            <div class="nav-indicator"></div>
        </button>
    </nav>

</div>

<!-- Scripts -->
<script src="/js/error-logger.js?v=072814"></script>
  <script src="./vendor/supabase.js?v=072814"></script>
<script src="js/supabase.js?v=072814"></script>
<script src="js/random.js?v=072814"></script>

<!-- ⭐ LOGIN 상태 UI 반영 -->
<script>
document.addEventListener("DOMContentLoaded", async () => {
    const { data } = await supabase.auth.getSession();
    const session = data.session;

    const loginBtn = document.getElementById("loginBtn");
    const signupBtn = document.getElementById("signupBtn");
    const mypageBtn = document.getElementById("mypageBtn");

    if (session?.user) {
        // 로그인 상태 → 마이페이지 표시
        loginBtn.style.display = "none";
        signupBtn.style.display = "none";
        mypageBtn.style.display = "inline-block";
    } else {
        // 로그아웃 상태 → 로그인/회원가입 표시
        loginBtn.style.display = "inline-block";
        signupBtn.style.display = "inline-block";
        mypageBtn.style.display = "none";
    }
});
</script>

<!-- ⭐ RANDOM 버튼 클릭 시 로그인 필수 -->
<script>
document.getElementById("randomBtn").addEventListener("click", async () => {
    const { data } = await supabase.auth.getSession();

    if (!data.session?.user) {
        alert("랜덤 뽑기는 로그인 후 이용 가능합니다.");
        location.href = "login.html";
        return;
    }

    // 로그인되어 있으면 실제 랜덤 실행
    runRandom();
});
</script>

<!-- ⭐ NAVIGATION HANDLER -->
<script>
    document.querySelectorAll(".nav-item").forEach(item => {
        item.addEventListener("click", async () => {
            const target = item.dataset.target;

            // write / random / mypage → 로그인 필수
            const needLogin = ["write.html", "random.html", "mypage.html"];

            if (needLogin.includes(target)) {
                const { data } = await supabase.auth.getSession();

                if (!data.session?.user) {
                    alert("로그인이 필요한 페이지입니다.");
                    location.href = "login.html";
                    return;
                }
            }

            if (target) location.href = target;
        });
    });
</script>

<script src="/js/analytics.js?v=072814"></script>
<script src="/js/pwa.js?v=072814"></script>
  <script src="/js/pull-refresh.js?v=072814"></script>
</body>
</html>
