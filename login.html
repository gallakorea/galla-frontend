<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>로그인 - GALLA</title>
    <link rel="stylesheet" href="css/login.css?v=072652">
    <link rel="stylesheet" href="css/auth.css?v=072652">
  <!-- GALLA 앱 아이콘 / PWA (auto-injected) -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/app-icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/app-icons/favicon-16.png">
  <link rel="apple-touch-icon" href="/assets/app-icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="갈라">
  <link rel="stylesheet" href="./css/theme.css?v=072652">
  <!-- 앱 스플래시(로딩) 화면 — 세션 1회, head 동기 로드로 즉시 페인트 -->
  <script src="/js/splash-boot.js?v=072652"></script>
</head>

<body data-page="mypage">

<div class="auth-wrap">
  <div class="auth-glow"></div>

  <button class="auth-back" data-back="index.html" aria-label="뒤로">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>

  <div class="auth-inner">

    <!-- BRAND -->
    <div class="auth-brand">
      <img src="assets/logo.png" alt="GALLA" class="auth-logo" />
      <p class="auth-tagline">여론이 에너지가 되는 곳</p>
    </div>

    <!-- CARD -->
    <div class="auth-card">
      <h1 class="auth-title">다시 오셨군요 👋</h1>
      <p class="auth-sub">로그인하고 GP·활동 기록·보상을 이어가세요.</p>

      <div class="field">
        <label class="field-label" for="email">이메일</label>
        <input type="email" id="email" class="field-input" placeholder="example@galla.com" autocomplete="email" inputmode="email">
      </div>

      <div class="field">
        <label class="field-label" for="password">비밀번호</label>
        <div class="pw-wrap">
          <input type="password" id="password" class="field-input" placeholder="비밀번호 입력" autocomplete="current-password">
          <button type="button" class="pw-toggle" data-for="password" aria-label="비밀번호 표시">👁</button>
        </div>
      </div>

      <div class="auth-row-right">
        <span class="link-muted" onclick="location.href='reset.html'">비밀번호를 잊으셨나요?</span>
      </div>

      <button class="auth-btn" id="loginBtn">로그인</button>

      <div class="auth-foot">
        아직 계정이 없나요? <span class="link-gold" onclick="location.href='signup.html'">회원가입</span>
      </div>
    </div>

  </div>
</div>

<!-- Supabase CDN -->
<script src="/js/error-logger.js?v=072652"></script>
  <script src="./vendor/supabase.js?v=072652"></script>
<script src="js/supabase.js?v=072652"></script>
<script src="js/back.js?v=072652"></script>
<script src="js/login.js?v=072652"></script>
<script src="js/social-auth.js?v=072652"></script>

<!-- 비밀번호 표시/숨김 (부가 UX) -->
<script>
  document.querySelectorAll('.pw-toggle').forEach(function(b){
    b.addEventListener('click', function(){
      var i = document.getElementById(b.dataset.for);
      if(!i) return;
      var show = i.type === 'password';
      i.type = show ? 'text' : 'password';
      b.textContent = show ? '🙈' : '👁';
      b.classList.toggle('on', show);
    });
  });
</script>

<script src="/js/analytics.js?v=072652"></script>
<script src="/js/pwa.js?v=072652"></script>
  <script src="/js/pull-refresh.js?v=072652"></script>
</body>
</html>
