<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>갈라 광장 - GALLA</title>

  <!-- plaza 전용 CSS -->
  <link rel="stylesheet" href="css/plaza.css?v=0718l">
  <link rel="stylesheet" href="./css/header.css?v=0718l">
  <link rel="stylesheet" href="./css/write-hub.css?v=0718l">
  <link rel="stylesheet" href="./css/dm.css?v=0718l">
  <link rel="stylesheet" href="./css/user-sheet.css?v=0718l">
  <link rel="stylesheet" href="./css/nav.css?v=0718l">
  <link rel="stylesheet" href="./css/composer-page.css?v=0718l">
  <!-- GALLA 앱 아이콘 / PWA (auto-injected) -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/app-icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/app-icons/favicon-16.png">
  <link rel="apple-touch-icon" href="/assets/app-icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="갈라">
  <link rel="stylesheet" href="./css/theme.css?v=0718l">
</head>

<body data-page="plaza">
<div id="app">

  <!-- HEADER (COMMON) -->
  <header class="header">
    <div class="header-inner header-3">
      <button class="hdr-btn hdr-write" data-write-hub="plaza" aria-label="글쓰기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <img src="assets/logo.png" class="logo" onclick="location.href='index.html'" />
      <button class="hdr-btn hdr-dm" id="plazaDmBtn" aria-label="메시지">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7A8.5 8.5 0 0 1 12.5 3 8.38 8.38 0 0 1 21 11.5z"/></svg>
        <span class="dm-badge" hidden></span>
      </button>
    </div>
  </header>

  <!-- 가이드 박스 -->
  <section class="plaza-guide">
    <p>
      갈라 광장은 찬반 없는 자유 토론 공간입니다.<br>
      사진·동영상·링크와 함께 자유롭게 이야기를 나눠요.
    </p>
  </section>

  <!-- 카테고리 -->
  <section class="plaza-categories">
    <button class="active">전체</button>
    <button>정치</button>
    <button>사회</button>
    <button>경제</button>
    <button>투자</button>
    <button>직장</button>
    <button>커리어·이직</button>
    <button>연애</button>
    <button>결혼·육아</button>
    <button>인간관계</button>
    <button>일상</button>
    <button>패션·뷰티</button>
    <button>엔터</button>
    <button>스포츠</button>
    <button>여행</button>
    <button>맛집</button>
    <button>가치·논쟁</button>
    <button>불만·푸념</button>
    <button>19금</button>
    <button>기타</button>
  </section>

<!-- 글 리스트 (JS로 채움) -->
<ul class="plaza-list" id="plaza-list"></ul>

  <!-- WRITE MODAL -->
  <div id="plaza-write-modal" class="plaza-modal hidden">
    <div class="plaza-modal-backdrop" onclick="closePlazaWriteModal()"></div>

    <div class="plaza-modal-box">
      <h2 class="modal-title">갈라 광장에 글쓰기</h2>
      <div class="modal-category">
        <select id="plaza-category">
          <option value="">카테고리 선택</option>
          <option>정치</option>
          <option>사회</option>
          <option>경제</option>
          <option>투자</option>
          <option>직장</option>
          <option>연애</option>
          <option>결혼</option>
          <option>일상</option>
          <option>패션·뷰티</option>
          <option>엔터</option>
          <option>스포츠</option>
          <option>여행</option>
          <option>맛집</option>
          <option>19금</option>
          <option>기타</option>
        </select>
      </div>

      <input
        type="text"
        id="plaza-title"
        placeholder="제목"
        maxlength="120"
      />

      <!-- EDITOR TOOLBAR -->
      <div class="editor-toolbar" id="plaza-toolbar">
        <div class="tb-row">
          <button type="button" class="tb-btn" data-fmt="bold" title="굵게"><b>B</b></button>
          <button type="button" class="tb-btn" data-fmt="italic" title="기울임"><i>I</i></button>
          <button type="button" class="tb-btn" data-fmt="strike" title="취소선"><s>S</s></button>
          <span class="tb-sep"></span>
          <button type="button" class="tb-btn" data-fmt="quote" title="인용">❝</button>
          <button type="button" class="tb-btn" data-fmt="list" title="목록">☰</button>
          <button type="button" class="tb-btn" data-fmt="link" title="링크">🔗</button>
        </div>
        <div class="tb-row">
          <button type="button" class="tb-btn tb-media" id="tb-photo">📷 사진</button>
          <button type="button" class="tb-btn tb-media" id="tb-video">🎬 동영상</button>
          <button type="button" class="tb-btn tb-media" id="tb-extimg">🖼 외부이미지</button>
          <button type="button" class="tb-btn tb-media" id="tb-embed">▶ 유튜브·임베드</button>
          <button type="button" class="tb-btn tb-preview" id="tb-preview">👁 미리보기</button>
        </div>
      </div>

      <!-- EDITOR BODY -->
      <div class="editor-body" id="editorBody">
        <textarea
          id="plaza-body"
          placeholder="자유롭게 작성하세요. 사진·동영상·링크를 넣고, 이미지는 드래그하거나 붙여넣어 올릴 수 있어요."
          maxlength="10000"
        ></textarea>
        <div id="plaza-preview" class="plaza-preview" hidden></div>
        <div id="plaza-drophint" class="plaza-drophint" hidden>여기에 놓아 업로드</div>
      </div>

      <!-- 첨부 미리보기 스트립 -->
      <div id="plaza-attach" class="plaza-attach" hidden></div>

      <div class="char-counter">
        <span id="char-count">0</span> / 10,000
      </div>

      <label class="plaza-anon-row">
        <input type="checkbox" id="plaza-anon" />
        익명으로 표시 <span class="anon-note">(작성 기록은 정책에 따라 보관됩니다)</span>
      </label>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="closePlazaWriteModal()">취소</button>
        <button class="btn-submit" id="plaza-submit" disabled>등록하기</button>
      </div>
    </div>
  </div>

  <!-- 글쓰기는 헤더 통합 + 글쓰기 허브로 통일 (하단 바 제거) -->

  <nav class="nav">
    <div class="nav-inner">
      <button class="nav-item" data-page="index" data-target="index.html">
        <img src="./assets/icons/nav-home.svg"
             data-base="./assets/icons/nav-home.svg"
             data-active="./assets/icons/nav-home-active.svg">
      </button>

      <button class="nav-item" data-page="predict" data-target="galla-predict.html">
        <img src="./assets/icons/nav-predict.svg"
             data-base="./assets/icons/nav-predict.svg"
             data-active="./assets/icons/nav-predict-active.svg">
      </button>

      <button class="nav-item" data-page="search" data-target="search.html">
        <img src="./assets/icons/nav-search.svg"
             data-base="./assets/icons/nav-search.svg"
             data-active="./assets/icons/nav-search-active.svg">
      </button>

      <button class="nav-item" data-page="plaza" data-target="plaza.html">
        <img src="./assets/icons/nav-plaza.svg"
             data-base="./assets/icons/nav-plaza.svg"
             data-active="./assets/icons/nav-plaza-active.svg">
      </button>

      <button class="nav-item" data-page="mypage" data-target="mypage.html">
        <img src="./assets/icons/nav-user.svg"
             data-base="./assets/icons/nav-user.svg"
             data-active="./assets/icons/nav-user-active.svg">
      </button>
    </div>
  </nav>

</div>
<script src="./vendor/supabase.js?v=0718l"></script>
<script src="js/follow.js?v=0718l"></script>
<script src="js/plaza-render.js?v=0718l"></script>
<script src="js/write-hub.js?v=0718l"></script>
<script src="js/dm.js?v=0718l"></script>
<script src="js/user-sheet.js?v=0718l"></script>
<script src="js/share-sheet.js?v=0718l"></script>
<script src="js/report-block.js?v=0718l"></script>
<script type="module" src="js/plaza.js?v=0718l"></script>
<script src="js/composer-page.js?v=0718l"></script>
<script src="js/nav.js?v=0718l"></script>
</body>
</html>
