<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <title>GALLA – Header/Nav Test</title>

  <!-- 공통 헤더 -->

  <style>
    /* ===== 테스트용 콘텐츠 ===== */
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
    }

    #app {
      max-width: 480px;
      margin: 0 auto;
      padding-bottom: 58px; /* 네비 높이 */
    }

    .test-section {
      padding: 20px 16px;
      border-bottom: 1px solid #111;
    }

    .test-section h2 {
      font-size: 18px;
      margin-bottom: 12px;
    }

    .test-box {
      height: 120px;
      border-radius: 14px;
      background: linear-gradient(180deg, #111, #050505);
      border: 1px solid #222;
      margin-bottom: 16px;
    }
  </style>
  <!-- GALLA 앱 아이콘 / PWA (auto-injected) -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/app-icons/favicon-32.png">

  <link rel="apple-touch-icon" href="/assets/app-icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

            onclick="(window.GALLA_nav||function(u){location.href=u})('index.html')"

        <div class="header-right">
          <button class="header-icon" onclick="alert('DM')">
            <img src="assets/icons/icon-share.svg" alt="Share" />
          </button>
        </div>

      </div>
    </header>

    <!-- ===== 테스트 콘텐츠 ===== -->

      <h2>Header + Nav Scroll Test</h2>
      <div class="test-box"></div>
      <div class="test-box"></div>
      <div class="test-box"></div>

    <section class="test-section">

      <div class="test-box"></div>
      <div class="test-box"></div>
      <div class="test-box"></div>
    </section>

    </section>

  </div>

  <nav class="nav">

      <button class="nav-item">
        <img src="assets/icons/nav-home.svg" />

      <button class="nav-item">
        <img src="assets/icons/nav-search.svg" />

<script src="/js/analytics.js?v=080412"></script>
