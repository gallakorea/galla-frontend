<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="galla-ver" content="0923800"><!-- 배포 도장 — 스냅샷 무효화 기준(스크립트 순서 무관) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>재생 · GALLA</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #p,#p iframe{width:100%;height:100%;border:0;display:block}
  /* 임베드 자체가 소유자에 의해 막힌 영상용 폴백 */
  #err{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
       gap:12px;padding:20px;text-align:center;color:#aeb6c6;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
  #err.on{display:flex}
  #err svg{width:40px;height:40px;color:#5fd8ff;opacity:.9}
  #err p{margin:0;color:#cfd6e6}
  #err a{margin-top:4px;padding:9px 16px;border-radius:999px;background:#1e2532;color:#fff;font-weight:700;text-decoration:none}
  /* 🔈 소리 버튼 — 홈 피드 영상의 음소거 버튼과 같은 SVG·자리(오른쪽 아래). 글자 알약은 없앴다(26.9.19 사장님) */
  #snd{position:absolute;right:10px;bottom:52px;   /* 다른 화면 음소거 버튼과 같은 쪽(오른쪽 아래). 유튜브 컨트롤바를 피해 조금 위 */width:34px;height:34px;display:none;align-items:center;justify-content:center;
       padding:0;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;z-index:5}
  #snd svg{width:18px;height:18px}
  #snd.on{display:flex}
</style>
</head>
<body>
<div id="p"></div>
<div id="err">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
  <p>이 영상은 저작권자 설정으로<br>앱 안에서 재생할 수 없어요.</p>
  <a id="errGo" href="#" target="_blank" rel="noopener">유튜브에서 보기 ↗</a>
</div>
<button id="snd" type="button" aria-label="소리"></button>
<script>
(function(){
  var id = (new URLSearchParams(location.search).get("v") || "").trim();
  /* 🔇 mute=1 — 스크롤로 보여서 저절로 트는 경우(홈 핫튜브, 26.9.19). 사용자 탭이 없어 소리 자동재생은 어차피 막힌다 —
     처음부터 음소거로 시작하고 「소리 켜기」를 바로 띄운다(인스타 피드와 같은 동작). */
  var startMuted = new URLSearchParams(location.search).get("mute") === "1";
  /* 🔗 앱 전역 소리 설정과 한 몸(26.9.19) — 부모(갈라 화면)가 mute 로 시작 상태를 주고, 여기서 누르면 부모에 알려
     다른 영상들도 같이 켜지고 꺼진다. 부모에서 바뀌면(다른 영상에서 켬/끔) 메시지로 받아 따른다. */
  var SVGW = function (inner) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>'; };
  var SPK = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"/>';
  var ICON_OFF = SVGW(SPK + '<line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>');
  var ICON_ON = SVGW(SPK + '<path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>');
  var lastMuted = null, pollTimer = null;
  function readMuted() { try { return player ? (player.isMuted() || player.getVolume() === 0) : startMuted; } catch (_) { return startMuted; } }
  function paintSnd() {
    var m = readMuted(), b = document.getElementById("snd");
    if (!b) return;
    b.innerHTML = m ? ICON_OFF : ICON_ON;
    b.setAttribute("aria-label", m ? "소리 켜기" : "소리 끄기");
    return m;
  }
  /* 🔁 상태 추적 — 사용자가 '유튜브 자체 소리 버튼'을 눌러도 우리 아이콘과 앱 전역 설정이 따라가야 한다.
     플레이어는 그런 변화를 알려 주지 않으므로 0.6초마다 직접 읽는다(재생 중일 때만·가볍다).
     26.9.20 사장님: 「svg 눌러도 소리가 안 나고, 유튜브 소리켬을 눌러도 svg 는 따로 논다」 */
  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(function () {
      if (document.hidden) return;
      var m = readMuted();
      if (m === lastMuted) return;
      lastMuted = m;
      paintSnd();
      tellParent(!m);      // 앱 전역(다른 영상들)도 같이 맞춘다
    }, 600);
  }
  /* 부모가 시킨 변경을 다시 부모에게 되돌려 말하지 않는다 — 소리 자동재생이 막혀 음소거로 남으면
     「사용자가 껐다」로 잘못 읽혀 앱 전역 설정이 꺼져 버린다(되먹임). 1.2초 동안은 보고하지 않는다. */
  var fromParentUntil = 0;
  function tellParent(on) {
    if (Date.now() < fromParentUntil) return;
    try { parent.postMessage({ galla: "yt-sound", on: !!on }, "*"); } catch (_) {}
  }
  window.addEventListener("message", function (e) {
    var d = e.data || {};
    if (d.galla !== "yt-sound-set" || !player) return;
    fromParentUntil = Date.now() + 1200;
    try { if (d.on) { player.unMute(); player.setVolume(100); } else player.mute(); } catch (_) {}
    setTimeout(function () { lastMuted = paintSnd(); }, 300);
  });
  var watch = "https://www.youtube.com/watch?v=" + encodeURIComponent(id);
  document.getElementById("errGo").href = watch;
  if(!id){ document.getElementById("err").classList.add("on"); return; }

  function showErr(){ document.getElementById("err").classList.add("on"); var pp=document.getElementById("p"); if(pp) pp.style.display="none"; }

  // YouTube IFrame Player API — 정식 origin(https://galla.im 등)으로 handshake 하므로
  // capacitor://localhost 오리진에서 나던 '오류 153'을 회피한다. onError는 소유자 임베드차단만.
  //
  // 🔇 두 번 눌러야 재생되던 문제(사장님 2026-08-17)
  //   갈라 카드의 ▶ 를 누른 건 '부모 문서'에서의 탭이다. 유튜브 플레이어는
  //   교차 출처 iframe 이라 그 제스처를 물려받지 못한다. 브라우저는 소리 있는
  //   자동재생을 막으므로 플레이어가 자기 재생 버튼을 띄우고, 사용자는 두 번 누른다.
  //   (앱 WKWebView 는 자동재생이 허용돼 한 번에 됐다 — 그래서 웹에서만 보였다)
  //
  //   해결: 소리 있는 재생을 먼저 시도하고, 잠시 뒤에도 재생이 시작되지 않았으면
  //         '음소거 재생'으로 되돌린다. 음소거 자동재생은 어디서나 허용된다.
  //         화면은 즉시 돌고, 소리만 한 번 더 탭하면 켜진다(프레임 안 탭이라 허용).
  //   ⚠️ 처음부터 음소거로 시작하지 않는다 — 그러면 자동재생이 되는 앱까지
  //      소리 없이 시작해 멀쩡하던 동작이 나빠진다.
  var player = null, started = false;

  /* 소리 버튼은 늘 보인다(켬/끔 둘 다). 누르면 여기와 부모(앱 전역) 둘 다 바뀐다 */
  function showSoundPill(){
    var b = document.getElementById("snd");
    b.classList.add("on");
    lastMuted = paintSnd();
    startPolling();
    b.onclick = function(){
      var toOn = readMuted();
      try{
        if (toOn) { player.unMute(); player.setVolume(100); player.playVideo(); }
        else { player.mute(); }
      }catch(_){}
      /* 브라우저가 '소리 자동재생 금지'로 막으면 unMute 가 먹지 않는다 — 0.4초 뒤 실제 상태를 다시 읽어
         아이콘과 전역을 진짜 상태에 맞춘다(먹은 척하지 않는다). */
      setTimeout(function () {
        var m = readMuted();
        lastMuted = m; paintSnd(); tellParent(!m);
      }, 400);
    };
  }

  window.onYouTubeIframeAPIReady = function(){
    try{
      player = new YT.Player("p", {
        videoId: id, width: "100%", height: "100%",
        playerVars: {
          autoplay: 1, playsinline: 1, rel: 0, modestbranding: 1, fs: 1, mute: startMuted ? 1 : 0,
          origin: location.origin, enablejsapi: 1
        },
        events: {
          onReady: function(e){
            if (startMuted) { try{ e.target.mute(); e.target.playVideo(); }catch(_){} showSoundPill(); return; }
            try{ e.target.playVideo(); }catch(_){}
            // 소리 있는 자동재생이 막혔는지 본다 — 막혔으면 음소거로 다시 시작.
            setTimeout(function(){
              if (started) return;
              try{
                e.target.mute();
                e.target.playVideo();
                showSoundPill();
              }catch(_){}
            }, 900);
          },
          onStateChange: function(e){
            /* BUFFERING 도 '재생이 걸린 것'으로 본다 — 자동재생이 막히면 플레이어는
               UNSTARTED/CUED 에 머물지 버퍼링으로 넘어가지 않는다. 이걸 빼면 느린
               회선에서 아직 버퍼링 중인 정상 재생을 차단으로 오판해 음소거시킨다. */
            if (e.data === YT.PlayerState.PLAYING || e.data === YT.PlayerState.BUFFERING) {
              started = true;
              showSoundPill();   // 소리 버튼은 켬/끔 모두 보여 준다(상태만 아이콘으로)
            }
          },
          // 2/5/100/101/150 = 잘못된 id·삭제·비공개·임베드차단 → 폴백
          onError: function(){ showErr(); }
        }
      });
    }catch(_){ showErr(); }
  };
  var s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  s.onerror = showErr;
  document.head.appendChild(s);
})();
</script>
</body>
</html>
