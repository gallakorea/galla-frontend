<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>최신 버전으로 새로고침</title>
<style>
  html,body{margin:0;height:100%}
  body{background:#0a0a0f;color:#e8e8f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       display:grid;place-items:center;text-align:center;padding:24px}
  .box{max-width:340px}
  .sp{width:34px;height:34px;margin:0 auto 18px;border:3px solid #2a2a3a;border-top-color:#6f86ff;
      border-radius:50%;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  h1{font-size:17px;margin:0 0 6px;font-weight:700}
  p{font-size:13px;color:#9a9ab0;margin:0;line-height:1.6}
</style>
</head>
<body>
<div class="box">
  <div class="sp"></div>
  <h1>최신 버전으로 새로고침 중</h1>
  <p>이 브라우저에 남아 있던 옛 버전 캐시를 정리하고<br>최신 GALLA로 이동합니다. 잠시만요…</p>
</div>
<script>
// 이 페이지 응답에는 _headers 의 Clear-Site-Data: "cache" 가 붙어 있어, 이 페이지가 로드되는
// 순간 브라우저가 HTTP 디스크 캐시와 Cache Storage 를 통째로 비운다(옛 HTML·JS·SW캐시 제거).
// 이어서 서비스워커 등록과 나머지 스토리지 흔적까지 확실히 정리한 뒤 최신 화면으로 이동한다.
// (Clear-Site-Data 는 "cache" 만 지정 — 로그인/설정(localStorage·쿠키)은 건드리지 않는다.)
(async function () {
  try {
    if ('serviceWorker' in navigator) {
      var regs = await navigator.serviceWorker.getRegistrations();
      for (var i = 0; i < regs.length; i++) { try { await regs[i].unregister(); } catch (e) {} }
    }
  } catch (e) {}
  try {
    if (window.caches) {
      var keys = await caches.keys();
      for (var j = 0; j < keys.length; j++) { try { await caches.delete(keys[j]); } catch (e) {} }
    }
  } catch (e) {}
  // 화면 스냅샷(빠른 탭 전환용 저장 화면)도 정리한다 — 옛 골격 스냅샷이 남아 새 화면을
  //   덮는 것을 막는다. 로그인/설정 키(sb-*·supabase·galla_nav 등)는 건드리지 않는다.
  try {
    var rm = [];
    for (var k = 0; k < localStorage.length; k++) { var key = localStorage.key(k); if (key && /snap/i.test(key)) rm.push(key); }
    rm.forEach(function (key) { try { localStorage.removeItem(key); } catch (e) {} });
  } catch (e) {}
  try {
    var rs = [];
    for (var s = 0; s < sessionStorage.length; s++) { var sk = sessionStorage.key(s); if (sk && /snap/i.test(sk)) rs.push(sk); }
    rs.forEach(function (sk) { try { sessionStorage.removeItem(sk); } catch (e) {} });
  } catch (e) {}
  var to = '/search?tab=plaza';
  try {
    var q = new URLSearchParams(location.search).get('to');
    if (q && q.charAt(0) === '/') to = q;   // /flush?to=/xxx 로 목적지 지정 가능
  } catch (e) {}
  // 캐시버스터를 붙여 확실히 네트워크에서 새로 받게 한다.
  location.replace(to + (to.indexOf('?') >= 0 ? '&' : '?') + '_fresh=' + Date.now());
})();
</script>
</body>
</html>
