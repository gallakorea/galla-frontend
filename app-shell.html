<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GALLA 갈라</title>
  <meta name="robots" content="noindex"><!-- 셸은 검색 노출 금지 — 콘텐츠는 실제 페이지들이 담당 -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/app-icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/app-icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <script src="/js/splash-boot.js?v=072499&wait=ready"></script>
  <link rel="stylesheet" href="./css/theme.css?v=072499">
  <link rel="stylesheet" href="./css/nav.css?v=072499">
  <style>
    /* ═══ 🐚 갈라 탭 셸 — 5개 탭이 iframe으로 상주, 전환은 트랙 이동뿐(로딩 0) ═══ */
    html, body { height: 100%; margin: 0; background: #0a0a0b; overflow: hidden; overscroll-behavior: none; }
    #shell-track {
      display: flex; height: 100dvh; width: 500dvw;
      will-change: transform;
      transform: translateX(0);
    }
    #shell-track.anim { transition: transform .3s cubic-bezier(.22,.9,.3,1); }
    .shell-pane { width: 100dvw; height: 100dvh; flex: 0 0 auto; position: relative; background: #0a0a0b; }
    .shell-pane iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #0a0a0b; }
    /* 아직 방문 전 판: 갈라 톤 스피너 */
    .pane-wait { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .pane-wait i { width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.14);
      border-top-color: #6f86ff; animation: shspin .7s linear infinite; }
    @keyframes shspin { to { transform: rotate(360deg); } }
    /* 드래그 촉감 — 나가는 판은 살짝 어두워지고, 들어오는 판은 지연 후 정착(iOS/인스타식) */
    .shell-pane { will-change: transform; }
    .shell-pane .pane-scrim { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 5; }
    #shell-track.settle .shell-pane { transition: transform .3s cubic-bezier(.2,.8,.25,1); }
    #shell-track.settle .pane-scrim { transition: opacity .3s ease; }
    /* 셸 네비는 nav.css 그대로 사용 (트랙 밖 고정 — 전환 중에도 제자리) */
    /* 활성 탭 글라이더 — 인스타식: 활성 아이콘 '뒤'에 알약(캡슐) 배경이 좌우로 미끄러진다.
       (얇은 선 → 캡슐로 교체, 사장님 레퍼런스) 아이콘은 캡슐 위에 뜨게 z-index 정리. */
    .nav-inner { position: relative; }
    .nav-inner .nav-item { position: relative; z-index: 1; }   /* 아이콘이 캡슐 위 */
    /* 셸에선 글라이더 캡슐이 유일한 활성 표시 — nav.css의 .active 원형 배경을 끈다.
       (안 끄면 확정 시 '원(.active bg)+캡슐(glider)'이 크기 다른 채 겹쳐 어긋나 보임) */
    .nav-inner .nav-item.active { background: none; }
    #nav-glider { position: absolute; top: 50%; left: 0; width: 56px; height: 40px; margin-top: -20px;
      border-radius: 20px; background: rgba(255, 255, 255, .12); z-index: 0;
      transition: transform .34s cubic-bezier(.22, .9, .3, 1), opacity .2s ease;
      opacity: 0; pointer-events: none; }
  </style>
</head>
<body data-page="shell">

<div id="shell-track">
  <div class="shell-pane" data-tab="index"></div>
  <div class="shell-pane" data-tab="predict"></div>
  <div class="shell-pane" data-tab="dm"></div>
  <div class="shell-pane" data-tab="trend"></div>
  <div class="shell-pane" data-tab="mypage"></div>
</div>

<nav class="nav">
  <div class="nav-inner">
    <button class="nav-item" data-page="index"><img src="./assets/icons/nav-home.svg" data-base="./assets/icons/nav-home.svg" data-active="./assets/icons/nav-home-active.svg"></button>
    <button class="nav-item" data-page="predict"><img src="./assets/icons/nav-predict.svg" data-base="./assets/icons/nav-predict.svg" data-active="./assets/icons/nav-predict-active.svg"></button>
    <button class="nav-item nav-dm" data-page="dm" aria-label="메시지"><img src="./assets/icons/nav-dm.svg" data-base="./assets/icons/nav-dm.svg" data-active="./assets/icons/nav-dm-active.svg"><span class="nav-badge" id="navDmBadge" hidden></span></button>
    <button class="nav-item" data-page="trend"><img src="./assets/icons/nav-trend.svg" data-base="./assets/icons/nav-trend.svg" data-active="./assets/icons/nav-trend-active.svg"></button>
    <button class="nav-item" data-page="mypage"><img src="./assets/icons/nav-user.svg" data-base="./assets/icons/nav-user.svg" data-active="./assets/icons/nav-user-active.svg"></button>
  </div>
</nav>

<script>
/* ═══ 셸 컨트롤러 — 트랙 이동·탭 생명주기·iframe 제스처 수신 ═══ */
(function () {
  const ORDER = ["index", "predict", "dm", "trend", "mypage"];
  const URLS  = { index: "index.html", predict: "galla-predict.html", dm: "dm.html", trend: "search.html", mypage: "mypage.html" };
  const track = document.getElementById("shell-track");
  const panes = {}; document.querySelectorAll(".shell-pane").forEach(p => panes[p.dataset.tab] = p);
  const W = () => window.innerWidth;
  let cur = Math.max(0, ORDER.indexOf((new URLSearchParams(location.search).get("tab")) || "index"));

  // 탭 판 생성(1회) — 이후엔 살아있는 채 유지 = 전환 즉시
  function ensure(tab) {
    const pane = panes[tab];
    if (!pane || pane.querySelector("iframe")) return;
    pane.innerHTML = '<div class="pane-wait"><i></i></div><div class="pane-scrim"></div>';
    const f = document.createElement("iframe");
    f.src = URLS[tab] + "?shell=1";
    f.setAttribute("allow", "camera; microphone; geolocation; autoplay; clipboard-write");
    f.addEventListener("load", () => { const w = pane.querySelector(".pane-wait"); if (w) setTimeout(() => w.remove(), 150); });
    pane.appendChild(f);
  }

  function place(px, anim) {
    track.classList.toggle("anim", !!anim);
    track.style.transform = `translateX(${px}px)`;
  }
  function baseX() { return -cur * W(); }

  function paintNav() {
    document.querySelectorAll(".nav-item").forEach(it => {
      const on = it.dataset.page === ORDER[cur];
      it.classList.toggle("active", on);
      const img = it.querySelector("img");
      if (img && img.dataset.base) img.src = on ? img.dataset.active : img.dataset.base;
    });
    // 글라이더 — 활성 탭 위 표시점이 좌우로 미끄러진다
    const inner = document.querySelector(".nav-inner");
    if (inner) {
      let g = document.getElementById("nav-glider");
      if (!g) { g = document.createElement("i"); g.id = "nav-glider"; inner.appendChild(g); }
      const act = inner.querySelector('.nav-item[data-page="' + ORDER[cur] + '"]');
      if (act) {
        // 캡슐을 활성 아이콘 중앙에 정렬(캡슐 폭 56의 절반 = 28)
        g.style.transform = "translateX(" + (act.offsetLeft + act.offsetWidth / 2 - 28) + "px)";
        g.style.opacity = "1";
      }
    }
  }

  /* 마이페이지 아이콘 = 프로필 사진 — 판(nav.js)이 세션 확인 후 밀어주고,
     부팅 즉시는 캐시로 그린다(네트워크 대기 0 → '늦게 뜨고 제각각' 해소). */
  window.GALLA_setNavAvatar = function (url) {
    const img = document.querySelector('.nav-item[data-page="mypage"] img');
    if (!img) return;
    if (url) {
      img.removeAttribute("data-base");   // paintNav 스왑이 덮어쓰지 않게
      img.removeAttribute("data-active");
      img.classList.add("nav-avatar");
      img.onerror = function () { this.onerror = null; this.classList.remove("nav-avatar"); this.src = "./assets/icons/nav-user.svg"; };
      if (img.src !== url) img.src = url;
    } else {
      img.classList.remove("nav-avatar");
      img.dataset.base = "./assets/icons/nav-user.svg";
      img.dataset.active = "./assets/icons/nav-user-active.svg";
      img.src = (ORDER[cur] === "mypage") ? img.dataset.active : img.dataset.base;
    }
  };
  try { const av = localStorage.getItem("galla_nav_avatar"); if (av) GALLA_setNavAvatar(av); } catch (_) {}

  // 비로그인 게이트 — DM·마이페이지는 로그인 필수. 세션 토큰 유무로 판별.
  function isLoggedIn() {
    try { return !!localStorage.getItem("sb-bidqauputnhkqepvdzrr-auth-token"); } catch (_) { return true; }
  }
  // 로그인 필요한 탭 — 로그아웃 상태에선 '백그라운드 프리로드 금지'가 핵심.
  //   프리로드하면 그 판(mypage 등)이 스스로 로그인으로 리다이렉트 → pop-out이 앱 전체를
  //   로그인으로 튕긴다(공개 탭에 있어도!). '트렌드 진입 시 로그인 뜸'의 원인(사장님 제보).
  const GATED_TABS = { dm: 1, mypage: 1 };
  // 프리로드용 ensure — 로그아웃 상태의 gated 탭은 건너뛴다(활성 진입은 go()가 로그인으로 처리).
  function preloadEnsure(tab) {
    if (!tab) return;
    if (GATED_TABS[tab] && !isLoggedIn()) return;
    ensure(tab);
  }
  function go(idx, anim = true, tapFx = true) {
    idx = Math.max(0, Math.min(ORDER.length - 1, idx));
    // DM·마이페이지 탭 진입인데 로그인 안 됐으면 → 로그인으로 (전체화면, 원위치 복귀 next)
    if (GATED_TABS[ORDER[idx]] && !isLoggedIn()) { location.href = "login.html?next=" + URLS[ORDER[idx]]; return; }
    const prev = cur;
    cur = idx;
    /* ⚠️ 목적지 판이 아직 없으면 iframe 생성이 메인스레드를 전환시간만큼 붙들어
       슬라이드가 잭 뒤에서 이미 끝나 '순간이동'으로 보인다(사장님 재현: 모션 없음).
       → 슬라이드부터 시작하고 판 생성은 살짝 뒤로 미룬다(스피너가 받친다). */
    const wasReady = !!(panes[ORDER[cur]] && panes[ORDER[cur]].querySelector("iframe"));
    if (wasReady || !anim) ensure(ORDER[cur]);
    else setTimeout(() => ensure(ORDER[cur]), 90);
    /* 인스타식 탭 이동 모션 — 네비 '탭'으로 이동할 때도 좌우 슬라이드 +
       들어오는 판 패럴랙스 + 나가는 판 스크림(사장님 주문).
       ⚠️ CSS transition은 이 기기 웹뷰에서 씹혔다(사장님 재현 2회) —
       손가락 드래그와 같은 'JS 프레임 구동'으로 민다(드래그는 확실히 되므로).
       스와이프 커밋(tapFx=false)은 이미 feel()이 연출 중이라 중복 금지. */
    if (anim && tapFx && prev !== cur) glide(prev, wasReady);
    else place(baseX(), anim);
    paintNav();
    // 탭이 바뀌면 네비 숨김 해제 — 새 활성 판이 dm-detail이면 active 신호에 스스로 다시 숨김
    { const nv = document.querySelector(".nav"); if (nv && prev !== cur) nv.style.display = ""; }
    try { history.replaceState(null, "", "app-shell.html?tab=" + ORDER[cur]); } catch (_) {}
    // 활성 판에 '활성' 신호 — DM은 로그인 벽 상태면 스스로 로그인 이동, 트렌드는
    // 정렬 엔진이 이 신호로 잔재를 초기화(로그인 경유 뒤 먹통 방지, 사장님 재현).
    {
      const f = panes[ORDER[cur]] && panes[ORDER[cur]].querySelector("iframe");
      if (f && f.contentWindow) { try { f.contentWindow.postMessage({ galla: "shellcmd", t: "active" }, location.origin); } catch (_) {} }
    }
    // 떠나는 판에 '비활성' 신호 — 홈 릴스/영상이 백그라운드에서 소리를 계속 흘리던 문제(사장님 제보) 차단
    if (prev !== cur) {
      const pf = panes[ORDER[prev]] && panes[ORDER[prev]].querySelector("iframe");
      if (pf && pf.contentWindow) { try { pf.contentWindow.postMessage({ galla: "shellcmd", t: "inactive" }, location.origin); } catch (_) {} }
    }
    // 이웃 선생성 — 다음 스와이프가 이미 살아있는 판으로 떨어지게
    setTimeout(() => { preloadEnsure(ORDER[cur + 1]); preloadEnsure(ORDER[cur - 1]); }, 600);
  }

  /* 재탭: 판이 상세 페이지에 가 있으면 탭 루트로 복귀, 이미 루트면 맨위로.
     (사장님 재현: 이슈 상세에서 홈 눌러도 반응 없음 — cur가 이미 홈이라 no-op였다) */
  function goOrReset(idx) {
    if (idx !== cur) { go(idx); return; }
    const tab = ORDER[cur];
    const f = panes[tab] && panes[tab].querySelector("iframe");
    if (!f) { go(idx); return; }
    let atRoot = false;
    try {
      const file = (f.contentWindow.location.pathname.split("/").pop() || "index.html").replace(/\.html$/, "");
      atRoot = file === URLS[tab].replace(/\.html$/, "");
    } catch (_) {}
    if (!atRoot) f.src = URLS[tab] + "?shell=1";   // 상세 → 탭 루트 복귀
    else { try { f.contentWindow.postMessage({ galla: "shellcmd", t: "scrolltop" }, location.origin); } catch (_) {} }
  }

  // 네비 클릭
  document.querySelectorAll(".nav-item").forEach(it =>
    it.addEventListener("click", () => goOrReset(ORDER.indexOf(it.dataset.page))));

  // iframe 제스처 수신 — 자식 페이지(nav.js 셸 모드)가 중계한 드래그
  let dragging = false;
  window.addEventListener("message", (e) => {
    if (e.origin !== location.origin) return;
    const m = e.data;
    if (!m || m.galla !== "shell") return;
    if (m.t === "drag") {
      dragging = true;
      let dx = m.dx;
      // 끝 탭에서 바깥으로는 고무줄 저항
      if ((cur === 0 && dx > 0) || (cur === ORDER.length - 1 && dx < 0)) dx *= 0.28;
      followTo(baseX() + dx);
    } else if (m.t === "end") {
      if (!dragging) return; dragging = false;
      followStop();
      const commit = Math.abs(m.dx) > W() * 0.26 || (Math.abs(m.vel || 0) > 0.38);
      const v = Math.abs(m.vel || 0);
      // 속도 비례 정착 — 휙 던지면 빠르게(0.18s), 살살 놓으면 느긋하게(0.32s)
      const dur = Math.max(0.18, Math.min(0.32, 0.34 - v * 0.12));
      track.style.transitionDuration = dur + "s";
      if (commit && m.dx < 0 && cur < ORDER.length - 1) go(cur + 1, true, false);
      else if (commit && m.dx > 0 && cur > 0) go(cur - 1, true, false);
      else place(baseX(), true);
      settleFeel();
      setTimeout(() => { track.style.transitionDuration = ""; }, dur * 1000 + 60);
    } else if (m.t === "cancel") {
      dragging = false; followStop(); place(baseX(), true); settleFeel();
    } else if (m.t === "nav") {
      const i = ORDER.indexOf(m.tab); if (i !== -1) goOrReset(i);
    } else if (m.t === "navhide") {
      // DM 상세(채팅방·난장)에선 네비 숨김 — 입력창이 네비에 가렸다(사장님).
      // 활성 판의 신호만 반영(백그라운드 판이 숨기면 안 됨)
      const act = panes[ORDER[cur]] && panes[ORDER[cur]].querySelector("iframe");
      if (act && e.source === act.contentWindow) {
        const nv = document.querySelector(".nav"); if (nv) nv.style.display = m.on ? "none" : "";
      }
    } else if (m.t === "mini") {
      // 활성 판의 스크롤 신호만 반영 — 백그라운드 판 복원 신호에 흔들리지 않게
      const act = panes[ORDER[cur]] && panes[ORDER[cur]].querySelector("iframe");
      if (act && e.source === act.contentWindow) {
        document.querySelector(".nav").classList.toggle("nav--mini", !!m.on);
      }
    }
  });

  // 조그셔틀 등 외부 모듈용: 셸 방식 탭 전환(+서브탭 지정 — DM 탭·트렌드 탭)
  window.GALLA_shellGo = function (tab, subTab) {
    const i = ORDER.indexOf(tab); if (i === -1) return;
    const had = !!(panes[tab] && panes[tab].querySelector("iframe"));
    go(i);
    if (subTab && (tab === "dm" || tab === "trend")) {
      const t = tab === "dm" ? "dmtab" : "trendtab";
      const send = () => {
        const f = panes[tab].querySelector("iframe");
        if (f && f.contentWindow) f.contentWindow.postMessage({ galla: "shellcmd", t, tab: subTab }, location.origin);
      };
      if (had) send();
      else setTimeout(send, 2500);   // 새 판이면 로드 여유 후 전달
    }
  };

  /* ── JS 슬라이드(glide) — 탭 전환 모션. 매 프레임 트랙·판·스크림을 직접 민다.
     easeOutCubic, 거리 비례 시간(1탭 0.33s ~ 4탭 0.54s). */
  let glideId = 0;
  function glide(prevIdx, paneReady) {
    const id = ++glideId;
    fOn = false;                                   // 드래그 추종 루프와 배타
    track.classList.remove("anim", "settle");
    let x0 = -prevIdx * W();
    try { x0 = new WebKitCSSMatrix(getComputedStyle(track).transform).m41 || x0; } catch (_) {}
    const x1 = baseX();
    const dir = x1 < x0 ? 1 : -1;                  // 1: 오른쪽 탭으로
    const inP = paneReady ? panes[ORDER[cur]] : null;    // 새 판이면 패럴랙스 생략
    const sc = panes[ORDER[prevIdx]] && panes[ORDER[prevIdx]].querySelector(".pane-scrim");
    /* 멀리 있는 탭도 '옆칸' 한 칸 슬라이드로 — 트랙을 실제 거리만큼 밀면 중간
       판들(다른 탭·빈 검은판)이 주르륵 스쳐 지나가 지저분했다(에뮬레이터 프레임
       검증). 인스타처럼: 목적지 판을 잠시 옆칸으로 끌어와 한 칸만 민 뒤,
       끝나는 순간 진짜 위치로 스냅(화면상 동일)한다. */
    const far = !!inP && Math.abs(cur - prevIdx) > 1;
    const slotShift = far ? (prevIdx + dir - cur) * W() : 0;   // 목적지 판→옆칸 이동량
    const xV = far ? -(prevIdx + dir) * W() : x1;              // 시각적 트랙 목표(한 칸)
    const durMs = 330;
    if (inP) { inP.style.transition = "none"; if (far) inP.style.zIndex = "3"; }
    if (sc) sc.style.transition = "none";
    const inFrom = dir * 0.15 * W();
    const t0 = performance.now();
    const ease = (t) => 1 - Math.pow(1 - t, 3);
    (function step(now) {
      if (id !== glideId) return;                  // 새 제스처/글라이드가 인계
      const p = Math.min(1, (now - t0) / durMs), e = ease(p);
      track.style.transform = `translateX(${x0 + (xV - x0) * e}px)`;
      if (inP) inP.style.transform = `translateX(${slotShift + inFrom * (1 - e)}px)`;
      if (sc) sc.style.opacity = String(0.3 * (1 - e));
      if (p < 1) requestAnimationFrame(step);
      else {
        if (inP) { inP.style.transform = ""; inP.style.transition = ""; inP.style.zIndex = ""; }
        if (sc) { sc.style.opacity = "0"; sc.style.transition = ""; }
        place(x1, false);                          // 진짜 위치로 스냅 — 화면상 변화 없음
      }
    })(t0);
  }

  /* 손가락 추종 보간 — 중계된 좌표를 그대로 찍으면 프레임이 계단으로 튄다
     ('막 끌려오는' 느낌의 원인, 사장님 표현). 매 프레임 목표의 42%씩 따라붙는
     스프링 추종으로 바꾸면 자연스러운 관성이 생긴다. */
  let fTarget = 0, fCur = 0, fOn = false;
  function followTo(px) {
    fTarget = px;
    if (!fOn) {
      fOn = true;
      glideId++;                                   // 진행 중 글라이드 취소 — 손가락이 우선
      fCur = new WebKitCSSMatrix(getComputedStyle(track).transform).m41 || baseX();
      track.classList.remove("anim");
      (function loop() {
        if (!fOn) return;
        fCur += (fTarget - fCur) * 0.42;
        if (Math.abs(fTarget - fCur) < 0.4) fCur = fTarget;
        track.style.transform = `translateX(${fCur}px)`;
        feel(fCur - baseX());
        requestAnimationFrame(loop);
      })();
    }
  }
  function followStop() { fOn = false; }

  /* 드래그 촉감 — 진행도 p에 따라:
     · 나가는(현재) 판: 점점 어두워짐(뒤로 물러나는 느낌)
     · 들어오는(이웃) 판: 15% 지연돼 따라오다 정착(패럴랙스) */
  function feel(dx) {
    const p = Math.min(1, Math.abs(dx) / W());
    const dir = dx < 0 ? 1 : -1;                       // 1: 다음 탭으로
    const curPane = panes[ORDER[cur]];
    const inPane  = panes[ORDER[cur + dir]];
    track.classList.remove("settle");
    if (curPane) { const s = curPane.querySelector(".pane-scrim"); if (s) s.style.opacity = (p * 0.35).toFixed(3); }
    Object.values(panes).forEach(pn => { if (pn !== inPane) pn.style.transform = ""; });
    if (inPane) inPane.style.transform = `translateX(${dir * (1 - p) * 0.15 * W()}px)`;
  }
  function settleFeel() {
    track.classList.add("settle");
    Object.values(panes).forEach(pn => {
      pn.style.transform = "";
      const s = pn.querySelector(".pane-scrim"); if (s) s.style.opacity = "0";
    });
    setTimeout(() => track.classList.remove("settle"), 340);
  }

  window.addEventListener("resize", () => place(baseX(), false));

  // 부팅: 현재 탭 즉시 + 이웃 순차 (gated 탭 딥링크는 preloadEnsure가 걸러 go()가 로그인 처리)
  preloadEnsure(ORDER[cur]); go(cur, false);
  // 전 판 예열(느긋하게 순차) — 어느 탭을 눌러도 잭 없이 매끈한 슬라이드. gated는 로그아웃 시 제외.
  setTimeout(() => ORDER.forEach((t, i) => setTimeout(() => preloadEnsure(t), i * 400)), 1800);
  // 스플래시(wait=ready) 해제 신호
  setTimeout(() => { try { document.dispatchEvent(new Event("galla:ready")); } catch (_) {} }, 400);
})();
</script>

<script>
/* 🔄 버전 자동 감지 — 새 배포가 뜨면 셸을 통째로 리로드해 '옛 판(iframe) 잔류'와
   네이티브 앱 웹뷰 캐시를 해소한다(웹은 pwa.js가 처리, 앱 WKWebView는 controllerchange가
   안 먹혀 옛 화면이 박히던 문제 — 사장님 제보 2026-07-24). version.txt는 no-store로 항상 최신. */
(function () {
  var loaded = null;
  function get() {
    return fetch('/version.txt?_=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.text() : null; })
      .then(function (t) { return t ? t.trim() : null; })
      .catch(function () { return null; });
  }
  function busy() {
    var a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA)$/.test(a.tagName)) return true;
    if (a && a.isContentEditable) return true;
    // 판 안(iframe)에서 입력 중이면 리로드 보류
    try {
      for (var i = 0; i < window.frames.length; i++) {
        var ia = window.frames[i].document.activeElement;
        if (ia && (/^(INPUT|TEXTAREA)$/.test(ia.tagName) || ia.isContentEditable)) return true;
      }
    } catch (_) {}
    return false;
  }
  function check() {
    get().then(function (v) {
      if (!v) return;
      if (loaded == null) { loaded = v; return; }
      if (v !== loaded && !busy()) { loaded = v; try { location.reload(); } catch (_) {} }
    });
  }
  check();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
  setInterval(check, 90000);
})();
</script>
