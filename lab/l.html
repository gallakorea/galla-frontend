<!doctype html><html><head><meta charset="utf-8"><title>L</title><link rel="stylesheet" href="_base.css"><style>
.st{background:#000}
/* 특이점 — 한 점이 응축되다 터진다 */
.sing{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;
 box-shadow:0 0 10px #fff;opacity:0;z-index:4;animation:sing 3.4s cubic-bezier(.6,0,.2,1) infinite}
/* 폭발 섬광 */
.bang{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;z-index:3;opacity:0;
 background:radial-gradient(circle,#fff 0%,#cfe2ff 22%,rgba(120,170,255,.5) 44%,rgba(0,0,0,0) 72%);
 animation:bang 3.4s cubic-bezier(.1,.9,.25,1) infinite}
/* 충격파 링 */
.sw{position:absolute;left:50%;top:50%;border-radius:50%;border:2px solid rgba(190,215,255,.85);opacity:0;z-index:3;
 box-shadow:0 0 30px rgba(120,170,255,.7);animation:sw 3.4s cubic-bezier(.1,.85,.2,1) infinite}
/* 튀어나가는 물질 — 파편이 사방으로 */
.pt{position:absolute;left:50%;top:50%;border-radius:99px;transform-origin:0 50%;opacity:0;z-index:2;
 background:linear-gradient(90deg,rgba(255,255,255,0),currentColor 55%,#fff);
 filter:drop-shadow(0 0 5px currentColor);animation:pt 3.4s cubic-bezier(.15,.75,.2,1) infinite}
/* 식어가는 성운 — 폭발 잔해가 은하로 */
.neb{position:absolute;border-radius:50%;filter:blur(54px);mix-blend-mode:screen;opacity:0;z-index:1;animation:neb 3.4s ease-out infinite}
.n1{width:70vw;height:70vw;max-width:520px;max-height:520px;left:-14vw;top:-8vh;background:radial-gradient(circle,#2f6bff 0%,rgba(47,107,255,0) 68%)}
.n2{width:62vw;height:62vw;max-width:460px;max-height:460px;right:-12vw;bottom:-6vh;background:radial-gradient(circle,#ff3f6b 0%,rgba(255,63,107,0) 66%);animation-delay:.1s}
.lg{position:relative;z-index:5;opacity:0;filter:drop-shadow(0 0 4px rgba(255,255,255,.8)) drop-shadow(0 8px 36px rgba(90,140,255,.6));
 animation:lg 3.4s cubic-bezier(.16,1.1,.3,1) infinite}
.tag{position:relative;z-index:5;margin-top:22px;color:#8b95ad;font-size:12px;letter-spacing:2px;opacity:0;
 animation:tg 3.4s ease-out infinite;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif}
@keyframes sing{0%{opacity:0;transform:scale(0)}
 6%{opacity:1;transform:scale(1)}
 16%{opacity:1;transform:scale(.35)}   /* 응축 */
 19%{opacity:1;transform:scale(2.4)}   /* 터지기 직전 팽창 */
 22%,100%{opacity:0;transform:scale(0)}}
@keyframes bang{0%,18%{opacity:0;transform:scale(.2)}
 22%{opacity:1;transform:scale(5)}
 34%{opacity:.5;transform:scale(16)}
 52%,100%{opacity:0;transform:scale(26)}}
@keyframes sw{0%,19%{opacity:0;width:14px;height:14px;margin:-7px 0 0 -7px}
 24%{opacity:1}
 64%,100%{opacity:0;width:210vw;height:210vw;margin:-105vw 0 0 -105vw;border-width:1px}}
@keyframes pt{0%,19%{opacity:0;transform:rotate(var(--a)) translateX(6px) scaleX(.1)}
 25%{opacity:1}
 70%{opacity:0;transform:rotate(var(--a)) translateX(var(--d)) scaleX(3.4)}
 100%{opacity:0;transform:rotate(var(--a)) translateX(var(--d)) scaleX(3.4)}}
@keyframes neb{0%,24%{opacity:0;transform:scale(.2)}
 54%{opacity:.85;transform:scale(1)}
 100%{opacity:.7;transform:scale(1.08)}}
@keyframes lg{0%,30%{opacity:0;transform:scale(.6);filter:blur(12px)}
 44%{opacity:1;transform:scale(1.1);filter:blur(0)}
 52%{transform:scale(.99)}
 62%,100%{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes tg{0%,66%{opacity:0}80%,100%{opacity:1}}
</style></head><body><div class="st" id="s">
<div class="neb n1"></div><div class="neb n2"></div>
<div class="bang"></div><div class="sing"></div>
<img class="lg" src="logo.png"><div class="tag">세상의 모든 이슈를 갈라보자</div>
</div><script>
var s=document.getElementById('s'),h='';
// 충격파 3겹
for(var r=0;r<3;r++) h+='<div class="sw" style="animation-delay:'+(r*0.09).toFixed(2)+'s"></div>';
// 튀어나가는 물질 90개 — 빅뱅이니 많고 빠르게
var C=["#ffffff","#dbe8ff","#9fc4ff","#ff8a9c","#ffd9a0","#b9a6ff"];
for(var i=0;i<90;i++){var a=(i*137.5)%360,d=340+(i%9)*110,th=(i%7===0)?3:(i%3===0?2:1),w=10+(i%6)*10;
h+='<i class="pt" style="--a:'+a.toFixed(1)+'deg;--d:'+d+'px;height:'+th+'px;width:'+w+'px;color:'+C[i%C.length]+';animation-delay:'+((i%6)*0.035).toFixed(3)+'s"></i>';}
s.insertAdjacentHTML('afterbegin',h);
</script></body></html>
