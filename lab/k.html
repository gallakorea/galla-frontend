<!doctype html><html><head><meta charset="utf-8"><title>K</title><link rel="stylesheet" href="_base.css"><style>
.st{background:#000}
.col{position:absolute;top:0;height:100%;overflow:hidden}
.col i{position:absolute;left:0;right:0;height:100%;display:block;opacity:0;animation:sh 2.8s cubic-bezier(.16,.9,.2,1) infinite}
.lg{position:relative;z-index:4;opacity:0;filter:drop-shadow(0 0 3px rgba(255,255,255,.75)) drop-shadow(0 8px 34px rgba(60,120,255,.55));
 animation:lg 2.8s cubic-bezier(.16,1.1,.3,1) infinite}
.tag{position:relative;z-index:4;margin-top:22px;color:#8b95ad;font-size:12px;letter-spacing:2px;opacity:0;animation:tg 2.8s ease-out infinite;font-family:-apple-system,sans-serif}
.vg{position:absolute;inset:0;z-index:3;background:radial-gradient(72% 58% at 50% 50%,rgba(0,0,0,0),rgba(0,0,0,.75))}
@keyframes sh{0%{opacity:0;transform:translateY(var(--from))}
 18%{opacity:1}
 46%{opacity:1;transform:translateY(0)}
 100%{opacity:1;transform:translateY(0)}}
@keyframes lg{0%,34%{opacity:0;transform:scale(.8)}48%{opacity:1;transform:scale(1.06)}58%,100%{opacity:1;transform:scale(1)}}
@keyframes tg{0%,60%{opacity:0}74%,100%{opacity:1}}
</style></head><body><div class="st" id="s">
<div class="vg"></div><img class="lg" src="logo.png"><div class="tag">세상의 모든 이슈를 갈라보자</div>
</div><script>
// 색 기둥이 위아래에서 교차로 밀려 올라와 화면을 채운다(진영이 갈라선 판)
var s=document.getElementById('s'),N=9,h='';
for(var i=0;i<N;i++){var w=(100/N),left=i*w,up=i%2===0,
c=up?'linear-gradient(180deg,#ff3b46,#8d1220)':'linear-gradient(180deg,#1d5cff,#0a2270)';
h+='<div class="col" style="left:'+left+'%;width:'+(w+0.4)+'%"><i style="--from:'+(up?'-100%':'100%')+';background:'+c+';animation-delay:'+(i*0.045).toFixed(3)+'s"></i></div>';}
s.insertAdjacentHTML('afterbegin',h);
</script></body></html>
