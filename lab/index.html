<!doctype html><html><head><meta charset="utf-8"><title>갈라 스플래시 시안</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0c;color:#e8ecf5;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;padding:18px 14px 40px}
h1{font-size:17px;font-weight:800;margin-bottom:4px}
p.sub{font-size:12px;color:#8a92a8;margin-bottom:18px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.card{background:#111319;border:1px solid #21252f;border-radius:14px;overflow:hidden}
.ph{position:relative;width:100%;aspect-ratio:9/19.5;background:#000}
.ph iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.meta{padding:10px 12px 12px}
.meta b{display:block;font-size:13px;margin-bottom:3px}
.meta span{font-size:11px;color:#828b9e;line-height:1.45}
</style></head><body>
<h1>갈라 스플래시 시안</h1>
<p class="sub">전부 실제로 움직입니다. 마음에 드는 것의 알파벳을 알려주세요.<br>안 되겠으면 「전부 아님」이라고 하셔도 됩니다.</p>
<div class="grid">
<div class="card"><div class="ph"><iframe src="a.html"></iframe></div><div class="meta"><b>A · 판세가 화면을 가른다</b><span>오늘 판세대로 화면이 갈라진다. 열 때마다 다름 — 갈라만 가능</span></div></div>
<div class="card"><div class="ph"><iframe src="b.html"></iframe></div><div class="meta"><b>B · 성운 + 워프 + 팡팡</b><span>가디언즈 톤에 폭발·충격파까지</span></div></div>
<div class="card"><div class="ph"><iframe src="c.html"></iframe></div><div class="meta"><b>C · 성운 + 워프</b><span>폭발 없이 별만 쏟아짐</span></div></div>
<div class="card"><div class="ph"><iframe src="d.html"></iframe></div><div class="meta"><b>D · 성운만</b><span>가장 절제됨</span></div></div>
<div class="card"><div class="ph"><iframe src="e.html"></iframe></div><div class="meta"><b>E · 붉은 진영 ⚔ 푸른 진영</b><span>좌우 충돌 후 로고 등장</span></div></div>
</div></body></html>
