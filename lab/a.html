<!doctype html><html><head><meta charset="utf-8"><title>A</title><link rel="stylesheet" href="_base.css"><style>
.st{--sp:52%;background:#000}
.half{position:absolute;top:0;height:100%;overflow:hidden}
.l{left:0;width:var(--sp);animation:sl 2.6s cubic-bezier(.16,.85,.2,1) infinite}
.r{right:0;width:calc(100% - var(--sp));animation:sr 2.6s cubic-bezier(.16,.85,.2,1) infinite}
.l::after,.r::after{content:'';position:absolute;top:0;height:100%;width:62%;opacity:0;animation:inr 2.6s ease-out infinite}
.l::after{right:0;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(255,60,74,.30) 62%,rgba(255,120,130,.55))}
.r::after{left:0;background:linear-gradient(270deg,rgba(0,0,0,0),rgba(50,130,255,.30) 62%,rgba(130,190,255,.55))}
.cut{position:absolute;top:0;left:var(--sp);width:2px;height:100%;margin-left:-1px;z-index:3;background:#fff;
 box-shadow:0 0 18px #fff,0 0 44px rgba(180,210,255,.8);opacity:0;animation:cut 2.6s cubic-bezier(.2,.9,.25,1) infinite}
.rift{position:absolute;top:0;left:var(--sp);width:220px;height:100%;margin-left:-110px;z-index:2;opacity:0;
 mix-blend-mode:screen;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(255,255,255,.9) 48%,rgba(255,255,255,.9) 52%,rgba(0,0,0,0));
 filter:blur(18px);animation:rift 2.6s ease-out infinite}
.sp{position:absolute;top:50%;left:var(--sp);width:3px;height:3px;border-radius:50%;z-index:3;background:currentColor;
 filter:drop-shadow(0 0 6px currentColor);opacity:0;animation:sp 2.6s cubic-bezier(.1,.8,.3,1) infinite}
.mid{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lg{opacity:0;filter:drop-shadow(0 0 3px rgba(255,255,255,.6)) drop-shadow(0 8px 36px rgba(120,160,255,.5));
 animation:lg 2.6s cubic-bezier(.16,1.1,.3,1) infinite}
.odds{margin-top:22px;display:flex;align-items:center;gap:10px;opacity:0;animation:od 2.6s cubic-bezier(.2,.8,.2,1) infinite;
 font-family:-apple-system,'Apple SD Gothic Neo',sans-serif}
.odds b{font-size:15px;font-weight:800}.odds .a{color:#ff7f88}.odds .b{color:#8fc0ff}.odds span{color:#6f7a93;font-size:11px;letter-spacing:1px}
@keyframes sl{0%,18%{transform:translateX(0)}30%{transform:translateX(-14px)}44%,100%{transform:translateX(-9px)}}
@keyframes sr{0%,18%{transform:translateX(0)}30%{transform:translateX(14px)}44%,100%{transform:translateX(9px)}}
@keyframes inr{0%,18%{opacity:0}34%{opacity:1}100%{opacity:.85}}
@keyframes cut{0%{opacity:0;transform:scaleY(0)}12%{opacity:1;transform:scaleY(1)}26%{opacity:1;transform:scaleY(1) scaleX(2.5)}46%,100%{opacity:.5;transform:scaleY(1) scaleX(1)}}
@keyframes rift{0%,20%{opacity:0}30%{opacity:1}62%,100%{opacity:.25}}
@keyframes sp{0%,22%{opacity:0;transform:translate(0,0) scale(1)}28%{opacity:1}62%,100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
@keyframes lg{0%,24%{opacity:0;transform:scale(.7);filter:blur(10px)}36%{opacity:1;transform:scale(1.08);filter:blur(0)}44%{transform:scale(.99)}54%,100%{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes od{0%,52%{opacity:0;transform:translateY(6px)}66%,100%{opacity:1;transform:translateY(0)}}
</style></head><body><div class="st" id="s">
<div class="half l"></div><div class="half r"></div><div class="rift"></div><div class="cut"></div>
<div class="mid"><img class="lg" src="logo.png"><div class="odds"><b class="a">52</b><span>지금 판세</span><b class="b">48</b></div></div>
</div><script>
var s=document.getElementById('s'),h='';
for(var i=0;i<22;i++){var a=(i/22)*Math.PI*2,d=70+(i%5)*46,dx=Math.round(Math.cos(a)*d),dy=Math.round(Math.sin(a)*d*1.4);
h+='<i class="sp" style="--dx:'+dx+'px;--dy:'+dy+'px;color:'+(dx<0?'#ff6b74':'#7fb6ff')+';animation-delay:'+((i%4)*0.05)+'s"></i>';}
s.insertAdjacentHTML('afterbegin',h);
</script></body></html>
