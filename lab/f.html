<!doctype html><html><head><meta charset="utf-8"><title>F</title><link rel="stylesheet" href="_base.css"><style>
.st{background:#000}
.grid{position:absolute;inset:-20%;background-image:linear-gradient(rgba(70,110,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(70,110,255,.16) 1px,transparent 1px);
 background-size:38px 38px;transform:perspective(420px) rotateX(64deg) translateY(12%);transform-origin:50% 100%;animation:gm 3s linear infinite}
.hz{position:absolute;left:0;right:0;top:46%;height:1px;background:linear-gradient(90deg,transparent,#7fb6ff,transparent);box-shadow:0 0 30px #2f6bff;opacity:.9}
.sun{position:absolute;left:50%;top:46%;width:min(62vw,300px);height:min(62vw,300px);margin-left:calc(min(62vw,300px)/-2);margin-top:calc(min(62vw,300px)/-2);
 border-radius:50%;background:radial-gradient(circle,#2f6bff 0%,rgba(47,107,255,.25) 46%,rgba(0,0,0,0) 70%);filter:blur(4px);animation:sn 3s ease-in-out infinite}
.lg{position:relative;z-index:3;opacity:0;filter:drop-shadow(0 0 3px rgba(255,255,255,.7)) drop-shadow(0 6px 30px rgba(60,120,255,.7));animation:lg 3s cubic-bezier(.16,1.1,.3,1) infinite}
.tag{position:relative;z-index:3;margin-top:20px;color:#7fa0d8;font-size:12px;letter-spacing:3px;opacity:0;animation:tg 3s ease-out infinite;font-family:-apple-system,sans-serif}
@keyframes gm{0%{background-position:0 0}100%{background-position:0 38px}}
@keyframes sn{0%,100%{opacity:.7;transform:scale(.96)}50%{opacity:1;transform:scale(1.06)}}
@keyframes lg{0%,12%{opacity:0;transform:translateY(24px) scale(.9)}30%{opacity:1;transform:translateY(0) scale(1.04)}40%,100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes tg{0%,32%{opacity:0}46%,100%{opacity:1}}
</style></head><body><div class="st">
<div class="grid"></div><div class="sun"></div><div class="hz"></div>
<img class="lg" src="logo.png"><div class="tag">세상의 모든 이슈를 갈라보자</div>
</div></body></html>
