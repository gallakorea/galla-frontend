<!doctype html><html><head><meta charset="utf-8"><title>I</title><link rel="stylesheet" href="_base.css"><style>
.st{background:#000}
.ppl{position:absolute;bottom:0;left:0;right:0;height:42%;z-index:2}
.p{position:absolute;bottom:0;width:14px;opacity:0;animation:pu 3s cubic-bezier(.2,.8,.2,1) infinite}
.p svg{display:block;width:100%;height:auto}
.beam{position:absolute;left:50%;top:0;width:min(70vw,340px);height:64%;margin-left:calc(min(70vw,340px)/-2);z-index:1;opacity:0;
 background:linear-gradient(180deg,rgba(47,107,255,.45),rgba(47,107,255,0));filter:blur(22px);animation:bm 3s ease-out infinite}
.lg{position:relative;z-index:3;margin-bottom:12%;opacity:0;filter:drop-shadow(0 0 3px rgba(255,255,255,.7)) drop-shadow(0 8px 34px rgba(60,120,255,.6));
 animation:lg 3s cubic-bezier(.16,1.1,.3,1) infinite}
.tag{position:relative;z-index:3;margin-bottom:12%;color:#8b95ad;font-size:12px;letter-spacing:2px;opacity:0;animation:tg 3s ease-out infinite;font-family:-apple-system,sans-serif}
@keyframes pu{0%,10%{opacity:0;transform:translateY(30px)}26%{opacity:1;transform:translateY(0)}100%{opacity:1;transform:translateY(0)}}
@keyframes bm{0%,14%{opacity:0}34%{opacity:1}100%{opacity:.6}}
@keyframes lg{0%,30%{opacity:0;transform:scale(.8)}44%{opacity:1;transform:scale(1.06)}54%,100%{opacity:1;transform:scale(1)}}
@keyframes tg{0%,56%{opacity:0}70%,100%{opacity:1}}
</style></head><body><div class="st" id="s">
<div class="beam"></div>
<img class="lg" src="logo.png"><div class="tag">세상의 모든 이슈를 갈라보자</div>
<div class="ppl" id="ppl"></div>
</div><script>
// 갈라의 사람 SVG 가 아래에서 올라와 판을 채운다
var PERSON='<svg viewBox="0 0 24 44"><circle cx="12" cy="7" r="6" fill="CC"/><path d="M12 15c-5 0-8 4-8 9v20h16V24c0-5-3-9-8-9z" fill="CC"/></svg>';
var wrap=document.getElementById('ppl'),h='';
for(var i=0;i<26;i++){var x=(i*3.9+(i%3)*1.4)%100,sc=(0.6+(i%4)*0.22).toFixed(2),
c=(x<50)?'#ff6b74':'#5b9bff',dl=(i%6)*0.07;
h+='<i class="p" style="left:'+x+'%;transform-origin:bottom;width:'+(12*sc)+'px;animation-delay:'+dl.toFixed(2)+'s">'+PERSON.replace(/CC/g,c)+'</i>';}
wrap.innerHTML=h;
</script></body></html>
