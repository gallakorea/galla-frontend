<!doctype html><html><head><meta charset="utf-8"><title>M</title><link rel="stylesheet" href="_base.css"><style>
/* M = L(빅뱅) 도입 + B(성운·워프·팡팡) 지속.
   한 점이 터져 → 물질이 흩어지고 → 그 잔해가 식어 성운이 되고 → 그 안에서 별이 흐르고 빛이 터진다. */
.st{background:#000}
/* ── 1단계: 빅뱅 ── */
.sing{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;
 box-shadow:0 0 10px #fff;opacity:0;z-index:6;animation:sing 4s cubic-bezier(.6,0,.2,1) infinite}
.bang{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;z-index:5;opacity:0;
 background:radial-gradient(circle,#fff 0%,#cfe2ff 22%,rgba(120,170,255,.5) 44%,rgba(0,0,0,0) 72%);
 animation:bang 4s cubic-bezier(.1,.9,.25,1) infinite}
.sw{position:absolute;left:50%;top:50%;border-radius:50%;border:2px solid rgba(190,215,255,.85);opacity:0;z-index:5;
 box-shadow:0 0 30px rgba(120,170,255,.7);animation:sw 4s cubic-bezier(.1,.85,.2,1) infinite}
.pt{position:absolute;left:50%;top:50%;border-radius:99px;transform-origin:0 50%;opacity:0;z-index:4;
 background:linear-gradient(90deg,rgba(255,255,255,0),currentColor 55%,#fff);
 filter:drop-shadow(0 0 5px currentColor);animation:pt 4s cubic-bezier(.15,.75,.2,1) infinite}
/* ── 2단계: 잔해가 식어 성운으로 ── */
.aur{position:absolute;border-radius:50%;filter:blur(58px);mix-blend-mode:screen;opacity:0;z-index:1}
.a1{width:78vw;height:78vw;max-width:560px;max-height:560px;left:-18vw;top:-14vh;background:radial-gradient(circle,#ff2f7e 0%,rgba(255,47,126,0) 68%);animation:nebIn 4s ease-out infinite,d1 9s ease-in-out infinite}
.a2{width:70vw;height:70vw;max-width:520px;max-height:520px;right:-16vw;bottom:-12vh;background:radial-gradient(circle,#00e5ff 0%,rgba(0,229,255,0) 66%);animation:nebIn 4s ease-out .06s infinite,d2 11s ease-in-out infinite}
.a3{width:58vw;height:58vw;max-width:430px;max-height:430px;left:32vw;top:38vh;background:radial-gradient(circle,#7b3bff 0%,rgba(123,59,255,0) 68%);animation:nebIn3 4s ease-out .1s infinite,d3 13s ease-in-out infinite}
.a4{width:52vw;height:52vw;max-width:400px;max-height:400px;left:6vw;bottom:2vh;background:radial-gradient(circle,#ff8a2b 0%,rgba(255,138,43,0) 66%);animation:nebIn4 4s ease-out .14s infinite,d2 10s ease-in-out infinite}
.core{position:absolute;left:50%;top:50%;width:min(86vw,520px);height:min(86vw,520px);margin-left:calc(min(86vw,520px)/-2);margin-top:calc(min(86vw,520px)/-2);z-index:2;opacity:0;
 background:radial-gradient(circle,rgba(255,255,255,.40) 0%,rgba(150,190,255,.22) 24%,rgba(0,0,0,0) 62%);animation:coreIn 4s ease-out infinite}
/* ── 3단계: 성운 속 워프 별 + 팡팡 ── */
.warp{position:absolute;left:50%;top:50%;width:0;height:0;z-index:3;opacity:0;animation:lateIn 4s ease-out infinite}
.star{position:absolute;left:0;top:0;height:2px;width:26px;border-radius:99px;transform-origin:0 50%;opacity:0;
 background:linear-gradient(90deg,rgba(255,255,255,0),currentColor 60%,#fff);filter:drop-shadow(0 0 6px currentColor);
 animation:warp 1.6s cubic-bezier(.3,.05,.4,1) infinite}
.pops{position:absolute;inset:0;z-index:3;opacity:0;animation:lateIn 4s ease-out infinite}
.pop{position:absolute;border-radius:50%;opacity:0;background:radial-gradient(circle,#fff 0%,currentColor 26%,rgba(0,0,0,0) 68%);
 filter:blur(1px) drop-shadow(0 0 16px currentColor);animation:pop 1.6s cubic-bezier(.1,.85,.3,1) infinite}
.ring{position:absolute;border-radius:50%;opacity:0;border:2px solid currentColor;box-shadow:0 0 22px currentColor;animation:ring 1.6s cubic-bezier(.12,.8,.25,1) infinite}
.vig{position:absolute;inset:0;z-index:4;background:radial-gradient(74% 64% at 50% 48%,rgba(0,0,0,0) 0%,rgba(0,0,0,.20) 66%,rgba(0,0,0,.70) 100%)}
.grain{position:absolute;inset:-50%;z-index:4;opacity:.09;mix-blend-mode:overlay;animation:gr 1.1s steps(3) infinite;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.55'/></svg>")}
.lg{position:relative;z-index:7;opacity:0;filter:drop-shadow(0 0 4px rgba(255,255,255,.8)) drop-shadow(0 8px 36px rgba(90,140,255,.6));
 animation:lg 4s cubic-bezier(.16,1.1,.3,1) infinite}
.tag{position:relative;z-index:7;margin-top:22px;color:#9aa6c4;font-size:12px;letter-spacing:2px;opacity:0;
 animation:tg 4s ease-out infinite;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif}
@keyframes sing{0%{opacity:0;transform:scale(0)}5%{opacity:1;transform:scale(1)}13%{opacity:1;transform:scale(.35)}15.5%{opacity:1;transform:scale(2.4)}18%,100%{opacity:0;transform:scale(0)}}
@keyframes bang{0%,15%{opacity:0;transform:scale(.2)}18%{opacity:1;transform:scale(5)}28%{opacity:.5;transform:scale(16)}44%,100%{opacity:0;transform:scale(26)}}
@keyframes sw{0%,15.5%{opacity:0;width:14px;height:14px;margin:-7px 0 0 -7px}20%{opacity:1}54%,100%{opacity:0;width:210vw;height:210vw;margin:-105vw 0 0 -105vw;border-width:1px}}
@keyframes pt{0%,15.5%{opacity:0;transform:rotate(var(--a)) translateX(6px) scaleX(.1)}21%{opacity:1}58%,100%{opacity:0;transform:rotate(var(--a)) translateX(var(--d)) scaleX(3.4)}}
@keyframes nebIn{0%,20%{opacity:0;transform:scale(.3)}46%{opacity:.92;transform:scale(1)}100%{opacity:.92;transform:scale(1)}}
@keyframes nebIn3{0%,20%{opacity:0;transform:scale(.3)}46%,100%{opacity:.72;transform:scale(1)}}
@keyframes nebIn4{0%,20%{opacity:0;transform:scale(.3)}46%,100%{opacity:.62;transform:scale(1)}}
@keyframes coreIn{0%,22%{opacity:0}48%{opacity:.9}100%{opacity:.75}}
@keyframes lateIn{0%,30%{opacity:0}46%,100%{opacity:1}}
@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(10vw,7vh)}}
@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-9vw,-8vh)}}
@keyframes d3{0%,100%{transform:translate(0,0)}50%{transform:translate(-12vw,-5vh)}}
@keyframes gr{0%{transform:translate(0,0)}33%{transform:translate(-3%,2%)}66%{transform:translate(2%,-3%)}100%{transform:translate(0,0)}}
@keyframes warp{0%{opacity:0;transform:rotate(var(--a)) translateX(var(--s)) scaleX(.15)}12%{opacity:1}70%{opacity:.9}100%{opacity:0;transform:rotate(var(--a)) translateX(var(--d)) scaleX(5.5)}}
@keyframes pop{0%{opacity:0;transform:scale(.1)}6%{opacity:1;transform:scale(1.15)}14%{opacity:.85;transform:scale(.92)}34%,100%{opacity:0;transform:scale(1.5)}}
@keyframes ring{0%{opacity:0;transform:scale(.15)}7%{opacity:.95;transform:scale(.5)}40%,100%{opacity:0;transform:scale(3.4)}}
@keyframes lg{0%,24%{opacity:0;transform:scale(.6);filter:blur(12px)}36%{opacity:1;transform:scale(1.1);filter:blur(0)}44%{transform:scale(.99)}54%,100%{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes tg{0%,58%{opacity:0}72%,100%{opacity:1}}
</style></head><body><div class="st" id="s">
<div class="aur a1"></div><div class="aur a2"></div><div class="aur a3"></div><div class="aur a4"></div>
<div class="core"></div><div class="warp" id="warp"></div><div class="pops" id="pops"></div>
<div class="bang"></div><div class="sing"></div>
<div class="vig"></div><div class="grain"></div>
<img class="lg" src="logo.png"><div class="tag">세상의 모든 이슈를 갈라보자</div>
</div><script>
var s=document.getElementById('s'),h='';
for(var r=0;r<3;r++) h+='<div class="sw" style="animation-delay:'+(r*0.08).toFixed(2)+'s"></div>';
var PC=["#ffffff","#dbe8ff","#9fc4ff","#ff8a9c","#ffd9a0","#b9a6ff"];
for(var i=0;i<80;i++){var a=(i*137.5)%360,d=340+(i%9)*110,th=(i%7===0)?3:(i%3===0?2:1),w=10+(i%6)*10;
h+='<i class="pt" style="--a:'+a.toFixed(1)+'deg;--d:'+d+'px;height:'+th+'px;width:'+w+'px;color:'+PC[i%PC.length]+';animation-delay:'+((i%6)*0.03).toFixed(3)+'s"></i>';}
s.insertAdjacentHTML('afterbegin',h);
var SC=["#ffffff","#bfe4ff","#00e5ff","#ff6fae","#ffd28a","#b39bff"],w='';
for(var k=0;k<40;k++){var ang=(k*137.5)%360,s0=30+(k%5)*16,d1=420+(k%7)*95,dl=((k*53)%100)/100*1.6,th2=(k%6===0)?3:2;
w+='<i class="star" style="--a:'+ang.toFixed(1)+'deg;--s:'+s0+'px;--d:'+d1+'px;height:'+th2+'px;color:'+SC[k%SC.length]+';animation-delay:'+dl.toFixed(2)+'s"></i>';}
document.getElementById('warp').innerHTML=w;
var POPC=["#ff5fa2","#00e5ff","#ffb14d","#a98bff","#7fd0ff"],SP=[[18,22],[78,18],[30,74],[70,68],[50,12],[12,52],[88,44],[58,88]],p='';
for(var m=0;m<SP.length;m++){var px=SP[m][0],py=SP[m][1],sz=36+(m%4)*30,c=POPC[m%POPC.length],dy=(m*0.19).toFixed(2);
p+='<i class="pop" style="left:'+px+'%;top:'+py+'%;width:'+sz+'px;height:'+sz+'px;margin-left:'+(-sz/2)+'px;margin-top:'+(-sz/2)+'px;color:'+c+';animation-delay:'+dy+'s"></i>';
if(m%2===0){var rs=sz*1.4;
p+='<i class="ring" style="left:'+px+'%;top:'+py+'%;width:'+rs+'px;height:'+rs+'px;margin-left:'+(-rs/2)+'px;margin-top:'+(-rs/2)+'px;color:'+c+';animation-delay:'+dy+'s"></i>';}}
document.getElementById('pops').innerHTML=p;
</script></body></html>
