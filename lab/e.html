<!doctype html><html><head><meta charset="utf-8"><title>E</title><link rel="stylesheet" href="_base.css"><style>
.st{background:#000}
.side{position:absolute;top:-25%;width:92%;height:150%;filter:blur(52px);mix-blend-mode:screen}
.red{left:-46%;background:radial-gradient(60% 46% at 72% 50%,#ff2f3a 0%,rgba(190,20,40,.55) 34%,rgba(0,0,0,0) 72%);animation:pr 2.6s cubic-bezier(.18,.8,.25,1) infinite}
.blue{right:-46%;background:radial-gradient(60% 46% at 28% 50%,#2f8dff 0%,rgba(20,70,190,.55) 34%,rgba(0,0,0,0) 72%);animation:pb 2.6s cubic-bezier(.18,.8,.25,1) infinite}
.tr{position:absolute;height:2px;border-radius:99px;opacity:0;background:linear-gradient(90deg,rgba(255,255,255,0),currentColor 62%,#fff);
 filter:drop-shadow(0 0 7px currentColor);animation:tr 2.6s cubic-bezier(.2,.75,.2,1) infinite}
.tr.rt{left:-30%;transform-origin:left center;rotate:-7deg}
.tr.bt{right:-30%;transform-origin:right center;rotate:7deg;background:linear-gradient(270deg,rgba(255,255,255,0),currentColor 62%,#fff);animation-name:trb}
.clash{position:absolute;left:50%;top:0;width:3px;height:100%;margin-left:-1.5px;z-index:4;opacity:0;mix-blend-mode:screen;
 background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.95) 32%,#fff 50%,rgba(255,255,255,.95) 68%,rgba(255,255,255,0));
 box-shadow:0 0 26px rgba(255,255,255,.85),0 0 60px rgba(150,190,255,.45);animation:cl 2.6s cubic-bezier(.1,.85,.3,1) infinite}
.flash{position:absolute;inset:0;z-index:3;opacity:0;mix-blend-mode:screen;
 background:radial-gradient(42% 32% at 50% 50%,rgba(255,255,255,.95) 0%,rgba(190,215,255,.45) 34%,rgba(0,0,0,0) 72%);animation:fl 2.6s ease-out infinite}
.emb{position:absolute;left:50%;top:50%;width:3px;height:3px;border-radius:50%;background:currentColor;
 filter:drop-shadow(0 0 6px currentColor);opacity:0;z-index:2;animation:em 2.6s cubic-bezier(.1,.75,.3,1) infinite}
.star{position:absolute;left:50%;top:50%;height:2px;width:22px;border-radius:99px;transform-origin:0 50%;opacity:0;z-index:2;
 background:linear-gradient(90deg,rgba(255,255,255,0),currentColor 60%,#fff);filter:drop-shadow(0 0 5px currentColor);animation:wp 2.6s cubic-bezier(.25,.05,.4,1) infinite}
.vig{position:absolute;inset:0;z-index:3;background:radial-gradient(76% 62% at 50% 50%,rgba(0,0,0,0) 0%,rgba(0,0,0,.16) 60%,rgba(0,0,0,.70) 100%)}
.mid{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lg{opacity:0;filter:drop-shadow(0 0 3px rgba(255,255,255,.6)) drop-shadow(0 10px 44px rgba(120,160,255,.55));animation:lg 2.6s cubic-bezier(.16,1.1,.3,1) infinite}
.tag{margin-top:22px;color:#a7b2cc;font-size:13px;letter-spacing:1.1px;opacity:0;transform:translateY(6px);
 font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;animation:tg 2.6s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes pr{0%{opacity:0;transform:translateX(-26%) scale(.9)}26%{opacity:1;transform:translateX(6%) scale(1.04)}34%{transform:translateX(0) scale(1)}70%{opacity:.85}100%{opacity:0;transform:translateX(-26%) scale(.9)}}
@keyframes pb{0%{opacity:0;transform:translateX(26%) scale(.9)}26%{opacity:1;transform:translateX(-6%) scale(1.04)}34%{transform:translateX(0) scale(1)}70%{opacity:.85}100%{opacity:0;transform:translateX(26%) scale(.9)}}
@keyframes tr{0%{opacity:0;transform:translateX(0) scaleX(.2)}10%{opacity:1}30%{opacity:.95;transform:translateX(150%) scaleX(1)}46%,100%{opacity:0;transform:translateX(190%) scaleX(.1)}}
@keyframes trb{0%{opacity:0;transform:translateX(0) scaleX(.2)}10%{opacity:1}30%{opacity:.95;transform:translateX(-150%) scaleX(1)}46%,100%{opacity:0;transform:translateX(-190%) scaleX(.1)}}
@keyframes cl{0%,24%{opacity:0;transform:scaleY(.15) scaleX(.4)}29%{opacity:1;transform:scaleY(1) scaleX(1)}36%{opacity:.35;transform:scaleY(1) scaleX(1.6)}44%,100%{opacity:0;transform:scaleY(1) scaleX(2)}}
@keyframes fl{0%,25%{opacity:0}31%{opacity:1}56%,100%{opacity:0}}
@keyframes em{0%,26%{opacity:0;transform:translate(0,0) scale(1)}32%{opacity:1}66%,100%{opacity:0;transform:translate(var(--ex),var(--ey)) scale(.3)}}
@keyframes wp{0%,26%{opacity:0;transform:rotate(var(--a)) translateX(20px) scaleX(.15)}33%{opacity:1}70%,100%{opacity:0;transform:rotate(var(--a)) translateX(var(--d)) scaleX(4)}}
@keyframes lg{0%,26%{opacity:0;transform:scale(.6);filter:blur(8px)}34%{opacity:1;transform:scale(1.12);filter:blur(0)}42%{transform:scale(.99)}50%,100%{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes tg{0%,40%{opacity:0;transform:translateY(6px)}52%,100%{opacity:1;transform:translateY(0)}}
</style></head><body><div class="st" id="s">
<div class="side red"></div><div class="side blue"></div><div class="clash"></div><div class="flash"></div><div class="vig"></div>
<div class="mid"><img class="lg" src="logo.png"><div class="tag">무엇을 하든 판이 되는 곳</div></div>
</div><script>
var s=document.getElementById('s'),RED="#ff4a52",BLUE="#3f9bff",h='';
for(var i=0;i<12;i++){var ty=(i*8.3+(i%3)*2.4)%100,tw=22+(i%5)*11,td=((i*47)%100)/100*0.5,th=(i%4===0)?3:2;
h+='<i class="tr rt" style="top:'+ty+'%;width:'+tw+'%;height:'+th+'px;color:'+RED+';animation-delay:'+td.toFixed(2)+'s"></i>';
h+='<i class="tr bt" style="top:'+((ty+47)%100)+'%;width:'+tw+'%;height:'+th+'px;color:'+BLUE+';animation-delay:'+td.toFixed(2)+'s"></i>';}
for(var j=0;j<28;j++){var ea=(j/28)*Math.PI*2,ed=110+(j%5)*52,ex=Math.round(Math.cos(ea)*ed),ey=Math.round(Math.sin(ea)*ed*0.75);
h+='<i class="emb" style="--ex:'+ex+'px;--ey:'+ey+'px;color:'+(ex<0?RED:BLUE)+';animation-delay:'+((j%4)*0.05).toFixed(2)+'s"></i>';}
for(var k=0;k<30;k++){var ang=(k*137.5)%360,dd=380+(k%6)*90,col=(k%5===0)?RED:(k%5===1?BLUE:"#ffffff");
h+='<i class="star" style="--a:'+ang.toFixed(1)+'deg;--d:'+dd+'px;color:'+col+';animation-delay:'+((k%5)*0.05).toFixed(2)+'s"></i>';}
s.insertAdjacentHTML('afterbegin',h);
</script></body></html>
