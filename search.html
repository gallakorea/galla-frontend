<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GALLA - 검색</title>
  <link rel="stylesheet" href="./css/search.css" />
  <link rel="stylesheet" href="./css/header.css">
  <link rel="stylesheet" href="./css/nav.css">
</head>

<body data-page="search">
<div id="app">

<header class="header header-common">
  <div class="header-inner">
    <a href="index.html" class="logo-link">
      <img src="assets/logo.png" class="logo" alt="GALLA" />
    </a>

    <button class="header-action" aria-label="share">
      <img src="assets/icons/icon-share.svg" alt="share" />
    </button>
  </div>
</header>

<main class="page-main search-page">

<section class="search-tabs">

  <!-- TAB MENU -->
  <div class="tabs-header">
    <button type="button" class="tab-item active" data-tab="search">🔍 검색</button>
    <button type="button" class="tab-item" data-tab="trending">🔥 지금 뜨는</button>
    <button type="button" class="tab-item" data-tab="news">📰 뉴스</button>
  </div>

  <!-- TAB CONTENT -->
  <div class="tabs-body">

    <!-- ===== 통합 검색 ===== -->
    <div class="tab-panel active" data-panel="search">
      <form id="search-form" class="search-bar">
        <span class="search-bar-ic">🔍</span>
        <input id="search-input" class="search-input" placeholder="갈라 이슈 · 예측 · 뉴스 검색"
               autocomplete="off" />
        <button type="button" id="search-clear" class="search-clear" hidden>✕</button>
      </form>

      <!-- 입력 전: 최근/인기 검색어 -->
      <div id="search-empty" class="search-empty">
        <div class="se-block" id="se-recent-block" hidden>
          <div class="se-head">
            <span>최근 검색어</span>
            <button type="button" id="se-recent-clear" class="se-clear">전체삭제</button>
          </div>
          <div id="se-recent" class="se-chips"></div>
        </div>
        <div class="se-block">
          <div class="se-head"><span>인기 검색어</span></div>
          <div id="se-popular" class="se-poplist"></div>
        </div>
      </div>

      <!-- 검색 결과(섹션형) -->
      <div id="search-results" class="search-results"></div>
    </div>

    <!-- ===== 지금 뜨는 ===== -->
    <div class="tab-panel" data-panel="trending">
      <h2 class="section-title">🔥 지금 뜨는 키워드</h2>
      <p class="section-sub">최근 6시간 뉴스에서 가장 많이 언급된 키워드</p>
      <div id="trending-hot" class="trending-hot"></div>

      <h2 class="section-title" style="margin-top:22px;">📈 갈라에서 뜨는 이슈</h2>
      <div id="trending-galla" class="search-results"></div>
    </div>

    <!-- ===== 뉴스 ===== -->
    <div class="tab-panel" data-panel="news">
      <div id="news-category-chips" class="news-category-chips"></div>
      <div id="top-news-list"></div>
    </div>

  </div>
</section>
</main>

<!-- =================================================
     📰 NEWS VIEWER MODAL (IN-APP IFRAME)
================================================= -->
<div id="news-viewer-modal" class="news-viewer-modal hidden">

  <div class="news-viewer-header">
    <button id="news-viewer-close" aria-label="닫기">✕</button>
    <span id="news-viewer-title">기사 보기</span>
    <a id="news-viewer-ext" href="#" target="_blank" rel="noopener noreferrer">원문 ↗</a>
  </div>

  <div class="news-viewer-stage">
    <iframe
      id="news-viewer-iframe"
      src=""
      loading="lazy"
      referrerpolicy="no-referrer"
    ></iframe>
    <div id="news-viewer-fallback" class="news-viewer-fallback" hidden>
      <p class="nvf-title"></p>
      <p class="nvf-desc">이 언론사는 앱 안에서 바로 보기가 제한돼 있어요.</p>
      <a class="nvf-btn" id="news-viewer-fallback-btn" href="#" target="_blank" rel="noopener noreferrer">원문 기사 열기 ↗</a>
    </div>
  </div>

</div>

<!-- ============================= -->
<!-- ✅ 통합 NAV -->
<!-- ============================= -->
<nav class="nav">
  <div class="nav-inner">
      <button class="nav-item" data-page="index" data-target="index.html">
        <img src="./assets/icons/nav-home.svg"
             data-base="./assets/icons/nav-home.svg"
             data-active="./assets/icons/nav-home-active.svg">
      </button>

      <button class="nav-item" data-page="predict" data-target="galla-predict.html">
        <img src="./assets/icons/nav-predict.svg"
             data-base="./assets/icons/nav-predict.svg"
             data-active="./assets/icons/nav-predict-active.svg">
      </button>

      <button class="nav-item" data-page="search" data-target="search.html">
        <img src="./assets/icons/nav-search.svg"
             data-base="./assets/icons/nav-search.svg"
             data-active="./assets/icons/nav-search-active.svg">
      </button>

      <button class="nav-item" data-page="plaza" data-target="plaza.html">
        <img src="./assets/icons/nav-plaza.svg"
             data-base="./assets/icons/nav-plaza.svg"
             data-active="./assets/icons/nav-plaza-active.svg">
      </button>

      <button class="nav-item" data-page="mypage" data-target="mypage.html">
        <img src="./assets/icons/nav-user.svg"
             data-base="./assets/icons/nav-user.svg"
             data-active="./assets/icons/nav-user-active.svg">
      </button>
    </div>
</nav>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="./js/search.js"></script>
<script src="./js/nav.js"></script>

</div>
</body>
</html>
