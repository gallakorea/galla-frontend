<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>GALLA - 검색</title>
  <link rel="stylesheet" href="./css/search.css?v=0717k" />
  <link rel="stylesheet" href="./css/header.css?v=0717k">
  <link rel="stylesheet" href="./css/nav.css?v=0717k">
  <link rel="stylesheet" href="./css/write-hub.css?v=0717k">
  <!-- GALLA 앱 아이콘 / PWA (auto-injected) -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/app-icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/app-icons/favicon-16.png">
  <link rel="apple-touch-icon" href="/assets/app-icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="갈라">
  <link rel="stylesheet" href="./css/theme.css?v=0717k">
</head>

<body data-page="search">
<div id="app">

<header class="header header-common">
  <div class="header-inner header-3">
    <button class="hdr-btn hdr-write" data-write-hub="galla" aria-label="글쓰기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <a href="index.html" class="logo-link">
      <img src="assets/logo.png" class="logo" alt="GALLA" />
    </a>
    <button class="hdr-btn hdr-dm" id="searchDmBtn" aria-label="메시지">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7A8.5 8.5 0 0 1 12.5 3 8.38 8.38 0 0 1 21 11.5z"/></svg>
      <span class="dm-badge" hidden></span>
    </button>
  </div>
</header>

<main class="page-main search-page">

<section class="search-tabs">

  <!-- TAB MENU -->
  <div class="tabs-header">
    <button type="button" class="tab-item active" data-tab="search">🔍 검색</button>
    <button type="button" class="tab-item" data-tab="trending">🔥 핫트렌드</button>
    <button type="button" class="tab-item" data-tab="news">📰 갈라뉴스</button>
    <button type="button" class="tab-item" data-tab="hot">🎬 핫영상</button>
  </div>

  <!-- TAB CONTENT -->
  <div class="tabs-body">

    <!-- ===== 통합 검색 ===== -->
    <div class="tab-panel active" data-panel="search">
      <form id="search-form" class="search-bar">
        <span class="search-bar-ic">🔍</span>
        <input id="search-input" class="search-input" placeholder="갈라 이슈 · 예측 · 뉴스 검색"
               autocomplete="off" />
        <button type="button" id="search-clear" class="search-clear" hidden>✕</button>
      </form>

      <!-- 입력 전: 최근/인기 검색어 -->
      <div id="search-empty" class="search-empty">
        <div class="se-block" id="se-recent-block" hidden>
          <div class="se-head">
            <span>최근 검색어</span>
            <button type="button" id="se-recent-clear" class="se-clear">전체삭제</button>
          </div>
          <div id="se-recent" class="se-chips"></div>
        </div>
        <div class="se-block">
          <div class="se-head"><span>인기 검색어</span></div>
          <div id="se-popular" class="se-poplist"></div>
        </div>
      </div>

      <!-- 검색 결과(섹션형) -->
      <div id="search-results" class="search-results"></div>
    </div>

    <!-- ===== 지금 뜨는 ===== -->
    <div class="tab-panel" data-panel="trending">
      <h2 class="section-title">🔥 핫트렌드 키워드</h2>
      <p class="section-sub">최근 6시간 뉴스에서 가장 많이 언급된 키워드</p>
      <div id="trending-hot" class="trending-hot"></div>

      <!-- 지금 뜨는 유튜브 영상 (핫영상 탭과 같은 데이터) -->
      <section class="hv-sec" id="trending-videos" style="margin-top:20px;">
        <div class="hv-sec-h">
          <span class="hv-sec-t">🎬 지금 뜨는 영상</span>
          <button type="button" class="hv-more" data-tab-goto="hot">더보기
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
        <div id="trending-video-shelf"></div>
      </section>

      <div id="trending-galla" class="search-results" style="margin-top:22px;"></div>
    </div>

    <!-- ===== 뉴스 ===== -->
    <div class="tab-panel" data-panel="news">
      <div id="news-category-chips" class="news-category-chips"></div>
      <div id="top-news-list"></div>
    </div>

    <!-- ===== 핫영상 (유튜브 인기 급상승) ===== -->
    <div class="tab-panel" data-panel="hot">
      <p class="hv-sub">지금 한국에서 가장 뜨거운 영상 — 30분마다 갱신됩니다.</p>
      <!-- 방송 카테고리 칩 (JS가 채움) -->
      <div id="hv-cats" class="hv-cats"></div>
      <div id="hot-video-list"></div>
    </div>

  </div>
</section>
</main>

<!-- 영상 재생 (공식 유튜브 플레이어 임베드) + 갈라 소셜 -->
<div id="hv-player" class="hv-player hidden">
  <div class="hv-dim"></div>
  <div class="hv-box">
    <div class="hv-grab"></div>
    <div class="hv-frame" id="hvFrame"></div>

    <div class="hv-head">
      <span class="hv-title" id="hvTitle"></span>
      <span class="hv-chname" id="hvCh"></span>
      <button type="button" class="hv-close" id="hvClose" aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <!-- 좋아요 · 댓글 · 공유 (갈라 자체 소셜 — 유튜브 지표와 별개) -->
    <div class="hv-social">
      <button type="button" class="hv-sb" id="hvLike">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21.2l7.7-7.8 1.1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        <span id="hvLikeN">좋아요</span>
      </button>
      <button type="button" class="hv-sb" id="hvComment">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7A8.5 8.5 0 0 1 12.5 3 8.4 8.4 0 0 1 21 11.5z"/></svg>
        <span id="hvCommentN">0</span>
      </button>
      <button type="button" class="hv-sb" id="hvShare">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v14"/></svg>
        <span>공유</span>
      </button>
    </div>

    <!-- 댓글 (댓글 버튼으로 토글) -->
    <div class="hv-cmt-wrap hidden" id="hvCmtWrap">
      <div class="hv-cmt-list" id="hvCmtList"></div>
      <div class="hv-cmt-bar">
        <input id="hvCmtInput" class="hv-cmt-in" placeholder="댓글 남기기…" maxlength="1000" autocomplete="off">
        <button type="button" class="hv-cmt-send" id="hvCmtSend">게시</button>
      </div>
    </div>

    <div class="hv-actions">
      <a class="hv-yt" id="hvOpen" href="#" target="_blank" rel="noopener noreferrer">유튜브에서 보기 ↗</a>
      <!-- 발제 연동(embed 이슈)은 준비 중 — 지금은 안내만 -->
      <button type="button" class="hv-galla" id="hvGalla" disabled>⚔️ 갈라치기 <em>준비 중</em></button>
    </div>
  </div>
</div>

<!-- =================================================
     📰 NEWS VIEWER MODAL (IN-APP IFRAME)
================================================= -->
<div id="news-viewer-modal" class="news-viewer-modal hidden">

  <div class="news-viewer-header">
    <button id="news-viewer-close" aria-label="닫기">✕</button>
    <span id="news-viewer-title">기사 보기</span>
    <a id="news-viewer-ext" href="#" target="_blank" rel="noopener noreferrer">원문 ↗</a>
  </div>

  <div class="news-viewer-stage">
    <div id="news-viewer-reader" class="news-viewer-reader"></div>
    <div id="news-viewer-fallback" class="news-viewer-fallback" hidden>
      <p class="nvf-title"></p>
      <p class="nvf-desc">이 기사는 본문을 불러오지 못했어요.</p>
      <a class="nvf-btn" id="news-viewer-fallback-btn" href="#" target="_blank" rel="noopener noreferrer">원문 기사 열기 ↗</a>
    </div>
  </div>

</div>

<!-- ============================= -->
<!-- ✅ 통합 NAV -->
<!-- ============================= -->
<nav class="nav">
  <div class="nav-inner">
      <button class="nav-item" data-page="index" data-target="index.html">
        <img src="./assets/icons/nav-home.svg"
             data-base="./assets/icons/nav-home.svg"
             data-active="./assets/icons/nav-home-active.svg">
      </button>

      <button class="nav-item" data-page="predict" data-target="galla-predict.html">
        <img src="./assets/icons/nav-predict.svg"
             data-base="./assets/icons/nav-predict.svg"
             data-active="./assets/icons/nav-predict-active.svg">
      </button>

      <button class="nav-item" data-page="search" data-target="search.html">
        <img src="./assets/icons/nav-search.svg"
             data-base="./assets/icons/nav-search.svg"
             data-active="./assets/icons/nav-search-active.svg">
      </button>

      <button class="nav-item" data-page="plaza" data-target="plaza.html">
        <img src="./assets/icons/nav-plaza.svg"
             data-base="./assets/icons/nav-plaza.svg"
             data-active="./assets/icons/nav-plaza-active.svg">
      </button>

      <button class="nav-item" data-page="mypage" data-target="mypage.html">
        <img src="./assets/icons/nav-user.svg"
             data-base="./assets/icons/nav-user.svg"
             data-active="./assets/icons/nav-user-active.svg">
      </button>
    </div>
</nav>

<script src="./js/vendor/supabase.js?v=0717k"></script>
<script src="js/supabase.js?v=0717k"></script>
<script src="js/comment-actions.js?v=0717k"></script>
<script src="js/write-hub.js?v=0717k"></script>
<script src="js/dm.js?v=0717k"></script>
<script src="./js/search.js?v=0717k"></script>
<script src="js/hot-videos.js?v=0717k"></script>
<script src="./js/nav.js?v=0717k"></script>
<script>
  // 헤더 DM 버튼 연결(광장과 동일)
  (function () {
    var t = setInterval(function () {
      if (window.supabaseClient && window.initDM) { clearInterval(t); window.initDM("#searchDmBtn"); }
    }, 40);
  })();
</script>

</div>
</body>
</html>
