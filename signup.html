<html lang="ko">
<head>

<body data-page="signup">

<div class="auth-wrap sw-wrap">
  <div class="auth-glow"></div>

  <!-- 상단: 뒤로(스텝 back) + 진행바 -->
  <div class="sw-top">
    <button class="auth-back sw-back" id="swBack" aria-label="뒤로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="sw-progress"><div class="sw-progress-fill" id="swFill"></div></div>
    <span class="sw-count" id="swCount">1/4</span>
  </div>

  <div class="auth-inner sw-inner">

    <!-- 타입폼식: 한 화면 한 질문 -->
    <div class="sw-track" id="swTrack">

      <!-- 1. 이메일 -->
      <section class="sw-step" data-step="email">
        <p class="sw-hello">전장에 합류하기 ⚔️ <b class="reward-inline">+50 GP</b></p>
        <span class="sw-badge req">필수</span>
        <h2 class="sw-q">이메일 주소를<br>알려주세요</h2>
        <p class="sw-hint">로그인과 계정 확인에 쓰여요.</p>
        <input type="email" id="email" class="field-input sw-input" placeholder="example@galla.com" autocomplete="email" inputmode="email" enterkeyhint="next">
        <div class="pw-hint" id="emailHint"></div>
      </section>

      <!-- 2. 비밀번호 -->
      <section class="sw-step" data-step="password">
        <span class="sw-badge req">필수</span>
        <h2 class="sw-q">비밀번호를<br>만들어주세요</h2>
        <p class="sw-hint">8자 이상을 권장해요.</p>
        <div class="pw-wrap">
          <input type="password" id="password" class="field-input sw-input" placeholder="비밀번호" autocomplete="new-password" enterkeyhint="next">
          <button type="button" class="pw-toggle" data-for="password" aria-label="표시">👁</button>
        </div>
        <div class="pw-wrap" style="margin-top:10px">
          <input type="password" id="password2" class="field-input sw-input" placeholder="비밀번호 다시 입력" autocomplete="new-password" enterkeyhint="next">
          <button type="button" class="pw-toggle" data-for="password2" aria-label="표시">👁</button>
        </div>
        <div class="pw-hint" id="pwHint"></div>
      </section>

      <!-- 3. 닉네임 -->
      <section class="sw-step" data-step="nickname">
        <span class="sw-badge req">필수</span>
        <h2 class="sw-q">갈라에서 쓸<br>이름을 지어주세요</h2>
        <p class="sw-hint">2~12자 · 한글·영문·숫자·_ . - / 나중에 바꿀 수 있어요.</p>
        <input type="text" id="nickname" class="field-input sw-input" placeholder="닉네임 (활동명)" maxlength="20" enterkeyhint="next">
      </section>

      <!-- 🪜 생년월일·성별·지역·휴대폰 단계는 뺐다(26.9.18 사장님: 단계별 가입).
           통계용 정보는 이슈 통계를 열 때, 휴대폰은 출금할 때 이유와 함께 받는다. -->

      <!-- 4. 약관 동의 + 가입 -->
      <section class="sw-step" data-step="agree">
        <span class="sw-badge req">필수</span>
        <h2 class="sw-q">마지막이에요!<br>약관에 동의해주세요</h2>
        <div class="agree-box">
          <label class="agree-item agree-all">
            <input type="checkbox" id="agreeAll">
            <span class="ag-mark"></span>
            <b>전체 동의</b>
          </label>
          <div class="agree-list">
            <label class="agree-item">
              <input type="checkbox" id="agreeAge" class="agree-req">
              <span class="ag-mark"></span>
              <span class="ag-txt"><em>[필수]</em> 만 14세 이상입니다</span>
            </label>
            <label class="agree-item">
              <input type="checkbox" id="agreeTerms" class="agree-req">
              <span class="ag-mark"></span>
              <span class="ag-txt"><em>[필수]</em> <a href="terms.html" target="_blank" rel="noopener">이용약관</a> 동의</span>
            </label>
            <label class="agree-item">
              <input type="checkbox" id="agreePrivacy" class="agree-req">
              <span class="ag-mark"></span>
              <span class="ag-txt"><em>[필수]</em> <a href="privacy.html" target="_blank" rel="noopener">개인정보 수집·이용</a> 동의</span>
            </label>
            <label class="agree-item">
              <input type="checkbox" id="agreeMarketing">
              <span class="ag-mark"></span>
              <span class="ag-txt"><em class="opt">[선택]</em> 마케팅·이벤트 정보 수신 동의 (이메일·앱 푸시)<br><small class="ag-perk">🎁 무료 GP 이벤트·에어드랍 소식을 가장 먼저 받아요</small></span>
            </label>
          </div>
        </div>
        <div class="reward-box">🎁 가입 완료 시 <span class="reward-gp">+50 GP</span> 지급!</div>
        <button class="auth-btn" id="signupBtn">⚔️ 가입하고 참전하기</button>
      </section>

    </div>

    <!-- 하단 다음 버튼 (마지막 스텝에선 숨김) -->
    <div class="sw-foot" id="swFoot">
      <button class="auth-btn sw-next" id="swNext">다음</button>
      <div class="auth-foot">이미 계정이 있나요? <span class="link-gold" onclick="(window.GALLA_nav||function(u){location.href=u})('login.html')">로그인</span></div>
    </div>

  </div>
</div>

<!-- LOGIN CHECK + WAIT -->
<script>
function waitForSupabaseClient() {
    return new Promise(resolve => {
        const timer = setInterval(() => {
            if (window.supabaseClient) { clearInterval(timer); resolve(window.supabaseClient); }
        }, 20);
    });
}
(async () => {
    const supabase = await waitForSupabaseClient();
    const { data } = await supabase.auth.getSession();
    if (data.session?.user) {
        alert("이미 로그인되어 있습니다.");
        location.href = "index.html";
    }
})();
</script>
