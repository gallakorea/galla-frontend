<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>회원가입 - GALLA</title>
    <link rel="stylesheet" href="css/signup.css?v=072027">
  <!-- GALLA 앱 아이콘 / PWA (auto-injected) -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/app-icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/app-icons/favicon-16.png">
  <link rel="apple-touch-icon" href="/assets/app-icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="갈라">
  <link rel="stylesheet" href="./css/theme.css?v=072027">
  <!-- 앱 스플래시(로딩) 화면 — 세션 1회, head 동기 로드로 즉시 페인트 -->
  <script src="/js/splash-boot.js?v=072027"></script>
</head>

<body data-page="signup">

<div class="auth-wrap">
  <div class="auth-glow"></div>

  <button class="auth-back" data-back="login.html" aria-label="뒤로">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>

  <div class="auth-inner">

    <div class="auth-brand">
      <img src="assets/logo.png" alt="GALLA" class="auth-logo" />
      <p class="auth-tagline">여론이 에너지가 되는 곳</p>
    </div>

    <div class="auth-card">
      <h1 class="auth-title">전장에 합류하기 ⚔️</h1>
      <p class="auth-sub">가입하고 <b class="reward-inline">+50 GP</b>로 첫 참전을 시작하세요.</p>

      <div class="field">
        <label class="field-label" for="email">이메일 <span class="req">*</span></label>
        <input type="email" id="email" class="field-input" placeholder="example@galla.com" autocomplete="email" inputmode="email">
      </div>

      <div class="field">
        <label class="field-label" for="password">비밀번호 <span class="req">*</span></label>
        <div class="pw-wrap">
          <input type="password" id="password" class="field-input" placeholder="8자 이상 권장" autocomplete="new-password">
          <button type="button" class="pw-toggle" data-for="password" aria-label="표시">👁</button>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="password2">비밀번호 확인 <span class="req">*</span></label>
        <div class="pw-wrap">
          <input type="password" id="password2" class="field-input" placeholder="비밀번호 다시 입력" autocomplete="new-password">
          <button type="button" class="pw-toggle" data-for="password2" aria-label="표시">👁</button>
        </div>
        <div class="pw-hint" id="pwHint"></div>
      </div>

      <div class="field">
        <label class="field-label" for="nickname">닉네임 (활동명) <span class="req">*</span></label>
        <input type="text" id="nickname" class="field-input" placeholder="갈라에서 사용할 이름" maxlength="20">
      </div>

      <div class="field">
        <label class="field-label" for="phone">휴대폰 번호 <span class="field-optional">선택 · 정산 시 필요</span></label>
        <input type="tel" id="phone" class="field-input" placeholder="010-0000-0000" inputmode="tel">
      </div>

      <p class="stats-note">📊 생년월일·성별·지역은 <b>여론 통계</b>를 위해 필요해요 (필수)</p>

      <div class="field">
        <label class="field-label" for="birthdate">생년월일 <span class="req">*</span> <span class="field-optional">만 14세 이상</span></label>
        <input type="date" id="birthdate" class="field-input" placeholder="YYYY-MM-DD">
        <div class="pw-hint" id="ageHint"></div>
      </div>

      <div class="field">
        <label class="field-label">성별 <span class="req">*</span></label>
        <div class="region-grid gender-grid">
          <div class="region-chip gender-chip" data-gender="male">남성</div>
          <div class="region-chip gender-chip" data-gender="female">여성</div>
        </div>
      </div>

      <div class="field">
        <label class="field-label">사는 지역 <span class="req">*</span></label>
        <div class="region-grid">
          <div class="region-chip">서울</div><div class="region-chip">부산</div>
          <div class="region-chip">대구</div><div class="region-chip">인천</div>
          <div class="region-chip">광주</div><div class="region-chip">대전</div>
          <div class="region-chip">울산</div><div class="region-chip">세종</div>
          <div class="region-chip">경기</div><div class="region-chip">강원</div>
          <div class="region-chip">충북</div><div class="region-chip">충남</div>
          <div class="region-chip">전북</div><div class="region-chip">전남</div>
          <div class="region-chip">경북</div><div class="region-chip">경남</div>
          <div class="region-chip">제주</div><div class="region-chip">해외</div>
        </div>
        <div class="region-selected-text">선택한 지역: <span id="selectedRegion">없음</span></div>
      </div>

      <!-- 익명 활동은 계정 토글 폐지 → 유령권 아이템(👻)으로 이용 (댓글 한정) -->

      <!-- 약관·개인정보 동의 (개인정보보호법 제22조 / 정통망법 제50조) -->
      <div class="agree-box">
        <label class="agree-item agree-all">
          <input type="checkbox" id="agreeAll">
          <span class="ag-mark"></span>
          <b>전체 동의</b>
        </label>
        <div class="agree-list">
          <label class="agree-item">
            <input type="checkbox" id="agreeAge" class="agree-req">
            <span class="ag-mark"></span>
            <span class="ag-txt"><em>[필수]</em> 만 14세 이상입니다</span>
          </label>
          <label class="agree-item">
            <input type="checkbox" id="agreeTerms" class="agree-req">
            <span class="ag-mark"></span>
            <span class="ag-txt"><em>[필수]</em> <a href="terms.html" target="_blank" rel="noopener">이용약관</a> 동의</span>
          </label>
          <label class="agree-item">
            <input type="checkbox" id="agreePrivacy" class="agree-req">
            <span class="ag-mark"></span>
            <span class="ag-txt"><em>[필수]</em> <a href="privacy.html" target="_blank" rel="noopener">개인정보 수집·이용</a> 동의</span>
          </label>
          <label class="agree-item">
            <input type="checkbox" id="agreeMarketing">
            <span class="ag-mark"></span>
            <span class="ag-txt"><em class="opt">[선택]</em> 마케팅·이벤트 정보 수신 동의 (이메일·앱 푸시)</span>
          </label>
        </div>
      </div>

      <div class="reward-box">
        🎁 모든 항목 입력 시 <span class="reward-gp">+50 GP</span> 지급!
      </div>

      <button class="auth-btn" id="signupBtn">회원가입</button>

      <div class="auth-foot">
        이미 계정이 있나요? <span class="link-gold" onclick="location.href='login.html'">로그인</span>
      </div>
    </div>

  </div>
</div>

<!-- LOGIN CHECK + WAIT -->
<script>
function waitForSupabaseClient() {
    return new Promise(resolve => {
        const timer = setInterval(() => {
            if (window.supabaseClient) { clearInterval(timer); resolve(window.supabaseClient); }
        }, 20);
    });
}
(async () => {
    const supabase = await waitForSupabaseClient();
    const { data } = await supabase.auth.getSession();
    if (data.session?.user) {
        alert("이미 로그인되어 있습니다.");
        location.href = "index.html";
    }
})();
</script>

<!-- 부가 UX: 비밀번호 표시 · 일치 힌트 -->
<script>
  document.querySelectorAll('.pw-toggle').forEach(function(b){
    b.addEventListener('click', function(){
      var i = document.getElementById(b.dataset.for); if(!i) return;
      var show = i.type === 'password';
      i.type = show ? 'text' : 'password';
      b.textContent = show ? '🙈' : '👁'; b.classList.toggle('on', show);
    });
  });
  var p1 = document.getElementById('password'), p2 = document.getElementById('password2'), hint = document.getElementById('pwHint');
  function chk(){
    if(!p2.value){ hint.textContent=''; hint.className='pw-hint'; return; }
    if(p1.value === p2.value){ hint.textContent='✓ 비밀번호가 일치합니다'; hint.className='pw-hint ok'; }
    else { hint.textContent='✕ 비밀번호가 일치하지 않습니다'; hint.className='pw-hint no'; }
  }
  p1.addEventListener('input', chk); p2.addEventListener('input', chk);

  // 생년월일 → 만 나이 계산 · 만14세 미만 차단 안내
  var bd = document.getElementById('birthdate'), ageHint = document.getElementById('ageHint');
  var ageAgree = document.getElementById('agreeAge');
  window.GALLA_ageFromBirth = function(v){
    if(!v) return null;
    var d = new Date(v); if(isNaN(d)) return null;
    var t = new Date(), a = t.getFullYear() - d.getFullYear();
    var m = t.getMonth() - d.getMonth();
    if(m < 0 || (m === 0 && t.getDate() < d.getDate())) a--;
    return a;
  };
  if(bd){
    bd.max = new Date().toISOString().slice(0,10);
    bd.addEventListener('input', function(){
      var a = window.GALLA_ageFromBirth(bd.value);
      if(a === null){ ageHint.textContent=''; ageHint.className='pw-hint'; }
      else if(a < 14){ ageHint.textContent='✕ 만 14세 미만은 가입할 수 없습니다'; ageHint.className='pw-hint no'; ageAgree.checked=false; }
      else { ageHint.textContent='✓ 가입 가능 연령입니다 (만 '+a+'세)'; ageHint.className='pw-hint ok'; ageAgree.checked=true; }
      syncAgreeAll(); refreshSignupBtn();
    });
  }

  // 약관 동의 체크박스 연동
  var agreeAll = document.getElementById('agreeAll');
  var reqBoxes = [document.getElementById('agreeAge'), document.getElementById('agreeTerms'), document.getElementById('agreePrivacy')];
  var mkt = document.getElementById('agreeMarketing');
  var allBoxes = reqBoxes.concat([mkt]);
  var signupBtn2 = document.getElementById('signupBtn');
  function syncAgreeAll(){ agreeAll.checked = allBoxes.every(function(b){ return b.checked; }); }
  function refreshSignupBtn(){
    var age = window.GALLA_ageFromBirth(bd && bd.value);
    var ok = reqBoxes.every(function(b){ return b.checked; }) && age !== null && age >= 14;
    signupBtn2.disabled = !ok;
  }
  agreeAll.addEventListener('change', function(){
    // 연령은 생년월일이 통과해야만 강제로 켤 수 있음
    var canAge = (window.GALLA_ageFromBirth(bd && bd.value) || 0) >= 14;
    allBoxes.forEach(function(b){ if(b === ageAgree) b.checked = agreeAll.checked && canAge; else b.checked = agreeAll.checked; });
    refreshSignupBtn();
  });
  allBoxes.forEach(function(b){ b.addEventListener('change', function(){ syncAgreeAll(); refreshSignupBtn(); }); });
  refreshSignupBtn();
</script>
