  <!-- HEADER : COMMON TYPE B -->

    <!-- header-3(그리드 1fr·auto·1fr): ⋯ 버튼이 숨겨져도 로고가 항상 중앙.
         space-between이면 ⋯ 숨김 시 로고가 오른쪽으로 튄다. -->
    <div class="header-inner header-3">

      <!-- 뒤로가기 -->
      <button class="back-btn" id="btn-back" data-back="plaza.html">
        ← <span class="back-text">뒤로</span>
      </button>

      <!-- 로고 -->
      <img
        src="assets/logo.png"
        alt="GALLA"
        class="logo"
        onclick="location.href='index.html'"
      />

      <!-- 더보기 메뉴 -->

      <button class="more-header-btn" id="header-more-btn" style="display:none">⋯</button>

    </div>
  </header>

  <!-- GUIDE -->
  <section class="plaza-guide">
    <p>
      갈라 광장은 찬반 없는 자유 토론 공간입니다.<br>
      한 줄 던지고, 댓글로 이어가세요.
    </p>
  </section>

  <!-- MAIN POST -->
  <section class="plaza-post">
    <div class="post-inner">

      <div class="post-body">
        <h1 class="post-title"></h1>
        <div class="post-meta"></div>
        <div class="post-content"></div>

<div class="post-action-bar">

  <!-- VOTE PILL -->
  <div class="vote-pill">

    <!-- UP (추천) — 광장 목록 카드와 같은 chevron -->
    <button class="vote-btn vote-up" aria-label="upvote">
      <svg viewBox="0 0 24 24" class="icon">
        <path d="M18 15l-6-6-6 6"/>
      </svg>
    </button>

    <!-- SCORE -->
    <span class="vote-score" id="voteScore">0</span>

    <!-- DIVIDER -->
    <span class="vote-divider"></span>

    <!-- DOWN (비추) -->
    <button class="vote-btn vote-down" aria-label="downvote">
      <svg viewBox="0 0 24 24" class="icon">
        <path d="M6 9l6 6 6-6"/>
      </svg>
    </button>

  </div>

  <!-- COMMENT — 표준 말풍선 -->
  <div class="pill comment-pill">
    <svg class="icon" viewBox="0 0 24 24">
      <path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.5 8.6 8.6 0 0 1-3.9-.9L3.5 20.5l1.4-5.1a8.4 8.4 0 0 1-.9-3.9A8.4 8.4 0 0 1 12.5 3 8.4 8.4 0 0 1 21 11.5z"/>
    </svg>
    <span class="count" id="commentCount"></span>
  </div>

  <!-- BOOKMARK (표준) -->
  <button class="circle-btn bookmark-btn" id="plazaBookmarkBtn" aria-label="저장">
    <svg viewBox="0 0 24 24" class="icon">
      <path d="M18 21l-6-4.3L6 21V5.5A2.5 2.5 0 0 1 8.5 3h7A2.5 2.5 0 0 1 18 5.5V21z"/>
    </svg>
  </button>

  <!-- SHARE — 표준 종이비행기 -->
  <button class="circle-btn share-btn">
    <svg viewBox="0 0 24 24" class="icon">
      <path d="M21.5 2.5L10.8 13.2"/>
      <path d="M21.5 2.5l-6.8 19-3.9-8.3-8.3-3.9 19-6.8z"/>
    </svg>
  </button>

</div>

    </div>
  </section>

  <!-- COMMENT LIST -->
  <ul class="comment-list" id="commentList"></ul>

  <!-- COMMENT WRITE — 한 줄(입력창 + 👻 + 등록), 타 게시판과 동일 UX -->
  <section class="comment-write">
    <textarea
      id="commentInput"
      placeholder="댓글을 입력하세요"
      rows="1"
    ></textarea>

    <button type="button" class="ghost-toggle sm" id="comment-ghost">
      <span class="gt-ic">👻</span>
    </button>

    <button id="commentSubmitBtn">등록</button>
  </section>
