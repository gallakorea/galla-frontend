<html lang="ko">
<head>

  <meta property="og:image" content="https://galla.im/assets/og/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://galla.im/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://galla.im/assets/og/og-default.png">
  <meta name="description" content="찬성이냐 반대냐, 당신의 진영은? 여론이 에너지가 되는 곳, 갈라.">


  <!-- plaza_detail 전용 CSS만 -->
  <link rel="stylesheet" href="css/plaza_detail.css?v=0718r">
  <link rel="stylesheet" href="./css/owner-actions.css?v=0718r">
  <link rel="stylesheet" href="./css/header.css?v=0718r">
  <link rel="stylesheet" href="./css/nav.css?v=0718r">
  <!-- GALLA 앱 아이콘 / PWA (auto-injected) -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/app-icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/app-icons/favicon-16.png">
  <link rel="apple-touch-icon" href="/assets/app-icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="갈라">
  <link rel="stylesheet" href="./css/theme.css?v=0718r">
</head>

<body data-page="plaza">
<div id="app">

  <!-- HEADER : COMMON TYPE B -->
  <header class="header">
    <div class="header-inner">

      <!-- 뒤로가기 -->
      <button class="back-btn" id="btn-back" data-back="plaza.html">
        ← <span class="back-text">뒤로</span>
      </button>

      <!-- 로고 -->
      <img
        src="assets/logo.png"
        alt="GALLA"
        class="logo"
        onclick="location.href='index.html'"
      />

      <!-- 더보기 메뉴 -->
      <button class="more-header-btn" id="header-more-btn">⋯</button>

    </div>
  </header>

  <!-- GUIDE -->
  <section class="plaza-guide">
    <p>
      갈라 광장은 찬반 없는 자유 토론 공간입니다.<br>
      한 줄 던지고, 댓글로 이어가세요.
    </p>
  </section>

  <!-- MAIN POST -->
  <section class="plaza-post">
    <div class="post-inner">

      <div class="post-body">
        <h1 class="post-title"></h1>
        <div class="post-meta"></div>
        <div class="post-content"></div>

<div class="post-action-bar">

  <!-- VOTE PILL -->
  <div class="vote-pill">

    <!-- UP -->
    <button class="vote-btn vote-up" aria-label="upvote">
      <svg viewBox="0 0 24 24" class="icon">
        <path d="M12 3L5 10h4v8h6v-8h4z"/>
      </svg>
    </button>

    <!-- SCORE -->
    <span class="vote-score" id="voteScore">0</span>

    <!-- DIVIDER -->
    <span class="vote-divider"></span>

    <!-- DOWN -->
    <button class="vote-btn vote-down" aria-label="downvote">
      <svg viewBox="0 0 24 24" class="icon">
        <path d="M12 21l7-7h-4V6h-6v8H5z"/>
      </svg>
    </button>

  </div>

  <!-- COMMENT -->
  <div class="pill comment-pill">
    <svg class="icon" viewBox="0 0 24 24">
      <path d="M21 15a4 4 0 0 1-4 4H7l-4 4V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/>
    </svg>
    <span class="count" id="commentCount"></span>
  </div>

  <!-- BOOKMARK -->
  <button class="circle-btn bookmark-btn" id="plazaBookmarkBtn" aria-label="저장">
    <svg viewBox="0 0 24 24" class="icon">
      <path d="M17 21L12 17.25L7 21V5C7 3.89543 7.89543 3 9 3H15C16.1046 3 17 3.89543 17 5V21Z"/>
    </svg>
  </button>

  <!-- SHARE -->
  <button class="circle-btn share-btn">
    <svg viewBox="0 0 24 24" class="icon">
      <path d="M14 3l7 7-7 7"/>
      <path d="M21 10H10a7 7 0 0 0-7 7"/>
    </svg>
  </button>

</div>

    </div>
  </section>

  <!-- COMMENT LIST -->
  <ul class="comment-list" id="commentList"></ul>

  <!-- COMMENT WRITE -->
  <section class="comment-write">
    <textarea
      id="commentInput"
      placeholder="댓글을 입력하세요"
    ></textarea>

    <label class="plaza-anon-row">
      <input type="checkbox" id="comment-anon" />
      익명으로 표시
    </label>

    <button id="commentSubmitBtn">
      댓글 등록
    </button>
  </section>

  <nav class="nav">
    <div class="nav-inner">
      <button class="nav-item" data-page="index" data-target="index.html">
        <img src="./assets/icons/nav-home.svg"
             data-base="./assets/icons/nav-home.svg"
             data-active="./assets/icons/nav-home-active.svg">
      </button>

      <button class="nav-item" data-page="predict" data-target="galla-predict.html">
        <img src="./assets/icons/nav-predict.svg"
             data-base="./assets/icons/nav-predict.svg"
             data-active="./assets/icons/nav-predict-active.svg">
      </button>

      <button class="nav-item" data-page="search" data-target="search.html">
        <img src="./assets/icons/nav-search.svg"
             data-base="./assets/icons/nav-search.svg"
             data-active="./assets/icons/nav-search-active.svg">
      </button>

      <button class="nav-item" data-page="plaza" data-target="plaza.html">
        <img src="./assets/icons/nav-plaza.svg"
             data-base="./assets/icons/nav-plaza.svg"
             data-active="./assets/icons/nav-plaza-active.svg">
      </button>

      <button class="nav-item" data-page="mypage" data-target="mypage.html">
        <img src="./assets/icons/nav-user.svg"
             data-base="./assets/icons/nav-user.svg"
             data-active="./assets/icons/nav-user-active.svg">
      </button>
    </div>
  </nav>

</div>

</html>
