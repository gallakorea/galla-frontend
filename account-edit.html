<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>계정 정보 수정 - GALLA</title>

    <link rel="stylesheet" href="./css/account-edit.css?v=072686">
    <link rel="stylesheet" href="./css/nav.css?v=072686">
  <link rel="stylesheet" href="./css/galla-ui.css?v=072686">
  <!-- GALLA 앱 아이콘 / PWA (auto-injected) -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/app-icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/app-icons/favicon-16.png">
  <link rel="apple-touch-icon" href="/assets/app-icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="갈라">
  <link rel="stylesheet" href="./css/theme.css?v=072686">
<link rel="stylesheet" href="./css/desktop.css?v=072686">
</head>

<body data-page="mypage">

<div id="app">

    <!-- HEADER -->
    <header class="ae-header">
        <button class="ae-back" data-back="settings.html" aria-label="뒤로">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="ae-title">프로필 편집</div>
        <div class="ae-back" style="visibility:hidden"></div>
    </header>

    <main class="ae-main">

        <!-- AVATAR -->
        <section class="ae-avatar-sec">
            <label class="ae-avatar-wrap" for="profileInput">
                <img src="./assets/logo.png" id="profilePreview" class="ae-avatar">
                <span class="ae-avatar-cam" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                </span>
            </label>
            <label for="profileInput" class="ae-avatar-hint">프로필 사진 변경</label>
            <input type="file" id="profileInput" accept="image/*" hidden>
        </section>

        <!-- EDITABLE -->
        <section class="ae-card">
            <div class="ae-field">
                <label class="ae-label" for="nickname">닉네임</label>
                <input type="text" id="nickname" class="ae-input" maxlength="20" placeholder="닉네임을 입력하세요">
                <div class="ae-counter"><span id="nickCount">0</span>/20</div>
            </div>
            <div class="ae-divider"></div>
            <div class="ae-field">
                <label class="ae-label" for="bio">소개 문구</label>
                <textarea id="bio" class="ae-input ae-textarea" maxlength="150" placeholder="나를 한 줄로 표현해보세요"></textarea>
                <div class="ae-counter"><span id="bioCount">0</span>/150</div>
            </div>
            <div class="ae-divider"></div>
            <div class="ae-field">
                <label class="ae-label" for="phoneField">전화번호</label>
                <input type="tel" id="phoneField" class="ae-input" inputmode="numeric"
                       maxlength="13" placeholder="010-0000-0000">
            </div>
        </section>

        <!-- READONLY -->
        <div class="ae-section-label">계정 정보</div>
        <section class="ae-card ae-readonly">
            <div class="ae-info-row">
                <span class="ae-info-key">
                    <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 6L2 7"/></svg>
                    이메일
                </span>
                <span class="ae-info-val" id="emailField">-</span>
            </div>
        </section>
        <p class="ae-lock-note">
            <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            이메일은 보안을 위해 변경할 수 없어요
        </p>

    </main>

</div>

<!-- STICKY SAVE -->
<div class="ae-save-bar">
    <button class="ae-save" id="saveBtn">변경사항 저장</button>
</div>

<nav class="nav">
  <div class="nav-inner">
      <button class="nav-item" data-page="index" data-target="index.html">
        <img src="./assets/icons/nav-home.svg"
             data-base="./assets/icons/nav-home.svg"
             data-active="./assets/icons/nav-home-active.svg">
      </button>

      <button class="nav-item" data-page="predict" data-target="galla-predict.html">
        <img src="./assets/icons/nav-predict.svg"
             data-base="./assets/icons/nav-predict.svg"
             data-active="./assets/icons/nav-predict-active.svg">
      </button>

      <button class="nav-item nav-dm" data-page="dm" data-target="dm.html" aria-label="메시지"><img src="./assets/icons/nav-dm.svg" data-base="./assets/icons/nav-dm.svg" data-active="./assets/icons/nav-dm-active.svg"><span class="nav-badge" id="navDmBadge" hidden></span></button>

      <button class="nav-item" data-page="trend" data-target="search.html"><img src="./assets/icons/nav-trend.svg" data-base="./assets/icons/nav-trend.svg" data-active="./assets/icons/nav-trend-active.svg"></button>

      <button class="nav-item" data-page="mypage" data-target="mypage.html">
        <img src="./assets/icons/nav-user.svg"
             data-base="./assets/icons/nav-user.svg"
             data-active="./assets/icons/nav-user-active.svg">
      </button>
    </div>
</nav>

</body>
</html>
