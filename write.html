<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>새 갈라 만들기 - GALLA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="./css/write.css" />
  <link rel="stylesheet" href="./css/header.css">
  <link rel="stylesheet" href="./css/nav.css">
</head>

<body data-page="write">
<div class="app-root">

  <header class="header">
    <div class="header-inner header-common">
      <img src="./assets/logo.png" class="logo" onclick="location.href='index.html'" />
      <button class="header-action" onclick="alert('share')">
        <img src="./assets/icons/icon-share.svg" alt="share" />
      </button>
    </div>
  </header>

  <main class="page-main">
    <div class="page-inner">

      <section class="section-block">
        <h1 class="write-main-title">새 갈라치기 만들기</h1>
        <p class="write-main-desc">사람들의 찬반과 후원을 모아보세요.</p>
      </section>

      <!-- STEP INDICATOR -->
      <div class="wizard-steps">
        <div class="wizard-step active" data-step="1"><span class="wizard-dot">1</span> 미디어</div>
        <div class="wizard-line"></div>
        <div class="wizard-step" data-step="2"><span class="wizard-dot">2</span> 세부정보</div>
      </div>

      <form id="writeForm">

        <!-- ================= STEP 1 : 미디어 ================= -->
        <section class="wizard-panel" id="panel-1">

          <p class="write-main-desc" style="margin-bottom:14px;">
            사진(캐러셀) 또는 동영상 중 <b>하나</b>를 선택해 올려주세요.
          </p>

          <!-- 미디어 타입 탭 -->
          <div class="media-tabs">
            <button type="button" class="media-tab active" data-media="photo">🖼️ 사진</button>
            <button type="button" class="media-tab" data-media="video">🎬 동영상</button>
          </div>

          <!-- 사진 모드 -->
          <div class="media-pane" id="pane-photo">
            <input type="file" id="thumbnail" class="visually-hidden-file" accept="image/*" multiple />
            <label for="thumbnail" id="thumbnailBtn" class="media-drop">
              <span class="media-drop-icon">＋</span>
              <span class="media-drop-title">사진 업로드</span>
              <span class="media-drop-sub">최대 10장 · 여러 장은 인스타처럼 캐러셀 (첫 장이 대표)</span>
            </label>
            <div id="thumbPreview" class="preview-box"></div>
          </div>

          <!-- 동영상 모드 -->
          <div class="media-pane" id="pane-video" hidden>
            <input type="file" id="video" class="visually-hidden-file" accept="video/*" />
            <label for="video" id="videoBtn" class="media-drop">
              <span class="media-drop-icon">＋</span>
              <span class="media-drop-title">동영상 업로드</span>
              <span class="media-drop-sub">세로 4:5 권장 · 핵심 요소는 중앙에 배치</span>
            </label>
            <div id="videoPreview" class="preview-box"></div>
          </div>

          <div class="wizard-nav">
            <button type="button" class="primary-btn" id="toStep2">다음</button>
          </div>
        </section>

        <!-- ================= STEP 2 : 세부정보 ================= -->
        <section class="wizard-panel" id="panel-2" hidden>

          <!-- 익명 -->
          <div class="anon-toggle">
            <span>익명으로 발의하기</span>
            <label class="switch">
              <input type="checkbox" id="isAnonymous" />
              <span class="slider"></span>
            </label>
          </div>

          <!-- 카테고리 -->
          <div class="field-block">
            <label class="field-label">카테고리 <span class="required">(필수)</span></label>
            <select id="category" class="input-field" required>
              <option value="">논쟁 주제에 맞는 카테고리를 선택하세요</option>
              <option>정치·사회</option>
              <option>경제·투자</option>
              <option>직장·경력</option>
              <option>연애·결혼</option>
              <option>생활·일상</option>
              <option>패션·뷰티</option>
              <option>엔터·스포츠</option>
              <option>세계·여행</option>
              <option>음식·맛집</option>
              <option>19금</option>
              <option>기타</option>
            </select>
          </div>

          <!-- 제목 -->
          <div class="field-block">
            <label class="field-label">제목 <span class="required">(필수)</span></label>
            <input id="title" class="input-field" maxlength="80"
              placeholder="사람들이 찬반을 고민하게 만들 한 문장 제목 (최대 80자)" />
          </div>

          <!-- 한줄 요약 -->
          <div class="field-block">
            <label class="field-label">한줄 요약 <span class="required">(필수)</span></label>
            <input id="oneLine" class="input-field"
              placeholder="이 이슈를 한 문장으로 요약해 주세요" />
          </div>

          <!-- 양 진영 이름 -->
          <div class="field-block">
            <label class="field-label">양 진영 이름 <span class="optional">(선택 · 비우면 기본값)</span></label>
            <div class="faction-name-row">
              <input id="factionA" class="input-field faction-input" maxlength="20" placeholder="찬성이오" />
              <span class="faction-vs">VS</span>
              <input id="factionB" class="input-field faction-input" maxlength="20" placeholder="난 반댈세" />
            </div>
            <div class="guide-text">피드·이슈 화면의 👍 / 👎 찬반 버튼에 그대로 표시됩니다.</div>
          </div>

          <!-- 나의 입장 -->
          <div class="field-block" id="authorStanceBlock">
            <label class="field-label">나의 입장 <span class="required">(필수)</span></label>
            <div class="ai-tone-radio-group" style="margin-top: 10px;">
              <label class="ai-tone-option">
                <input type="radio" name="authorStance" value="pro" required />
                <span id="stanceProLabel">👍 찬성이오</span>
              </label>
              <label class="ai-tone-option">
                <input type="radio" name="authorStance" value="con" required />
                <span id="stanceConLabel">👎 난 반댈세</span>
              </label>
            </div>
            <div class="guide-text" style="margin-top: 8px;">
              이 선택은 공개되지 않으며, AI 논점/뉴스를 정렬하는 기준값으로만 사용됩니다.
            </div>
          </div>

          <!-- 이슈 설명 -->
          <div class="field-block">
            <label class="field-label">
              이슈 설명 <span class="required">(필수)</span>
              <span class="char-limit">· 최대 500자</span>
            </label>
            <textarea id="description" class="input-field textarea" maxlength="500"
              placeholder="왜 이 문제가 논쟁거리인지, 찬반이 갈리는 이유를 구체적으로 설명해 주세요 (최대 500자)"></textarea>
            <button type="button" id="openAiModal" class="ai-main-btn">
              ✨ AI에게 글 다듬기
            </button>
          </div>

          <!-- References -->
          <div class="field-block">
            <label class="field-label">관련 기사·자료 링크 (선택)</label>
            <input type="url" id="ref1" class="input-field" />
            <input type="url" id="ref2" class="input-field" />
            <input type="url" id="ref3" class="input-field" />
          </div>

          <!-- 기부처 -->
          <div class="field-block">
            <label class="field-label">기부처 선택 <span class="required">(필수)</span></label>
            <select id="donationTarget" class="input-field" required>
              <option value="">기부처를 선택하세요</option>
              <option>사회복지</option>
              <option>아동·청소년 지원</option>
              <option>장애인 지원</option>
              <option>환경 보호</option>
              <option>재난·긴급구호</option>
              <option>교육 및 문화</option>
              <option>동물 보호</option>
              <option>헌혈·재능기부</option>
            </select>
            <div class="guide-text">선택한 기부처는 미리보기 및 발행 후 공개됩니다</div>
          </div>

          <div class="field-block donation-guide">
            <p class="donation-guide-text">
              본 이슈를 통해 발생한 수익금의 일부는 선택하신 기부처에 전달됩니다.<br />
              기부 내역은 투명하게 공개되며, 갈라 참여는 더 나은 사회로 이어집니다.
            </p>
          </div>

          <div class="wizard-nav">
            <button type="button" class="ghost-btn" id="backStep1">이전</button>
            <button type="submit" class="primary-btn">미리보기</button>
          </div>
        </section>

      </form>

      <!-- ✅ 미리보기 렌더 영역 -->
      <div id="issuePreview"></div>

    </div>
  </main>

  <nav class="nav">
    <div class="nav-inner">
      <button class="nav-item" data-page="index" data-target="index.html">
        <img src="./assets/icons/nav-home.svg"
             data-base="./assets/icons/nav-home.svg"
             data-active="./assets/icons/nav-home-active.svg">
      </button>

      <button class="nav-item" data-page="predict" data-target="galla-predict.html">
        <img src="./assets/icons/nav-predict.svg"
             data-base="./assets/icons/nav-predict.svg"
             data-active="./assets/icons/nav-predict-active.svg">
      </button>

      <button class="nav-item" data-page="search" data-target="search.html">
        <img src="./assets/icons/nav-search.svg"
             data-base="./assets/icons/nav-search.svg"
             data-active="./assets/icons/nav-search-active.svg">
      </button>

      <button class="nav-item" data-page="plaza" data-target="plaza.html">
        <img src="./assets/icons/nav-plaza.svg"
             data-base="./assets/icons/nav-plaza.svg"
             data-active="./assets/icons/nav-plaza-active.svg">
      </button>

      <button class="nav-item" data-page="mypage" data-target="mypage.html">
        <img src="./assets/icons/nav-user.svg"
             data-base="./assets/icons/nav-user.svg"
             data-active="./assets/icons/nav-user-active.svg">
      </button>
    </div>
  </nav>
  <script src="./js/nav.js"></script>

<!-- 🎥 SPEECH MODAL -->
<div id="speechModal" class="speech-modal" style="display:none;">
  <div class="speech-modal-inner">
    <button id="closeSpeech" class="speech-close">✕</button>
    <video
      id="speechVideo"
      controls
      playsinline
      webkit-playsinline
    ></video>
  </div>
</div>

<!-- AI MODAL -->
<div id="aiModal" class="ai-modal">
  <div class="ai-modal-inner">

    <!-- HEADER -->
<div class="ai-modal-header">
  <h2>AI 글 다듬기</h2>
  <button id="aiClose">✕</button>
</div>

<!-- 🔥 여기 추가 -->
<div class="ai-modal-body">

<label class="ai-label">AI 논쟁 입장 선택</label>
<select id="aiStance" class="input-field">
  <option value="neutral">입장 없이 쟁점만 정리</option>
  <option value="pro">찬성 입장에서 주장 강화</option>
  <option value="con">반대 입장에서 주장 강화</option>
  <option value="dual">찬성·반대 양쪽 논리 모두 제시</option>
  <option value="question">독자가 판단하게 질문형 구성</option>
</select>

<label class="ai-label">어조 강도</label>

<div class="ai-tone-radio-group">
  <label class="ai-tone-option">
    <input type="radio" name="aiTone" value="5">
    <span>매우 공격적</span>
  </label>

  <label class="ai-tone-option">
    <input type="radio" name="aiTone" value="4">
    <span>공격적</span>
  </label>

  <label class="ai-tone-option">
    <input type="radio" name="aiTone" value="3" checked>
    <span>중간</span>
  </label>

  <label class="ai-tone-option">
    <input type="radio" name="aiTone" value="2">
    <span>온화한</span>
  </label>

  <label class="ai-tone-option">
    <input type="radio" name="aiTone" value="1">
    <span>매우 온화한</span>
  </label>
</div>

<!-- ✅ DIRECT CUSTOM PROMPT (custom 선택 시만 노출) -->
<div
  id="aiCustomPromptWrap"
  class="ai-custom-wrap"
  style="display: none;"
>
  <label class="ai-label highlight">AI에게 직접 지시</label>
  <textarea
    id="aiPrompt"
    class="input-field textarea compact"
    placeholder="예: 결론부터 제시하고, 핵심 근거 3가지를 논리적으로 정리해줘"
  ></textarea>
</div>

       <!-- USER TEXT -->
    <label class="ai-label">내가 쓴 글</label>
    <textarea
      id="aiUserText"
      class="input-field textarea user-text"
      placeholder="생각을 그대로 두서없이 적어주세요. 논리와 구조는 AI가 만듭니다."
    ></textarea>

    <!-- RUN -->
    <button id="runAi" class="btn-sub full">AI 실행</button>

    <!-- RESULT -->
    <label class="ai-label">※ 아래 내용은 원문의 감정적·주관적 표현을
   ‘논쟁 가능한 쟁점 구조’로 재구성한 결과입니다.
   최종 입장은 작성자에게 있으며,
   GALLA는 특정 의견을 대변하지 않습니다.</label>
    <textarea
      id="aiResultText"
      class="input-field textarea result-text"
      placeholder="AI가 논리적으로 재구성한 결과"
    ></textarea>

    </div>

    <!-- APPLY -->
    <button id="applyAi" class="btn-main full">
      AI 적용하기
    </button>

  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="./js/supabase.js"></script>
<script src="./js/media-upload.js"></script>
<script src="./js/img-crop.js"></script>

<script src="./js/write.js"></script>
<script src="./js/write.ai.js"></script>
<!-- draft 관련은 반드시 아래 -->
<script src="./js/write.draft.restore.js"></script>
<script src="./js/write.draft.save.js"></script>

</body>
</html>
