<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>비밀번호 변경 - GALLA</title>

  <link rel="stylesheet" href="./css/index.css?v=0714p">
  <link rel="stylesheet" href="./css/nav.css?v=0714p">
  <style>
    body {
      background:#000;
      color:#fff;
      max-width:480px;
      margin:0 auto;
      font-family:-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;
    }
    .section { padding:24px 16px; }
    .input-group { margin-bottom:20px; }
    .input-label { font-size:14px; color:#aaa; margin-bottom:6px; }
    .input-field {
      width:100%;
      padding:12px;
      background:#0d0d0d;
      border:1px solid #1c1c1c;
      border-radius:12px;
      color:#fff;
      font-size:15px;
    }
    .save-btn {
      width:100%;
      padding:14px;
      background:#3B82F6;   /* ✅ 파란색 */
      color:#fff;
      font-size:16px;
      font-weight:700;
      border:none;
      border-radius:12px;
      cursor:pointer;
    }
    .header {
      position:sticky;
      top:0;
      background:#000;
      border-bottom:1px solid #111;
      z-index:10;
    }
    .header-inner {
      height:50px;
      padding:0 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .back-btn { font-size:20px; cursor:pointer; }
    .header-title { font-weight:700; }
    .header-spacer { width:24px; }
  </style>
  <link rel="stylesheet" href="./css/galla-ui.css?v=0714p">
  <!-- GALLA 앱 아이콘 / PWA (auto-injected) -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/app-icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/app-icons/favicon-16.png">
  <link rel="apple-touch-icon" href="/assets/app-icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="갈라">
  <link rel="stylesheet" href="./css/theme.css?v=0714p">
</head>

<body data-page="mypage">

<div id="app">

  <!-- HEADER -->
  <header class="st-header">
        <button class="st-back" onclick="history.back()" aria-label="뒤로">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="st-title">비밀번호 변경</div>
        <div class="st-back" style="visibility:hidden"></div>
    </header>

  <!-- CONTENT -->
  <section class="section">
    <div class="input-group">
      <div class="input-label">새 비밀번호</div>
      <input type="password" id="newPassword" class="input-field" placeholder="8자 이상">
    </div>

    <div class="input-group">
      <div class="input-label">새 비밀번호 확인</div>
      <input type="password" id="confirmPassword" class="input-field">
    </div>

    <button class="save-btn" id="changePasswordBtn">변경하기</button>
  </section>

</div>

<!-- Supabase -->
<script src="./js/vendor/supabase.js?v=0714p"></script>
<script src="./js/supabase.js?v=0714p"></script>
<script src="./js/change-password.js?v=0714p"></script>

<!-- ============================= -->
<!-- ✅ 통합 NAV -->
<!-- ============================= -->
<nav class="nav">
  <div class="nav-inner">
      <button class="nav-item" data-page="index" data-target="index.html">
        <img src="./assets/icons/nav-home.svg"
             data-base="./assets/icons/nav-home.svg"
             data-active="./assets/icons/nav-home-active.svg">
      </button>

      <button class="nav-item" data-page="predict" data-target="galla-predict.html">
        <img src="./assets/icons/nav-predict.svg"
             data-base="./assets/icons/nav-predict.svg"
             data-active="./assets/icons/nav-predict-active.svg">
      </button>

      <button class="nav-item" data-page="search" data-target="search.html">
        <img src="./assets/icons/nav-search.svg"
             data-base="./assets/icons/nav-search.svg"
             data-active="./assets/icons/nav-search-active.svg">
      </button>

      <button class="nav-item" data-page="plaza" data-target="plaza.html">
        <img src="./assets/icons/nav-plaza.svg"
             data-base="./assets/icons/nav-plaza.svg"
             data-active="./assets/icons/nav-plaza-active.svg">
      </button>

      <button class="nav-item" data-page="mypage" data-target="mypage.html">
        <img src="./assets/icons/nav-user.svg"
             data-base="./assets/icons/nav-user.svg"
             data-active="./assets/icons/nav-user-active.svg">
      </button>
    </div>
</nav>
<script src="./js/nav.js?v=0714p"></script>

</body>
</html>
