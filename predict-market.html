<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GALLA - 예측 마켓</title>
  <link rel="stylesheet" href="./css/galla-predict.css" />
  <link rel="stylesheet" href="./css/predict-market.css" />
  <link rel="stylesheet" href="./css/header.css">
  <link rel="stylesheet" href="./css/nav.css">
</head>

<body data-page="predict">
<div id="app">

<header class="header">
  <div class="header-inner">
    <button class="back-btn hb-side" onclick="history.length>1?history.back():location.href='galla-predict.html'">← <span class="back-text">뒤로</span></button>
    <img src="assets/logo.png" alt="GALLA" class="logo" onclick="location.href='index.html'" />
    <span class="hb-side"></span>
  </div>
</header>

<main class="pmd-main" id="pmdMain">
  <div class="pmd-loading" id="pmdLoading">불러오는 중…</div>
</main>

<div id="pmToast" class="pm-toast" hidden></div>

<!-- ✅ 통합 NAV -->
<nav class="nav">
  <div class="nav-inner">
      <button class="nav-item" data-page="index" data-target="index.html">
        <img src="./assets/icons/nav-home.svg" data-base="./assets/icons/nav-home.svg" data-active="./assets/icons/nav-home-active.svg">
      </button>
      <button class="nav-item" data-page="predict" data-target="galla-predict.html">
        <img src="./assets/icons/nav-predict.svg" data-base="./assets/icons/nav-predict.svg" data-active="./assets/icons/nav-predict-active.svg">
      </button>
      <button class="nav-item" data-page="search" data-target="search.html">
        <img src="./assets/icons/nav-search.svg" data-base="./assets/icons/nav-search.svg" data-active="./assets/icons/nav-search-active.svg">
      </button>
      <button class="nav-item" data-page="plaza" data-target="plaza.html">
        <img src="./assets/icons/nav-plaza.svg" data-base="./assets/icons/nav-plaza.svg" data-active="./assets/icons/nav-plaza-active.svg">
      </button>
      <button class="nav-item" data-page="mypage" data-target="mypage.html">
        <img src="./assets/icons/nav-user.svg" data-base="./assets/icons/nav-user.svg" data-active="./assets/icons/nav-user-active.svg">
      </button>
  </div>
</nav>

</div><!-- /#app -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="./js/supabase.js"></script>
<script src="./js/predict-market.js"></script>
<script src="./js/nav.js"></script>

</body>
</html>
