<body data-page="predict">
<div id="app">

<header class="header header-common">
  <div class="header-inner header-3">
    <button class="hdr-btn hdr-write" data-write-hub="predict" aria-label="글쓰기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <img src="assets/logo.png" class="logo" alt="GALLA" onclick="(window.GALLA_nav||function(u){location.href=u})('index.html')" />
    <button id="pointPill" class="point-pill" title="탭하여 출석 포인트 받기">
      <span class="point-coin">🪙</span>
      <span id="pointBalance">–</span>
    </button>
  </div>
</header>

<main class="predict-main">

  <!-- 탭: 마켓 / 랭킹 -->
  <div class="seg-tabs">
    <button class="seg-tab active" data-view="markets">🔮 예측장</button>
    <button class="seg-tab" data-view="rank">🏆 랭킹</button>
  </div>

  <!-- ===== 마켓 뷰 ===== -->
  <section id="view-markets" class="predict-view pm-lobby">
    <!-- 처음 온 사람을 위한 놀이 안내 (JS 주입) -->
    <div id="pmGuide"></div>
    <!-- 연승 콤보 / 데일리 코인 / 오늘의 대박 보너스 (JS 주입) -->
    <div id="pmCombo"></div>
    <div id="pmDaily"></div>
    <div id="pmJackpot"></div>
    <div class="cat-chips" id="catChips">
      <button class="cat-chip active" data-cat="">전체</button>
      <button class="cat-chip" data-cat="정치·사회">정치·사회</button>
      <button class="cat-chip" data-cat="경제·투자">경제·투자</button>
      <button class="cat-chip" data-cat="엔터·스포츠">엔터·스포츠</button>
      <button class="cat-chip" data-cat="연애·결혼">연애·결혼</button>
      <button class="cat-chip" data-cat="생활·일상">생활·일상</button>
      <button class="cat-chip" data-cat="기타">기타</button>
    </div>

    <div class="sort-row">
      <select id="sortSelect" class="sort-select">
        <option value="volume">🔥 거래량순</option>
        <option value="new">🆕 최신순</option>
        <option value="closing">⏰ 마감임박순</option>
      </select>
    </div>

    <div id="marketList" class="market-list"></div>
    <!-- 📸 지난 목록 즉시 주입 -->
    <script src="js/snapshot.js?v=0820101"></script>
    <div id="marketsEmpty" class="empty-zone" hidden>아직 예측 마켓이 없습니다. 첫 마켓을 만들어보세요!</div>
  </section>

  <!-- ===== 랭킹 ===== -->
  <section id="view-rank" class="predict-view" hidden>
    <!-- 내 등급 카드 -->
    <div id="myTierCard" class="tier-card"></div>

    <!-- 랭킹 서브탭 -->
    <div class="rank-subtabs">
      <button class="rank-subtab active" data-rank="galla">종합</button>
      <button class="rank-subtab" data-rank="king">👑 예측왕</button>
      <button class="rank-subtab" data-rank="god">🔮 예측의 신</button>
    </div>

    <div id="rankGalla" class="rank-pane">
      <div class="lb-caption">보유 포인트 = 갈라 통합 랭킹</div>
      <div id="gallaList" class="leaderboard"></div>
    </div>
    <div id="rankKing" class="rank-pane" hidden>
      <div class="lb-caption">예측으로 포인트를 가장 많이 딴 예언가</div>
      <div id="kingList" class="leaderboard"></div>
    </div>
    <div id="rankGod" class="rank-pane" hidden>
      <div class="lb-caption">만든 마켓에 참여가 가장 많이 몰린 창시자</div>
      <div id="godList" class="leaderboard"></div>
    </div>
  </section>

</main>

<!-- 예측 만들기는 헤더 통합 + 글쓰기 허브로 통일 (FAB 제거) -->

<!-- 마켓 생성 모달 -->
<div id="createModal" class="pm-modal" hidden>
  <div class="pm-modal-inner">
    <div class="pm-modal-header">
      <h2>새 예측 마켓</h2>
      <button id="createClose" class="pm-close">✕</button>
    </div>
    <div class="pm-modal-body">
      <label class="pm-label">마켓 유형</label>
      <div class="pm-type-tabs">
        <button type="button" class="pm-type-tab active" data-type="binary">예 / 아니오</button>
        <button type="button" class="pm-type-tab" data-type="multi">여러 선택지</button>
      </div>

      <label class="pm-label">질문</label>
      <input id="mQuestion" class="pm-input" maxlength="120" placeholder="예: 비트코인이 연말까지 10만 달러를 돌파한다?" />

      <!-- 여러 선택지 후보 입력 -->
      <div id="mOutcomesWrap" hidden>
        <label class="pm-label">선택지 (후보) <span class="pm-hint">2~8개</span></label>
        <div id="mOutcomes"></div>
        <button type="button" id="mAddOutcome" class="pm-add-outcome">＋ 선택지 추가</button>
      </div>

      <label class="pm-label">설명 (선택)</label>
      <textarea id="mDesc" class="pm-input pm-textarea" maxlength="500" placeholder="정산 기준을 명확히 적어주세요. 예: 2026-12-31 종가 기준"></textarea>

      <label class="pm-label">카테고리</label>
      <select id="mCategory" class="pm-input">
        <option>정치·사회</option>
        <option>경제·투자</option>
        <option>엔터·스포츠</option>
        <option>연애·결혼</option>
        <option>생활·일상</option>
        <option>기타</option>
      </select>

      <label class="pm-label">해시태그 (선택)</label>
      <input id="pred-tags" class="pm-input" maxlength="140" autocomplete="off"
        placeholder="#해시태그  (예: 비트코인 코인 · 공백으로 구분, 최대 10개)" />

      <label class="pm-label">대표 이미지 (선택)</label>
      <input type="file" id="mImage" accept="image/*" class="visually-hidden-file" />
      <label for="mImage" id="mImageBtn" class="pm-image-btn">이미지 선택</label>
      <div id="mImagePreview" class="pm-image-preview"></div>

      <label class="pm-label">마감 일시</label>
      <input id="mCloseAt" class="pm-input" type="datetime-local" />

      <button id="createSubmit" class="pm-submit">마켓 만들기</button>
    </div>
  </div>
</div>
