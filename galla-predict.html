<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>GALLA - 갈라예측</title>
  <link rel="stylesheet" href="./css/galla-predict.css?v=0718b" />
  <link rel="stylesheet" href="./css/header.css?v=0718b">
  <link rel="stylesheet" href="./css/write-hub.css?v=0718b">
  <link rel="stylesheet" href="./css/nav.css?v=0718b">
  <link rel="stylesheet" href="./css/composer-page.css?v=0718b">
  <!-- GALLA 앱 아이콘 / PWA (auto-injected) -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/app-icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/app-icons/favicon-16.png">
  <link rel="apple-touch-icon" href="/assets/app-icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="갈라">
  <link rel="stylesheet" href="./css/theme.css?v=0718b">
</head>

<body data-page="predict">
<div id="app">

<header class="header header-common">
  <div class="header-inner header-3">
    <button class="hdr-btn hdr-write" data-write-hub="predict" aria-label="글쓰기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <img src="assets/logo.png" class="logo" alt="GALLA" onclick="location.href='index.html'" />
    <button id="pointPill" class="point-pill" title="탭하여 출석 포인트 받기">
      <span class="point-coin">🪙</span>
      <span id="pointBalance">–</span>
    </button>
  </div>
</header>

<main class="predict-main">

  <!-- 상단 소개 -->
  <section class="predict-hero">
    <h1 class="predict-title">🔮 갈라예측</h1>
    <p class="predict-sub">여론을 예측하고 포인트로 겨루세요. 현금 없는 예측 게임.</p>
  </section>

  <!-- 탭: 마켓 / 랭킹 -->
  <div class="seg-tabs">
    <button class="seg-tab active" data-view="markets">🔮 마켓</button>
    <button class="seg-tab" data-view="rank">🏆 랭킹</button>
  </div>

  <!-- ===== 마켓 뷰 ===== -->
  <section id="view-markets" class="predict-view">
    <div class="cat-chips" id="catChips">
      <button class="cat-chip active" data-cat="">전체</button>
      <button class="cat-chip" data-cat="정치·사회">정치·사회</button>
      <button class="cat-chip" data-cat="경제·투자">경제·투자</button>
      <button class="cat-chip" data-cat="엔터·스포츠">엔터·스포츠</button>
      <button class="cat-chip" data-cat="연애·결혼">연애·결혼</button>
      <button class="cat-chip" data-cat="생활·일상">생활·일상</button>
      <button class="cat-chip" data-cat="기타">기타</button>
    </div>

    <div class="sort-row">
      <select id="sortSelect" class="sort-select">
        <option value="volume">🔥 거래량순</option>
        <option value="new">🆕 최신순</option>
        <option value="closing">⏰ 마감임박순</option>
      </select>
    </div>

    <div id="marketList" class="market-list"></div>
    <div id="marketsEmpty" class="empty-zone" hidden>아직 예측 마켓이 없습니다. 첫 마켓을 만들어보세요!</div>
  </section>

  <!-- ===== 랭킹 ===== -->
  <section id="view-rank" class="predict-view" hidden>
    <!-- 내 등급 카드 -->
    <div id="myTierCard" class="tier-card"></div>

    <!-- 랭킹 서브탭 -->
    <div class="rank-subtabs">
      <button class="rank-subtab active" data-rank="galla">종합</button>
      <button class="rank-subtab" data-rank="king">👑 예측왕</button>
      <button class="rank-subtab" data-rank="god">🔮 예측의 신</button>
    </div>

    <div id="rankGalla" class="rank-pane">
      <div class="lb-caption">보유 포인트 = 갈라 통합 랭킹</div>
      <div id="gallaList" class="leaderboard"></div>
    </div>
    <div id="rankKing" class="rank-pane" hidden>
      <div class="lb-caption">예측으로 포인트를 가장 많이 딴 예언가</div>
      <div id="kingList" class="leaderboard"></div>
    </div>
    <div id="rankGod" class="rank-pane" hidden>
      <div class="lb-caption">만든 마켓에 베팅이 가장 많이 몰린 창시자</div>
      <div id="godList" class="leaderboard"></div>
    </div>
  </section>

</main>

<!-- 예측 만들기는 헤더 통합 + 글쓰기 허브로 통일 (FAB 제거) -->

<!-- 마켓 생성 모달 -->
<div id="createModal" class="pm-modal" hidden>
  <div class="pm-modal-inner">
    <div class="pm-modal-header">
      <h2>새 예측 마켓</h2>
      <button id="createClose" class="pm-close">✕</button>
    </div>
    <div class="pm-modal-body">
      <label class="pm-label">마켓 유형</label>
      <div class="pm-type-tabs">
        <button type="button" class="pm-type-tab active" data-type="binary">예 / 아니오</button>
        <button type="button" class="pm-type-tab" data-type="multi">여러 선택지</button>
      </div>

      <label class="pm-label">질문</label>
      <input id="mQuestion" class="pm-input" maxlength="120" placeholder="예: 비트코인이 연말까지 10만 달러를 돌파한다?" />

      <!-- 여러 선택지 후보 입력 -->
      <div id="mOutcomesWrap" hidden>
        <label class="pm-label">선택지 (후보) <span class="pm-hint">2~8개</span></label>
        <div id="mOutcomes"></div>
        <button type="button" id="mAddOutcome" class="pm-add-outcome">＋ 선택지 추가</button>
      </div>

      <label class="pm-label">설명 (선택)</label>
      <textarea id="mDesc" class="pm-input pm-textarea" maxlength="500" placeholder="정산 기준을 명확히 적어주세요. 예: 2026-12-31 종가 기준"></textarea>

      <label class="pm-label">카테고리</label>
      <select id="mCategory" class="pm-input">
        <option>정치·사회</option>
        <option>경제·투자</option>
        <option>엔터·스포츠</option>
        <option>연애·결혼</option>
        <option>생활·일상</option>
        <option>기타</option>
      </select>

      <label class="pm-label">대표 이미지 (선택)</label>
      <input type="file" id="mImage" accept="image/*" class="visually-hidden-file" />
      <label for="mImage" id="mImageBtn" class="pm-image-btn">이미지 선택</label>
      <div id="mImagePreview" class="pm-image-preview"></div>

      <label class="pm-label">마감 일시</label>
      <input id="mCloseAt" class="pm-input" type="datetime-local" />

      <button id="createSubmit" class="pm-submit">마켓 만들기</button>
    </div>
  </div>
</div>

<!-- 안내 토스트 -->
<div id="pmToast" class="pm-toast" hidden></div>

<nav class="nav">
  <div class="nav-inner">
      <button class="nav-item" data-page="index" data-target="index.html">
        <img src="./assets/icons/nav-home.svg" data-base="./assets/icons/nav-home.svg" data-active="./assets/icons/nav-home-active.svg">
      </button>
      <button class="nav-item" data-page="predict" data-target="galla-predict.html">
        <img src="./assets/icons/nav-predict.svg" data-base="./assets/icons/nav-predict.svg" data-active="./assets/icons/nav-predict-active.svg">
      </button>
      <button class="nav-item" data-page="search" data-target="search.html">
        <img src="./assets/icons/nav-search.svg" data-base="./assets/icons/nav-search.svg" data-active="./assets/icons/nav-search-active.svg">
      </button>
      <button class="nav-item" data-page="plaza" data-target="plaza.html">
        <img src="./assets/icons/nav-plaza.svg" data-base="./assets/icons/nav-plaza.svg" data-active="./assets/icons/nav-plaza-active.svg">
      </button>
      <button class="nav-item" data-page="mypage" data-target="mypage.html">
        <img src="./assets/icons/nav-user.svg" data-base="./assets/icons/nav-user.svg" data-active="./assets/icons/nav-user-active.svg">
      </button>
  </div>
</nav>

<script src="./js/vendor/supabase.js?v=0718b"></script>
<script src="./js/supabase.js?v=0718b"></script>
<script src="./js/follow.js?v=0718b"></script>
<script src="js/share-sheet.js?v=0718b"></script>
<script src="./js/video-compress.js?v=0718b"></script>
<script src="./js/media-upload.js?v=0718b"></script>
<script src="./js/tiers.js?v=0718b"></script>
<script src="js/composer-page.js?v=0718b"></script>
<script src="./js/nav.js?v=0718b"></script>
<script src="./js/write-hub.js?v=0718b"></script>
<script src="./js/galla-predict.js?v=0718b"></script>

</body>
</html>
