<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>갈라 관제</title>
<!-- 🛰 관리자 화면은 별도 관제 앱(/ops/)으로 옮겼다(26.9.22 사장님). 옛 주소는 넘겨주기만, 갈라 앱 안에선 열지 않는다. -->
<script>
(function(){
  var native = !!(window.Capacitor && (!window.Capacitor.isNativePlatform || window.Capacitor.isNativePlatform()));
  if (native) { location.replace('/index.html'); return; }
  var m = (location.search.match(/[?&]mod=([a-z]+)/) || [])[1];
  location.replace('/ops/' + (m ? '#/' + m : ''));
})();
</script></head>
<body style="background:#0a0a0b;color:#aaa;font:14px system-ui;padding:40px;text-align:center">관제 앱으로 이동 중… <a href="/ops/" style="color:#9db8ff">바로 가기</a></body></html>
