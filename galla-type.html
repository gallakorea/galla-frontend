<script>
/* ===============================
   Supabase 준비 확인
=============================== */
function waitSupabase() {
    return new Promise(resolve => {
        const timer = setInterval(() => {
            if (window.supabaseClient) {
                clearInterval(timer);
                resolve(window.supabaseClient);
            }
        }, 20);
    });
}

(async () => {
    const supabase = await waitSupabase();

    /* 로그인 체크 */
    const { data: sessionData } = await supabase.auth.getSession();

    if (!sessionData.session?.user) {
        alert("로그인이 필요합니다.");
        location.href = "login.html";
        return;
    }

    const user = sessionData.session.user;

    // 실제 행동 기반 성향 계산 → 화면 채우기 (행동 바뀌면 매번 재계산됨)
    try {
        const data = await window.GALLA_computeType(supabase, user.id);
        window.GALLA_renderTypePage(data);
    } catch (e) { console.error("[galla-type]", e); }
})();
</script>
