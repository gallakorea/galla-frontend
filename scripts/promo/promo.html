<style>
*{box-sizing:border-box;margin:0;padding:0}

<script>
(function () {
  var AR = new URLSearchParams(location.search).get("ar") || "16x9", TALL = AR === "9x16";
  var W = TALL ? 1080 : 1920, H = TALL ? 1920 : 1080;
  var S = document.getElementById("S"), $ = function (id) { return document.getElementById(id); };
  S.style.setProperty("--h1", (TALL ? 120 : 112) + "px");
  S.style.setProperty("--vs", (TALL ? 150 : 210) + "px");
  S.style.setProperty("--pw", (TALL ? 520 : 400) + "px");
  S.style.setProperty("--cg", (TALL ? 26 : 70) + "px");
  S.style.setProperty("--gbw", (TALL ? 760 : 620) + "px");
  $("kvImg").src = "../../assets/about/art/" + (TALL ? "kv-tall" : "kv-wide") + ".webp";
  $("mBg").src = $("kvImg").src;

  /* 박자: 첫 박 2.0초, 한 박 0.534초(112BPM) */
  var B0 = 2.0, BT = 0.534, bt = function (n) { return B0 + n * BT; };
  var END = 46;   // v2 에서 아래 타임라인이 덮어쓴다
  window.TIMING = { END: END, B0: B0, BT: BT };

  var cl = function (x, a, b) { return Math.max(a == null ? 0 : a, Math.min(b == null ? 1 : b, x)); };
  var pr = function (t, a, b) { return cl((t - a) / (b - a)); };
  var oC = function (p) { return 1 - Math.pow(1 - p, 3); };
  var oB = function (p) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
  var oE = function (p) { return p === 1 ? 1 : 1 - Math.pow(2, -10 * p); };
  function set(el, o, tr) { el.style.opacity = o; if (tr != null) el.style.transform = tr; }
  function vis(t, a, b, fi, fo) { return Math.min(pr(t, a, a + (fi || .001)), 1 - pr(t, b - (fo || .001), b)); }

  // 결정적 난수(프레임마다 같은 값)
  function rnd(seed) { var x = Math.sin(seed * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

  var cv = $("cv"), ctx = cv.getContext("2d"); cv.width = W; cv.height = H;
  function bolt(x, seed, a, w) {
    if (a <= 0) return;
    var pts = [], y = -20, k = 0;
    while (y < H + 20) { pts.push([x + (rnd(seed + k) - .5) * (TALL ? 70 : 60), y]); y += 30 + rnd(seed + k + 99) * 50; k++; }
    ctx.save(); ctx.globalAlpha = a; ctx.shadowColor = "#c9a2ff"; ctx.shadowBlur = 40;
    [[w * 4, "rgba(200,150,255,.6)"], [w, "#fff"]].forEach(function (s) { ctx.lineWidth = s[0]; ctx.strokeStyle = s[1]; ctx.beginPath(); pts.forEach(function (p, i) { i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }); ctx.stroke(); });
    ctx.restore();
  }
  function boltH(y, seed, a, w) {   // 가로로 지나가는 번개 — 세로판 VS 는 위아래로 갈라서
    if (a <= 0) return;
    var pts = [], x = -20, k = 0;
    while (x < W + 20) { pts.push([x, y + (rnd(seed + k) - .5) * 60]); x += 30 + rnd(seed + k + 99) * 50; k++; }
    ctx.save(); ctx.globalAlpha = a; ctx.shadowColor = "#c9a2ff"; ctx.shadowBlur = 40;
    [[w * 4, "rgba(200,150,255,.6)"], [w, "#fff"]].forEach(function (s) { ctx.lineWidth = s[0]; ctx.strokeStyle = s[1]; ctx.beginPath(); pts.forEach(function (p, i) { i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }); ctx.stroke(); });
    ctx.restore();
  }
  function embers(t, n, a) {   // 위로 떠오르는 불씨 — 시간의 함수로 위치를 계산
    for (var i = 0; i < n; i++) {
      var sx = rnd(i) * W, sp = 60 + rnd(i + 7) * 160, ph = rnd(i + 3) * 10;
      var y = H - ((t * sp + ph * 200) % (H + 100)), x = sx + Math.sin(t * 1.3 + i) * 30;
      var red = rnd(i + 5) < .5; ctx.fillStyle = red ? "rgba(255,120,90," + a + ")" : "rgba(120,170,255," + a + ")";

  }
  function ring(cx, cy, p, col) {   // 원형 충격파(방사형 빛줄기 금지)

  }

  var VS = [["부먹", "찍먹"], ["민초", "반민초"], ["짜장", "짬뽕"], ["강아지", "고양이"], ["여름", "겨울"], ["아침형", "저녁형"], ["깻잎 OK", "깻잎 NO"], ["바로 답장", "천천히"]];
  var CLS = [
    { a: "class-gladiator", c: "#ff4d64", code: "CLASS HA", n: "돌격 검투사", e: "ASSAULT GLADIATOR" },
    { a: "class-gatekeeper", c: "#ff8a3d", code: "CLASS HD", n: "열혈 수문장", e: "BLAZING GATEKEEPER" },
    { a: "class-sniper", c: "#5ee1ff", code: "CLASS CA", n: "냉혈 저격수", e: "COLD-BLOODED SNIPER" },
    { a: "class-shield", c: "#7a8bff", code: "CLASS CD", n: "침착한 방패", e: "STEADFAST SHIELD" }
  ];
  var MON = [["s-trend", "핫트렌드"], ["s-search", "통합검색"], ["s-galvis", "갈비스"], ["s-talk", "갈라톡 · 삐삐"], ["s-home", "지금 뜨는 판"], ["s-battle", "댓글 대전"], ["s-predict", "갈라예측"], ["s-trend", "실시간 급상승"]];
  var crownSvg = '<svg viewBox="0 0 64 64"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3cf"/><stop offset=".55" stop-color="#e7cd8f"/><stop offset="1" stop-color="#9d7a35"/></linearGradient></defs><path d="M8 24l12 10 12-20 12 20 12-10-5 26H13z" fill="url(#cg)" stroke="#fff6dc" stroke-width="1.5" stroke-linejoin="round"/><rect x="13" y="50" width="38" height="6" rx="2" fill="url(#cg)"/><circle cx="32" cy="40" r="3.4" fill="#ff5a6e"/></svg>';
  $("crowns").innerHTML = ["이슈왕", "광장왕", "숏판왕", "롱판왕", "예측왕"].map(function (n) { return '<div class="crown">' + crownSvg + "<span>" + n + "</span></div>"; }).join("");
  if (TALL) { $("crowns").style.flexWrap = "wrap"; $("crowns").style.padding = "0 80px"; $("crowns").style.rowGap = "40px"; }

  // ── v2 타임라인(26.10.15 "정적이다, 다이나믹하게 전면 개편") ──
  // 곡은 b48(27.632초)에서 곡의 b66(37.244초) 엔딩으로 바로 넘어간다(mux 에서 같은 지점으로 잘라 붙임)
  END = 34.9; window.TIMING.END = END; window.TIMING.CUT = [bt(48), 37.244];
  var T = { kv: [0, bt(8)], vs: [bt(8), bt(16)], p1: [bt(16), bt(20)], p2: [bt(20), bt(24)], p3: [bt(24), bt(28)],
    c: [bt(28), bt(36)], k: [bt(36), bt(40)], g: [bt(40), bt(42)], m: [bt(42), bt(48)], e: [bt(48), END] };
  window.TIMING.scenes = T;
  // 타격 지점(흔들림·색번짐·효과음) — 세기 함께
  var HITS = [[bt(0), 1.4], [bt(4), 1.0]];
  for (var i = 0; i < 8; i++) HITS.push([bt(8 + i), i % 2 ? .7 : .9]);
  [bt(16), bt(20), bt(24)].forEach(function (x) { HITS.push([x, 1.0]); });
  for (i = 0; i < 4; i++) HITS.push([bt(28 + i * 2), 1.2]);
  HITS.push([bt(36), 1.0]); for (i = 0; i < 5; i++) HITS.push([bt(36.5 + i * .5), .45]);
  HITS.push([bt(40), .9]); for (i = 0; i < 12; i++) HITS.push([bt(42 + i * .5), .5]);
  HITS.push([bt(48), 1.6]);
  window.TIMING.hits = HITS;
  var WHOOSH = [bt(8) - .2, bt(16) - .2, bt(20) - .2, bt(24) - .2, bt(28) - .2, bt(30) - .15, bt(32) - .15, bt(34) - .15, bt(36) - .2, bt(40) - .2, bt(42) - .15];
  window.TIMING.whoosh = WHOOSH;

  function hitAmp(t, k) { var a = 0; for (var i = 0; i < HITS.length; i++) { var d = t - HITS[i][0]; if (d >= 0 && d < 1) a += HITS[i][1] * Math.exp(-d * (k || 10)); } return a; }
  function speedLines(t, a, dir) {   // 가로 속도선(방사형 아님)
    if (a <= 0) return; ctx.save(); ctx.globalCompositeOperation = "lighter";
    for (var i = 0; i < 70; i++) {
      var y = rnd(i * 3.1) * H, len = 200 + rnd(i + 1.7) * 700, sp = 2600 + rnd(i + 4) * 3000;
      var x = (dir || -1) < 0 ? W - ((t * sp + rnd(i) * 4000) % (W + len)) : ((t * sp + rnd(i) * 4000) % (W + len)) - len;
