    html, body { height: 100%; margin: 0; background: #0a0a0b; overflow: hidden; overscroll-behavior: none; }
    /* position:fixed — 주입되는 페이지 CSS가 body 레이아웃(display:flex 등)을 바꿔도 트랙이
       영향 안 받게 문서 흐름에서 분리한다(body flex-center가 트랙을 -1764px로 밀던 실사고). */
    #tab-track {
      position: fixed; left: 0; top: 0;
      display: flex; height: 100dvh; width: 500dvw;
      will-change: transform; transform: translateX(0);
    }
    /* 🫧 쫀쫀한 탭 전환 — 짧고 탄탄한 스냅(인스타식). 살짝 빠르게 미끄러져 딱 멈춘다. */
    #tab-track.anim { transition: transform .22s cubic-bezier(.32,.72,0,1); }
    /* ⚠️ transform: translateZ(0) 필수 — 페이지들의 position:fixed(탭바·컴포저 등)가 '판'을
       containing block으로 잡게 한다(판=뷰포트 크기라 시각적으로 fixed와 동일). 없으면 fixed가
       transform된 트랙 기준이 되어 화면 밖으로 날아간다(iframe 시절엔 판이 자기 뷰포트라 없던 문제). */
    .tab-pane { width: 100dvw; height: 100dvh; flex: 0 0 auto; position: relative; background: #0a0a0b; overflow: hidden; transform: translateZ(0); }

    .tab-pane .view-host { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }

<!-- 📞 네이티브 WebRTC(iosrtc) 로더 — iOS 네이티브 앱에서만(기존 셸과 동일) -->
<script>
(function(){
  var C = window.Capacitor;
  if (!(C && C.getPlatform && C.getPlatform() === 'ios' && C.isNativePlatform && C.isNativePlatform())) return;
  window.__iosrtcReady = false;
  function load(src){ return new Promise(function(res){ var s=document.createElement('script'); s.src=src; s.onload=function(){res(true)}; s.onerror=function(){res(false)}; document.head.appendChild(s); }); }
  load('/native/cordova.js').then(function(){
    try { if (window.cordova && cordova.require && !window.require) window.require = cordova.require; } catch(e){}
    return load('/native/iosrtc.umd.js');
  }).then(function(){
    function reg(){
      if (window.__iosrtcReady) return;
      try {
        var rtc = window.iosrtc || (window.cordova && cordova.plugins && cordova.plugins.iosrtc);
        // 🎙 registerGlobals가 getUserMedia를 iosrtc판으로 치환하기 전, 원본을 백업.
        //    삐삐/음성 녹음은 MediaRecorder 호환 위해 이 원본을 쓴다(iosrtc 스트림은 MediaRecorder 비호환).
        try { if (navigator.mediaDevices && !navigator.mediaDevices.__origGetUserMedia) navigator.mediaDevices.__origGetUserMedia = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices); } catch(e){}
        // 📞 DIY(iosrtc) 통화 — 네이티브 WebRTC 전역 등록(잠금/CallKit 답변 시 오디오세션 협조를 위해 필수).
        //    (Agora 웹SDK는 CallKit과 오디오세션 충돌로 잠금답변 한방향 → DIY 네이티브로 복귀.)
        if (rtc && rtc.registerGlobals) { rtc.registerGlobals(); window.__iosrtcReady = true; window.__iosrtc = rtc; }
      } catch(e){}
    }
    document.addEventListener('deviceready', function(){ setTimeout(reg, 100); }, { once:true });
    setTimeout(reg, 2500); setTimeout(reg, 5000);
  });
})();
</script>

<script>

<script>
/* 📞 CallKit/VoIP — 단일 문서라 중계 없이 이 문서의 통화 엔진이 직접 받는다.
   (기존 셸의 broadcastToPanes postMessage 전체가 불필요해짐) */
</script>
<script>
/* 🔄 버전 감지 — 새 배포가 뜨면 리로드(입력 중이면 보류). 구셸 로직 계승.
   (소프트 갱신은 후속 — 우선 앱이 옛 버전에 갇히지 않게) */
(function () {
  // 📦 로컬 번들(네이티브 앱) 로드면 version.txt 리로드 비활성 — 갱신은 OTA(Live Updates)가 담당.
  //   웹/원격로딩(galla.im)은 그대로 동작(hostname 판별). 이게 없으면 로컬 문서를 원격 v와 비교해 무한 리로드.
  try { if (location.protocol === 'capacitor:' || location.hostname === 'localhost' || location.protocol === 'file:') return; } catch (_) {}
  var loaded = null;
  function get() {
    return fetch('/version.txt?_=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.text() : null; })
      .then(function (t) { return t ? t.trim() : null; })
      .catch(function () { return null; });
  }
  function busy() {
    var a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA)$/.test(a.tagName)) return true;
    if (a && a.isContentEditable) return true;
    return false;
  }
  var reloading = false;
  function hardReload() {
    if (reloading) return; reloading = true;
    (async function () {
      // ⚠️ Cache API 통삭제 금지 — 리로드 후 CSS가 캐시에 없어 'CSS 미적용 화면 번쩍(FOUC)'을
      //   유발(사장님 재현). js/css는 SW network-first + ?v 버전드, 문서는 아래 ?_v 버스터라
      //   캐시를 비우지 않아도 항상 최신이 온다. → 캐시는 건드리지 않고 SW만 갱신.
      // 리로드된 문서에서 스플래시가 다시 떠 FOUC를 가리도록 세션 플래그 해제.
      try { sessionStorage.removeItem('galla_splashed'); } catch (_) {}
      try { if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) { var rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(function (r) { return r.update().catch(function () {}); })); } } catch (_) {}
      // ⚠️ WKWebView는 location.reload()로도 옛 문서를 캐시에서 다시 주므로 URL 캐시버스터로 '새 문서' 강제.
      if (window.gallaHardReload) { window.gallaHardReload(); return; }
      try { location.replace(location.pathname + '?_v=' + Date.now() + location.hash); } catch (_) { try { location.reload(); } catch (__) {} }
    })();
  }
  function check() {
    get().then(function (v) {
      if (!v) return;
      if (loaded == null) { loaded = v; return; }
      // ✍️ 작성 중이면 리로드 보류(내용 유실 방지) — loaded를 갱신 안 해 다음 체크(작성 종료 후)에 반영.
      if (v !== loaded && !busy() && !(window.GALLA_isWriting && window.GALLA_isWriting())) { loaded = v; hardReload(); }
    });
  }
  check();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
  setInterval(check, 90000);
})();
</script>
