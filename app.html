  <style>
    /* ═══ 🚀 갈라 SPA 셸 — 단일 문서. 탭 5개 keep-alive 판 + 상세 스택. iframe 없음 ═══ */
    html, body { height: 100%; margin: 0; background: #0a0a0b; overflow: hidden; overscroll-behavior: none; }
    /* position:fixed — 주입되는 페이지 CSS가 body 레이아웃(display:flex 등)을 바꿔도 트랙이
       영향 안 받게 문서 흐름에서 분리한다(body flex-center가 트랙을 -1764px로 밀던 실사고). */
    /* 🧲 탭 줄 = 폰이 직접 처리하는 가로 스크롤 + 한 장씩 스냅(26.9.19 사장님: 「스크롤하다 옆으로 샘·흐물·살짝 밀어도 넘어감·멈춤 느슨」).
       예전엔 JS 가 translateX 로 판을 끌었다 — iOS 는 손가락이 몇 px 움직이면 세로 스크롤을 먼저 시작해 버려,
       JS 가 늦게 '가로'로 판정해도 세로 스크롤을 멈출 수 없었다(동시에 움직여 흐물·옆으로 샘).
       이제 방향 판정·손가락 추종·감속·스냅은 OS 가 한다(인스타·네이티브 페이징과 같은 물리). */
    #tab-track {
      position: fixed; left: 0; top: 0; width: 100dvw; height: 100dvh;
      display: flex; overflow-x: auto; overflow-y: hidden;
      scroll-snap-type: x mandatory; overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    #tab-track::-webkit-scrollbar { display: none; }
    #tab-track > .tab-pane { scroll-snap-align: start; scroll-snap-stop: always; }   /* 세게 튕겨도 한 번에 한 장 */
    /* 탭 넘기기를 막는 순간 — DM 대화방·맛집 상세·지도·여행 지도·릴스·핫튜브 재생·댓글·갈비스 대화 */
    body.dm-detail #tab-track, body.fd-detail-on #tab-track, body.fd-map-on #tab-track, body.tv-lock #tab-track,
    body.shorts-open #tab-track, body.hv-playing #tab-track, body.comment-open #tab-track, body.fr-chatting #tab-track,
    body.spa-editing #tab-track { overflow-x: hidden; }
    /* 안쪽 가로 스크롤(칩 줄·캐러셀)은 끝에 닿아도 바깥 탭으로 번지지 않게 */
    #tab-track .chip-scroll, #tab-track .news-category-chips, #tab-track .hv-cats, #tab-track .cat-chips, #tab-track .plaza-categories,
    #tab-track .hv-mode, #tab-track .tabs-header, #tab-track .dm-tabs, #tab-track .fp-row, #tab-track .fd-seg, #tab-track .tv-dash-tabs { overscroll-behavior-x: contain; }
    /* JS 로 넘기는 캐러셀은 가로를 브라우저가 가져가지 않게(탭이 대신 넘어가던 것 방지) */
    #tab-track .carousel-wrap, #tab-track .carousel-slides { touch-action: pan-y; }
    /* 세로 스크롤 상자가 overflow:auto(가로 포함)면 판 가로 손길을 먹는다(DM 받은함에서 탭이 안 넘어감 실측) — 세로 전용으로 */
    #tab-track :is(#dm-inbox-wrap, #plaza-body, .plaza-modal-box, .pm-modal-inner, #mDesc) { overflow-x: hidden; }
    /* ⚠️ transform: translateZ(0) 필수 — 페이지들의 position:fixed(탭바·컴포저 등)가 '판'을
       containing block으로 잡게 한다(판=뷰포트 크기라 시각적으로 fixed와 동일). 없으면 fixed가
       transform된 트랙 기준이 되어 화면 밖으로 날아간다(iframe 시절엔 판이 자기 뷰포트라 없던 문제). */
    .tab-pane { width: 100dvw; height: 100dvh; flex: 0 0 auto; position: relative; background: #0a0a0b; overflow: hidden; transform: translateZ(0); }
    /* 각 판의 콘텐츠는 자체 세로 스크롤 — 문서 스크롤은 잠금 */
    /* ⚠️ overflow-x: hidden 필수 — auto 면 내용이 소수점만큼만 넓어도 판이 가로 손길을 먹어 탭이 안 넘어가고(예측 판 실측),
       아이폰에선 판이 옆으로 몇 px 흐물거렸다(「헐렁」). 판은 세로로만 스크롤한다. */
    .tab-pane .view-host { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
    /* 상세 스택 — 탭 위를 덮는 레이어. push=우→좌 슬라이드 인, pop=슬라이드 아웃 */
    #stack-root { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
    #stack-root.on { pointer-events: auto; }
    .stack-view {
      position: absolute; inset: 0; background: #0a0a0b;
      transform: translateX(100%); transition: transform .26s cubic-bezier(.32,.72,0,1);
    }
    .stack-view.in { transform: translateX(0); }
    .stack-view .view-host { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
    /* ✍️ 전체화면 에디터(글쓰기·확인·제보 등)가 열리면 하단 탭 네비를 숨긴다 —
       네비(z 9999)가 스택 뷰(z 40) 위라 '다음 단계·발행' CTA를 덮어 탭이 네비로 새던 버그 수정 */
    body.spa-editing .nav { display: none !important; }
    /* 로딩/에러 */
    .pane-wait { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .pane-wait i { width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.14);
      border-top-color: #6f86ff; animation: spspin .7s linear infinite; }
    @keyframes spspin { to { transform: rotate(360deg); } }
    .pane-err { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #9aa0ae; text-align: center; font-size: 14px; line-height: 1.7; }
    /* 네비(글라이더 캡슐) — 기존 셸 스타일 계승 */
    .nav-inner { position: relative; }
    .nav-inner .nav-item { position: relative; z-index: 1; }
    .nav-inner .nav-item.active { background: none; }
    #nav-glider { position: absolute; top: 50%; left: 0; width: 56px; height: 40px; margin-top: -20px;
      border-radius: 20px; background: rgba(255, 255, 255, .12); z-index: 0;
      transition: transform .24s cubic-bezier(.32, .72, 0, 1), opacity .18s ease;
      opacity: 0; pointer-events: none; }
    /* 🫳 네비 끌기 중 — 캡슐이 손가락을 따라온다(transition 끔은 router.js). 지나가는 아이콘만 살짝 키운다 */
    .nav-inner.scrubbing #nav-glider { background: rgba(255, 255, 255, .17); }
    .nav-inner .nav-item img { transition: transform .12s ease; }
    .nav-inner .nav-item.scrub-hover img { transform: scale(1.12); }
    /* 🔒 비로그인 잠금 판(DM·마이) — 그 탭 화면을 흐릿하게 깔고 로그인·가입 카드(로그인 화면 push 대신, 스와이프 유지) */
    .lock-host { overflow: hidden !important; }
    .lock-preview { filter: blur(8px) saturate(.8); opacity: .5; pointer-events: none; user-select: none; transform: scale(1.03); }
    .lock-cta { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;

    .lock-card { width: 100%; max-width: 320px; text-align: center; padding: 26px 20px 20px; border-radius: 20px;
      background: rgba(22,23,29,.92); border: 1px solid rgba(255,255,255,.08); box-shadow: 0 24px 60px rgba(0,0,0,.5); }
    .lock-ico { font-size: 32px; line-height: 1; }
    .lock-t { margin: 12px 0 6px; font-size: 17px; font-weight: 900; color: #fff; letter-spacing: -.02em; }
    .lock-s { margin-bottom: 18px; font-size: 13px; line-height: 1.55; color: #aab0bd; }
    .lock-login, .lock-signup { display: block; width: 100%; height: 48px; border-radius: 14px; font-size: 15px; font-weight: 800; cursor: pointer; }
    .lock-login { border: 0; background: linear-gradient(135deg, #3d6bff, #5a86ff); color: #fff; }
    .lock-signup { margin-top: 8px; background: transparent; border: 1px solid rgba(255,255,255,.16); color: #e6e8ee; }
  </style>

<!-- 📞 네이티브 WebRTC(iosrtc) 로더 — iOS 네이티브 앱에서만(기존 셸과 동일) -->
<script>
(function(){
  var C = window.Capacitor;
  if (!(C && C.getPlatform && C.getPlatform() === 'ios' && C.isNativePlatform && C.isNativePlatform())) return;
  window.__iosrtcReady = false;
  function load(src){ return new Promise(function(res){ var s=document.createElement('script'); s.src=src; s.onload=function(){res(true)}; s.onerror=function(){res(false)}; document.head.appendChild(s); }); }
  load('/native/cordova.js').then(function(){
    try { if (window.cordova && cordova.require && !window.require) window.require = cordova.require; } catch(e){}
    return load('/native/iosrtc.umd.js');
  }).then(function(){
    function reg(){
      if (window.__iosrtcReady) return;
      try {
        var rtc = window.iosrtc || (window.cordova && cordova.plugins && cordova.plugins.iosrtc);
        // 🎙 registerGlobals가 getUserMedia를 iosrtc판으로 치환하기 전, 원본을 백업.
        //    삐삐/음성 녹음은 MediaRecorder 호환 위해 이 원본을 쓴다(iosrtc 스트림은 MediaRecorder 비호환).
        try { if (navigator.mediaDevices && !navigator.mediaDevices.__origGetUserMedia) navigator.mediaDevices.__origGetUserMedia = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices); } catch(e){}
        // 📞 DIY(iosrtc) 통화 — 네이티브 WebRTC 전역 등록(잠금/CallKit 답변 시 오디오세션 협조를 위해 필수).
        //    (Agora 웹SDK는 CallKit과 오디오세션 충돌로 잠금답변 한방향 → DIY 네이티브로 복귀.)
        if (rtc && rtc.registerGlobals) { rtc.registerGlobals(); window.__iosrtcReady = true; window.__iosrtc = rtc; }
      } catch(e){}
    }
    document.addEventListener('deviceready', function(){ setTimeout(reg, 100); }, { once:true });
    setTimeout(reg, 2500); setTimeout(reg, 5000);
  });
})();
</script>

(function () {
