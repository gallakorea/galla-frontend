<body data-page="predict">
<div id="app">

<header class="header">

    <img src="assets/logo.png" alt="GALLA" class="logo" onclick="(window.GALLA_nav||function(u){location.href=u})('index.html')" />

  <div class="gh-tabs">

    <button class="gh-tab" data-tab="ledger">🪙 GP 내역</button>
    <button class="gh-tab" data-tab="gc">💝 갈라코인</button>
  </div>

  <div id="ghBets" class="gh-pane"></div>
  <div id="ghLedger" class="gh-pane" hidden></div>
  <div id="ghGc" class="gh-pane" hidden></div>
