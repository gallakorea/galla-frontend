<body data-page="mypage">
<div id="app">

<header class="header">
  <div class="header-inner">
    <button class="back-btn hb-side" data-back="wallet.html">← <span class="back-text">뒤로</span></button>
    <img src="assets/logo.png" alt="GALLA" class="logo" onclick="(window.GALLA_nav||function(u){location.href=u})('index.html')" />
    <button class="more-header-btn setting-btn" aria-label="설정" onclick="(window.GALLA_nav||function(u){location.href=u})('settings.html')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>
  </div>
</header>

<main class="cg-main">
  <section class="cg-hero">
    <div class="cg-hero-lbl">💳 갈라페이</div>
    <div class="cg-hero-n" id="cgBal">–</div>
    <div class="cg-hero-sub" id="cgSub">결제·환불·출금이 여기로 지나갑니다</div>
  </section>

  <div class="cg-tabs">
    <button class="cg-tab active" data-tab="all">전체 내역</button>
    <button class="cg-tab" data-tab="charge">💳 결제·영수증</button>
    <button class="cg-tab" data-tab="refund">↩️ 환불</button>
  </div>

  <div id="cgAll"    class="cg-pane"></div>
  <div id="cgCharge" class="cg-pane" hidden></div>
  <div id="cgRefund" class="cg-pane" hidden></div>

  <section class="cg-policy">
    <div class="cg-policy-h">ℹ️ 환불 안내</div>
    <ul>
      <li>결제일로부터 <b>7일 이내</b>이고 충전한 GC를 <b>쓰지 않았다면</b> 전액 환불(청약철회)됩니다.</li>
      <li>일부만 썼다면 <b>남은 GC만큼</b> 환불되고, 위약금은 받지 않습니다.</li>
      <li>7일이 지난 뒤에도 <b>남은 GC</b>는 환불 신청할 수 있어요 (확인 후 처리).</li>
      <li>이미 <b>쓴 GC</b>(AI 창작·갈비스 고급·후원)는 돌려드릴 수 없습니다.</li>
      <li>환불은 <b>결제하신 수단</b>으로 환급되며, 신청 후 영업일 기준 3~5일이 걸립니다.</li>
      <li>문제가 있으면 <a href="support.html">고객센터</a>로 알려주세요.</li>
    </ul>
  </section>
</main>
