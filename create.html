<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
<meta name="galla-ver" content="0828024"><!-- 배포 도장 — 스냅샷 무효화 기준(스크립트 순서 무관) -->

  <link rel="stylesheet" href="./css/nav.css?v=0808104">
  <link rel="stylesheet" href="./css/create.css?v=080412">

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/app-icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/app-icons/favicon-16.png">
  <link rel="apple-touch-icon" href="/assets/app-icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">

<!-- data-page는 비워둔다 — "index"로 두면 nav.js가 홈 버튼을 '현재 페이지'로 보고 이동을 막는다 -->
<body data-page="create">
<div id="app">

  <header class="header header-common">
    <div class="header-inner cr-head">
      <!-- 뒤로가기 = 직전 페이지(사장님 룰: DM에서 오면 DM, 홈에서 오면 홈).
           같은 오리진 히스토리가 있으면 back(), 직접 진입(공유 링크 등)이면 홈 폴백. -->
      <button class="cr-back" aria-label="닫기"
        onclick="(history.length > 1 && document.referrer && document.referrer.indexOf(location.origin) === 0) ? history.back() : location.href='index.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="cr-title">새로 만들기</span>
      <span class="cr-spacer"></span>
    </div>
  </header>

  <main class="cr-main">
    <h1 class="cr-h1">무엇을 만들까요?</h1>
    <p class="cr-sub">유형을 고르면 그에 맞는 작성 화면으로 이동합니다.</p>

    <div class="cr-list" id="crList">

      <!-- 갈라 발제 -->
      <button class="cr-card" data-type="galla" style="--cr:#ff4d67">
        <span class="cr-ico">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.92 5H5l9 9 1.92-1.92L6.92 5zM2 20.5L3.5 22l6.6-6.6-1.5-1.5L2 20.5zM19 3l-4.5 4.5 1.5 1.5L21 4.5V3h-2zM14.5 15.5L16 17l-1.9 1.9L15.5 20 22 13.5 20.5 12 14.5 15.5z"/></svg>
        </span>
        <span class="cr-tx">
          <span class="cr-t">갈라 발제 <span class="cr-lock" hidden>곧 열려요</span></span>
          <span class="cr-d">찬반이 갈리는 이슈를 던져 전투를 시작합니다</span>
        </span>
        <span class="cr-go">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </span>
      </button>

      <!-- 숏판 (세로 릴스) — 진영 없는 일반 콘텐츠. 기본 숨김(운영진/플래그 때만 노출) -->
      <button class="cr-card" data-type="short" style="--cr:#a855f7" hidden>
        <span class="cr-ico">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm3.5 5.5v7l6-3.5-6-3.5z"/></svg>
        </span>
        <span class="cr-tx">
          <span class="cr-t">숏판</span>
          <span class="cr-d">⚡ 세로 릴스 — 사진·짧은 세로영상 올려 소통하고 후원받아요</span>
        </span>
        <span class="cr-go">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </span>
      </button>

      <!-- 롱판 (가로 유튜브식) — 진영 없는 일반 콘텐츠. 기본 숨김(운영진/플래그 때만 노출) -->
      <button class="cr-card" data-type="long" style="--cr:#a855f7" hidden>
        <span class="cr-ico">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm7 3.5v7l6-3.5-6-3.5z"/></svg>
        </span>
        <span class="cr-tx">
          <span class="cr-t">롱판</span>
          <span class="cr-d">🎬 가로 유튜브식 — 가로 영상 올려 소통하고 후원받아요</span>
        </span>
        <span class="cr-go">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </span>
      </button>

      <!-- 예측 마켓 -->
      <button class="cr-card" data-type="predict" style="--cr:#3d6bff">
        <span class="cr-ico">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/></svg>
        </span>
        <span class="cr-tx">
          <span class="cr-t">예측 마켓</span>
          <span class="cr-d">결과를 두고 GP로 겨루는 예측을 개설합니다</span>
        </span>
        <span class="cr-go">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </span>
      </button>

      <!-- 광장 글 -->
      <button class="cr-card" data-type="plaza" style="--cr:#c9d1e0">
        <span class="cr-ico">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18 11v2h4v-2h-4zm-2 6.61c.96.71 2.21 1.65 3.2 2.39.4-.53.8-1.07 1.2-1.6-.99-.74-2.24-1.68-3.2-2.4-.4.54-.8 1.08-1.2 1.61zM20.4 5.6c-.4-.53-.8-1.07-1.2-1.6-.99.74-2.24 1.68-3.2 2.4.4.53.8 1.07 1.2 1.6.96-.72 2.21-1.65 3.2-2.4zM4 9c-1.1 0-2 .9-2 2v2c0 1.1.9 2 2 2h1v4h2v-4h1l5 3V6L8 9H4zm11.5 3c0-1.33-.58-2.53-1.5-3.35v6.69c.92-.81 1.5-2.01 1.5-3.34z"/></svg>
        </span>
        <span class="cr-tx">
          <span class="cr-t">광장 글</span>
          <span class="cr-d">글·짤·밈으로 노는 갈라 커뮤니티에 올려요</span>
        </span>
        <span class="cr-go">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </span>
      </button>

      <!-- 제보 -->
      <button class="cr-card" data-type="report" style="--cr:#33d17a">
        <span class="cr-ico">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        </span>
        <span class="cr-tx">
          <span class="cr-t">제보하기</span>
          <span class="cr-d">사진·영상·링크로 제보하고 GP 보상을 받습니다</span>
        </span>
        <span class="cr-go">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </span>
      </button>
          <!-- 버그 신고 -->
      <button class="cr-card" data-type="bug" style="--cr:#ffa63c" onclick="window.GALLA_openBugReport&&GALLA_openBugReport()">
        <span class="cr-ico">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 8h-2.81a5.985 5.985 0 0 0-1.82-1.96L17 4.41 15.59 3l-2.17 2.17a6.002 6.002 0 0 0-2.83 0L8.41 3 7 4.41l1.62 1.63A5.985 5.985 0 0 0 6.81 8H4v2h2.09c-.05.33-.09.66-.09 1v1H4v2h2v1c0 .34.04.67.09 1H4v2h2.81a5.985 5.985 0 0 0 10.38 0H20v-2h-2.09c.05-.33.09-.66.09-1v-1h2v-2h-2v-1c0-.34-.04-.67-.09-1H20V8zm-6 8h-4v-2h4v2zm0-4h-4v-2h4v2z"/></svg>
        </span>
        <span class="cr-tx">
          <span class="cr-t">버그 신고</span>
          <span class="cr-d">오류·이상한 점을 알려주시면 바로 고쳐요</span>
        </span>
        <span class="cr-go">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </span>
      </button>
    </div>

    <a class="cr-earn-link" href="creator.html">
      <span class="cr-earn-ic">💰</span>
      <span class="cr-earn-tx">
        <b>내 콘텐츠로 후원받는 법</b>
        <span>후원의 75%가 창작자 몫 · 배분·출금 안내</span>
      </span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </a>
  </main>

</div>

    <button class="nav-item" data-page="trend" data-target="search.html"><img src="./assets/icons/nav-trend.svg" data-base="./assets/icons/nav-trend.svg" data-active="./assets/icons/nav-trend-active.svg"></button>
